    padding:0!important;
    margin:0!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .dmrGroup{
    margin:0 0 3px!important;
    border-radius:9px!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .dmrGroupHead{
    min-height:30px!important;
    padding:3px 6px!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .dmrGroupBody{
    display:flex!important;
    flex-direction:column!important;
    grid-template-columns:none!important;
    gap:3px!important;
    padding:3px!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #cardList .cardRow,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList .cardRow{
    width:100%!important;
    min-width:0!important;
    min-height:62px!important;
    height:auto!important;
    grid-template-columns:minmax(0,1fr) 92px!important;
    gap:4px!important;
    padding:4px 5px!important;
    border-radius:8px!important;
    margin:0!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #cardList .cardRow .btns,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #cardList .cardRow .cardCtrl,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList .cardRow .btns,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList .cardRow .cardCtrl{
    grid-template-columns:26px minmax(30px,1fr) 26px!important;
    grid-auto-rows:24px!important;
    gap:2px!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #cardList .cardRow .btns button,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList .cardRow .btns button,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #cardList .cardRow .cardCtrl button,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList .cardRow .cardCtrl button,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #cardList .cardRow .count,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList .cardRow .count,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #cardList .cardRow .countBox,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList .cardRow .countBox{
    min-height:24px!important;
    height:24px!important;
