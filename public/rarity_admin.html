  <style>
    :root {
      --bg: #090b10;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.09);
      --line: rgba(255,255,255,.13);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --r: #8fd0ff;
      --sr: #d4adff;
      --ssr: #ffd166;
      --ok: #78e3ad;
      --bad: #ff7a90;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 580px at 14% 0%, rgba(143,208,255,.16), transparent 56%),
        radial-gradient(820px 560px at 88% 0%, rgba(255,209,102,.12), transparent 54%),
        linear-gradient(180deg, #08090d, var(--bg));
    }
    .wrap { width: min(1220px, calc(100vw - 28px)); margin: 0 auto; padding: 18px 0 34px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 22px; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
    button, select, input {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 9px 12px;
      outline: none;
    }
    button { cursor: pointer; font-weight: 800; }
    button:hover { background: rgba(255,255,255,.11); }
    button.primary { border-color: rgba(120,227,173,.38); background: rgba(120,227,173,.12); }
    button.danger { border-color: rgba(255,122,144,.42); background: rgba(255,122,144,.12); }
    input { width: min(420px, 100%); }
    .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      margin-bottom: 12px;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(0,0,0,.20);
    }
    .pill.R { color: var(--r); }
    .pill.SR { color: var(--sr); }
    .pill.SSR { color: var(--ssr); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 10px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      padding: 12px;
      min-width: 0;
    }
    .cardHead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .name { font-weight: 900; line-height: 1.35; word-break: break-word; }
    .id { margin-top: 7px; color: var(--muted); font-size: 12px; word-break: break-all; }
    .meta { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .raritySelect { min-width: 76px; font-weight: 900; }
    .raritySelect.R { border-color: rgba(143,208,255,.45); color: var(--r); }
    .raritySelect.SR { border-color: rgba(212,173,255,.45); color: var(--sr); }
    .raritySelect.SSR { border-color: rgba(255,209,102,.50); color: var(--ssr); }
    .toast { min-height: 22px; margin: 8px 0 12px; color: var(--muted); font-size: 13px; }
    .toast.ok { color: var(--ok); }
    .toast.bad { color: var(--bad); }
    .lock {
      display: none;
      border: 1px solid rgba(255,122,144,.36);
      border-radius: 8px;
      background: rgba(255,122,144,.08);
      padding: 14px;
      margin-bottom: 12px;
    }
    .empty { color: var(--muted); padding: 18px 0; }
    @media (max-width: 760px) {
      header, .bar { grid-template-columns: 1fr; display: grid; }
      .actions { justify-content: flex-start; }
    }
  </style>
