  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .workspace,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #mobileCardSection{
