name: Deck smoke check

on:
  push:
    branches:
      - import/local-latest-20261003
    paths:
      - 'public/deck*.js'
      - 'public/deck.html'
      - 'public/index.html'
      - 'public/profile.html'
      - 'public/gacha.html'
      - 'public/arcade.html'
      - 'public/creator.html'
      - 'public/global_ui_20260821.js'
      - 'public/global_cleanup_20261004.js'
      - 'public/global_mojibake_repair_20261004.js'
      - 'public/global_press_spark_20261004.js'
      - 'public/global_experience_20261005.js'
      - 'public/deck_ui_entry_20261005.js'
      - 'firebase.json'
      - '.github/workflows/deck-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check runtime UI scripts
        run: |
          node --check public/deck_ui_entry_20261005.js
          node --check public/global_ui_20260821.js
          node --check public/global_cleanup_20261004.js
          node --check public/global_mojibake_repair_20261004.js
          node --check public/global_press_spark_20261004.js
          node --check public/global_experience_20261005.js
          node --check public/deck_mobile_refine_20261003.js
          node --check public/deck_mobile_density_20261003.js
          node --check public/deck_mobile_compact_v3_20261004.js
          node --check public/deck_visual_polish_v4_20261004.js
          node --check public/deck_kana_gear_20261004.js
          node --check public/deck_runtime_guard_20261003.js
          node --check public/deck_runtime_guard_v3_20261003.js

      - name: Verify canonical Deck UI entry
        run: |
          grep -q '20261005_ui_entry2' public/deck_ui_entry_20261005.js
          grep -q 'global_ui_20260821.js' public/deck_ui_entry_20261005.js
          grep -q 'card_readings_20261005.js' public/deck_ui_entry_20261005.js
          grep -q 'deck_ui_entry_20261005.js' public/index.html
          grep -q 'deck_ui_entry_20261005.js' public/deck.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [Path('public/index.html'), Path('public/deck.html')]
          old_direct_css = [
              'visual_upgrade_20260805.css',
              'global_ui_20260821.css',
              'ui_stability_20260825.css',
              'mobile_deck_block_final_20260927.css',
          ]
          old_direct_js = [
              'ui_polish.js',
              'deck_layout_guard.js',
              'visual_upgrade_20260805.js',
              'dopagaki_mode.js',
              'mobile_deck_ui.js',
              'ui_stability_20260825.js',
              'global_ui_20260821.js',
              'mobile_home_deck_ui_20260926.js',
              'mobile_deck_block_final_20260927.js',
              'deck_runtime_guard_20261003.js',
          ]

          for page in pages:
              text = page.read_text(encoding='utf-8-sig')
              assert text.count('deck_ui_entry_20261005.js') == 1, (page, 'entry count')
              for name in old_direct_css:
                  assert not re.search(rf'href=["\']\./{re.escape(name)}(?:\?|["\'])', text), (page, name)
              for name in old_direct_js:
                  assert not re.search(rf'src=["\']\./{re.escape(name)}(?:\?|["\'])', text), (page, name)
          PY

      - name: Verify essential deck controls
        run: |
          grep -q 'data-home-action="play"' public/deck.js
          grep -q 'id="roomDrawer"' public/deck.html
          grep -q 'id="roomDrawerToggle"' public/deck.html
          grep -q 'tcgEmergencyBack' public/deck_runtime_guard_v3_20261003.js
          grep -q 'forceDrawer(true)' public/deck_runtime_guard_v3_20261003.js
          grep -q 'deck_mobile_compact_v3_20261004.js' public/deck_runtime_guard_20261003.js
          grep -q 'deck_visual_polish_v4_20261004.js' public/deck_runtime_guard_20261003.js
          grep -q 'deck_kana_gear_20261004.js' public/deck_runtime_guard_20261003.js
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' public/deck_mobile_compact_v3_20261004.js
          grep -q '#deckInfoDock > .deckInfoDockHead' public/deck_mobile_compact_v3_20261004.js
          grep -q '#deckProgressMini .deckProgressMiniHead' public/deck_mobile_compact_v3_20261004.js
          grep -q 'exInfoToggleV4' public/deck_visual_polish_v4_20261004.js
          grep -q 'deckHomeBtn::before' public/deck_visual_polish_v4_20261004.js
          grep -q '#libraryPanelMinBtn' public/deck_visual_polish_v4_20261004.js
          grep -q 'したてや' public/deck_kana_gear_20261004.js
          grep -q 'tcgGearFromTopRight' public/deck_kana_gear_20261004.js
          grep -q 'tcgGearFromBottomLeft' public/deck_kana_gear_20261004.js
          grep -q 'GEAR_DURATION = 2000' public/deck_kana_gear_20261004.js
          grep -q '20261004_spark1' public/global_ui_20260821.js
          grep -q 'global_cleanup_20261004.js' public/global_ui_20260821.js
          grep -q 'global_mojibake_repair_20261004.js' public/global_ui_20260821.js
          grep -q '20261004_mojifix1' public/global_ui_20260821.js
          grep -q 'global_press_spark_20261004.js' public/global_ui_20260821.js
          grep -q 'tcgPressSparkRay' public/global_press_spark_20261004.js
          grep -q 'pointerdown' public/global_press_spark_20261004.js
          grep -q 'global_experience_20261005.js' public/global_press_spark_20261004.js
          grep -q 'window.TCG_FEEDBACK' public/global_experience_20261005.js
          grep -q '通信に失敗しました' public/global_experience_20261005.js
          grep -q 'オフラインです' public/global_experience_20261005.js
          grep -q 'tcgHomeComplete' public/global_experience_20261005.js
          grep -q 'tcgHomeBtnGlow' public/global_experience_20261005.js
          grep -q 'tcgPlaySweep' public/global_experience_20261005.js
          grep -q 'TextDecoder("shift_jis")' public/global_cleanup_20261004.js
          grep -q 'recoverMojibake' public/global_cleanup_20261004.js
          grep -q 'AGGRESSIVE_PAGES' public/global_mojibake_repair_20261004.js
          grep -q 'TextDecoder("shift_jis")' public/global_mojibake_repair_20261004.js
          grep -q 'カード一覧・検索' public/global_cleanup_20261004.js
          grep -q '編集中デッキ' public/global_cleanup_20261004.js
          grep -q 'deckStartConcept' public/global_cleanup_20261004.js
          grep -q 'width:clamp(180px,46vmin,390px)' public/global_cleanup_20261004.js
          grep -q 'ユーザー情報' public/global_cleanup_20261004.js
          grep -q 'SSR 3%' public/global_cleanup_20261004.js
          grep -q 'アーケードモード' public/global_cleanup_20261004.js
          grep -q 'カード工房' public/global_cleanup_20261004.js

      - name: Verify Firebase hosting config
        run: |
          python3 -m json.tool firebase.json >/dev/null
          grep -q 'no-cache' firebase.json
          grep -Fq '"source": "**/*.js"' firebase.json
          grep -Fq '"source": "**/*.css"' firebase.json
          grep -q 'tcg-0bato' .firebaserc
