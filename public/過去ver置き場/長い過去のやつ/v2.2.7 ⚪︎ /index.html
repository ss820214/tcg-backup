<!-- public/index.html -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TCG デッキ編成</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./deck.css" />

  <!-- font (optional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ★調整：ゲーム参加パネルを非表示（DOMは残すので deck.js は壊れにくい） -->
  <style>
    /* 「ゲーム参加！」パネル丸ごと非表示（DOMは残す） */
    .gamePanel{ display:none !important; }

    /* 左列が2段構成想定のとき、上のカード一覧を伸ばして隙間を消す保険 */
    .leftCol{
      display:flex;
      flex-direction:column;
      gap:12px;
      height:calc(100vh - 72px);
      min-height:0;
    }
    .cardsPanel{ flex:1 1 auto; min-height:0; }
    .cardsPanel .scroll{ height:100%; }

    /* NEW: deckName controls（残してOK・deck.jsは無視するだけ） */
    .deckNameRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }
    .deckNameRow .small{ opacity:.85; }
    #deckNameInput{ width:min(420px, 92vw); max-width:520px; }

    /* NEW: header mini form */
    .nameEditRow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      margin-top:8px;
    }
    .nameEditRow input{
      width:min(240px, 70vw);
    }
    .miniMsg{ font-size:12px; opacity:.85; margin-top:4px; }
  </style>
</head>

<body data-filterType="ALL" data-searching="0">
  <!-- ===== Topbar ===== -->
  <header class="topbar">
    <div class="topLeft">
      <div class="titleRow">
        <div class="title">デッキ編成</div>

        <div class="nickPill">
          <span class="small">ニックネーム</span>
          <b id="nicknameLabel">---</b>
        </div>
      </div>

      <div class="small metaRow">
        room: <b id="roomIdLabel">----</b>
        <span class="dot">•</span>
        player: <b id="playerIdLabel">----</b>
      </div>

      <!-- ★追加：プレイヤー名編集（deck.js が拾うID） -->
      <div class="nameEditRow">
        <input id="playerName" class="ghost" placeholder="プレイヤー名（例：Terada）" maxlength="16" />
        <button id="btnSaveName" class="ghost" type="button">名前を保存</button>

        <!-- ★追加：Joinコード入力（deck.js が拾うID） -->
        <input id="joinRoomId" class="ghost" placeholder="参加roomId（4桁）" inputmode="numeric" maxlength="4" />
      </div>
      <div id="nameMsg" class="miniMsg"></div>
    </div>

    <div class="topRight">
      <!-- deck.js がここに「ルーム作成 / ルーム参加」を自動注入する（設定の左） -->
      <button id="btnSettings" class="ghost">設定</button>
      <button id="btnRule" class="ghost">ルール</button>
      <button id="btnTutorial" class="ghost">チュートリアル</button>
    </div>
  </header>

  <!-- ===== Main layout ===== -->
  <main class="layout2">
    <!-- LEFT COLUMN -->
    <section class="leftCol">
      <!-- Cards panel -->
      <section class="panel cardsPanel">
        <div class="panelHead">
          <div class="filters">
            <label class="small">属性</label>
            <select id="typeSelect"></select>

            <label class="small">検索</label>
            <input id="search" placeholder="カード名で検索（例：回復）" />

            <div class="countBox">
              <span class="small">表示</span>
              <b id="shownCount">0</b>
              <span class="small">枚</span>
            </div>
          </div>
        </div>
        <div id="cardSections" class="scroll"></div>
      </section>

      <!-- Game join panel（非表示だが、IDを残すためDOMは必要） -->
      <section class="panel gamePanel">
        <div class="panelHead">
          <div class="subTitle">ゲーム参加！</div>
          <div class="small hint">※未実装の項目は無効化されています</div>
        </div>

        <div class="gameBody">
          <div class="gameGrid">
            <div class="modeCard">
              <div class="modeHead">
                <div class="modeTitle">1人プレイ</div>
                <div class="modeBadge">ソロ</div>
              </div>
              <div class="small modeDesc">・アーケードモード（入口だけ）</div>
              <div class="modeBtns">
                <button id="arcadeBtn" class="ghost">アーケードモード</button>
              </div>
            </div>

            <div class="modeCard">
              <div class="modeHead">
                <div class="modeTitle">2人プレイ</div>
                <div class="modeBadge accent">オンライン</div>
              </div>

              <div class="modeBtns">
                <!-- deck.js が参照するのでDOMに残す（表示は注入ボタン側でOK） -->
                <button id="createBtn" class="primary" disabled>ルーム作成</button>
                <button id="joinBtn" class="primary" disabled>ルーム参加</button>
                <button id="spectateBtn" class="ghost" disabled>観戦（未実装）</button>
              </div>

              <div id="msg" class="msg"></div>
            </div>
          </div>

          <div class="fineRow">
            <div class="fineLeft">
              <div class="small">
                デッキ条件：<b><span id="deckCount">0</span> / 30</b>
                <span class="hint">(同名は最大4枚)</span>
              </div>
            </div>
            <div class="fineRight">
              <button id="randomDeckBtn" class="ghost">ランダム</button>
              <button id="btnSave" class="primary">保存</button>
            </div>
          </div>
        </div>
      </section>
    </section>

    <!-- RIGHT COLUMN -->
    <section class="panel deckPanel">
      <div class="panelHead">
        <div class="deckTop">
          <div>
            <div class="subTitle">デッキに入れたカード</div>
            <div class="small">
              <b><span id="deckCountTopMirror"></span></b>
            </div>
          </div>
        </div>

        <!-- Deck Name（今のdeck.jsは未対応だけど残してOK） -->
        <div class="deckNameRow">
          <div class="small" style="font-weight:800;">デッキ名</div>
          <input id="deckNameInput" placeholder="例：火速攻 / 受け鋼 / 回復草" />
          <button id="btnSaveNamed" class="ghost">名前で保存</button>

          <select id="deckSaveSlotSelect"></select>
          <button id="btnLoadNamed" class="ghost" disabled>読み込み</button>
          <button id="btnDeleteNamed" class="ghost" disabled>削除</button>

          <div class="small" style="opacity:.75;">
            ※デッキ名は後で intro に表示できます
          </div>
        </div>

        <!-- EX（いまのdeck.jsはカード一覧側の「選択」ボタンで選ぶ仕様。表示枠は残してOK） -->
        <div class="exBox">
          <div class="exLeft">
            <div class="subTitle">EX（サポート1枚）</div>
            <div id="exLabel" class="exLabel">
              <span class="badge">ピンチ時のみ</span><br>未選択
            </div>
          </div>
          <div class="exRight">
            <button id="exPickBtn" class="ghost">EXを選ぶ</button>
            <button id="exClearBtn" class="ghost" disabled>クリア</button>
          </div>
        </div>
      </div>

      <div id="deckList" class="scroll"></div>

      <div class="detailBox">
        <div class="subTitle">詳細</div>
        <div id="detail" class="detail small">
          左の「詳細」ボタンでカード詳細が表示されます。
        </div>
      </div>
    </section>
  </main>

  <!-- tutorial modal -->
  <div id="modalBackdrop" class="modalBackdrop" aria-hidden="true" style="display:none;">
    <div class="modal">
      <div class="modalHead">
        <b>チュートリアル</b>
        <button id="btnCloseModal" class="ghost">閉じる</button>
      </div>
      <div id="tutorialBody" class="modalBody small"></div>
    </div>
  </div>

  <!-- deck.js -->
  <script type="module" src="./deck.js?v=20260202e"></script>

  <!-- nickname label + deckCount mirror -->
  <script>
    (function(){
      // ★ deck.js の NAME_KEY に合わせる
      const NAME_KEY = "tcg_player_name_v20260202_30";

      const updateNick = ()=>{
        try{
          const v = localStorage.getItem(NAME_KEY) || "";
          const el = document.getElementById("nicknameLabel");
          if (el) el.textContent = v ? v : "未設定";
        }catch{}
      };

      // deckCount の見た目ミラー
      const syncCount = ()=>{
        const dc = document.getElementById("deckCount");
        const m = document.getElementById("deckCountTopMirror");
        if (dc && m) m.textContent = (dc.textContent || "0") + " / 30";
      };

      // 初回
      updateNick();
      syncCount();

      // deckCount 監視
      const dc = document.getElementById("deckCount");
      if (dc) new MutationObserver(syncCount).observe(dc, { childList:true, subtree:true });

      // 名前は保存ボタンで変わるので、軽く定期更新（storage eventは同一タブだと飛ばないため）
      setInterval(updateNick, 800);
    })();
  </script>
</body>
</html>
