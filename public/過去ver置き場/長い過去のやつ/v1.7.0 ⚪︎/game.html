<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>TCG Online - Game</title>
<style>
  body { font-family:sans-serif; background:#222; color:#fff; display:flex; margin:0; }
  #left { margin-right:20px; padding:10px; }
  #right { width:520px; padding:10px; border-left:1px solid #444; }

  /* 盤面 */
  #board { display:grid; grid-template-columns: repeat(5, 64px); grid-template-rows: repeat(7, 74px); gap:4px; }
  .cell { width:64px; height:74px; background:#444; position:relative; cursor:pointer; font-size:12px; user-select:none; }
  .cell.summon { background:#2a5; }
  .cell.move   { background:#296; }
  .cell.selected { outline:3px solid yellow; }

  .unitA { background:#4af; }
  .unitB { background:#f55; }

  .status { position:absolute; bottom:2px; left:2px; font-size:10px; background:rgba(0,0,0,0.6); padding:1px 2px; border-radius:3px; }
  .attr   { position:absolute; top:2px; right:2px; font-size:10px; background:rgba(0,0,0,0.6); padding:1px 3px; border-radius:3px; }

  .fatigued { filter: brightness(0.55) saturate(0.9); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }
  .fatigueTag { position:absolute; top:2px; left:2px; font-size:10px; padding:1px 3px; border-radius:3px; background:rgba(0,0,0,0.75); }

  .hitFlash { animation: hitflash 0.25s ease-in-out 0s 2; }
  @keyframes hitflash { 0%{filter:brightness(1)} 50%{filter:brightness(2)} 100%{filter:brightness(1)} }
  .floatDmg { position:absolute; left:50%; top:24px; transform:translateX(-50%); font-weight:bold; animation: floatup 0.9s ease-out forwards; }
  @keyframes floatup { 0%{opacity:1; transform:translate(-50%,0)} 100%{opacity:0; transform:translate(-50%,-22px)} }

  .card { border:1px solid #aaa; padding:6px; margin-bottom:6px; cursor:pointer; background:#333; border-radius:6px; }
  .card.selected { outline:2px solid yellow; }
  .card .small { font-size:12px; opacity:0.9; }
  .cardRow { display:flex; justify-content:space-between; gap:8px; align-items:center; }

  button { margin:2px; cursor:pointer; }
  .small { font-size:12px; opacity:0.9; }

  #log { white-space:pre-wrap; font-size:12px; max-height:240px; overflow:auto; background:#111; padding:8px; border-radius:6px; border:1px solid #333; }

  #turnBanner {
    position:fixed; left:50%; top:14px; transform:translateX(-50%);
    background:rgba(255, 215, 0, 0.15);
    border:1px solid rgba(255, 215, 0, 0.6);
    color:#ffd700;
    padding:10px 14px;
    border-radius:10px;
    font-weight:bold;
    display:none;
    z-index:9999;
    backdrop-filter: blur(4px);
  }
  body.myTurnGlow { box-shadow: inset 0 0 0 3px rgba(255,215,0,0.55); }

  /* ===== マナゲージ ===== */
  #manaGauge { margin-top:4px; display:flex; gap:4px; flex-wrap:wrap; }
  .manaPip { width:12px; height:10px; border-radius:3px; background:#444; border:1px solid #666; }
  .manaPip.on { background:#ffd700; border-color:#caa400; }
  .manaPip.max { background:#2b2b2b; border-color:#555; }

  /* ===== 右ペイン：手札と詳細を横並び ===== */
  #rightTop { display:flex; gap:10px; }
  #handWrap { flex: 1; min-width: 250px; }
  #detailWrap { width: 240px; }

  #detail, #actionPicker {
    border:1px solid #666; padding:8px; border-radius:6px; background:#1a1a1a;
  }
  #detail { margin-top:6px; }
  #dice { font-size:18px; margin-top:8px; min-height:24px; }

  /* ===== 攻撃成功フラッシュ ===== */
  #fxFlash{
    position:fixed; inset:0;
    background:rgba(255,255,255,0);
    pointer-events:none;
    z-index:99999;
    transition: background 120ms ease;
  }
  #fxFlash.on { background:rgba(255,255,255,0.22); }
  #fxFlash.kill { background:rgba(255,215,0,0.28); }
</style>
</head>
<body>

<div id="fxFlash"></div>
<div id="turnBanner">あなたのターン！</div>

<div id="left">
  <h3>フィールド</h3>
  <div id="board"></div>

  <div style="margin-top:8px;">
    <div>あなた: <span id="you"></span></div>
    <div>ターン: <span id="turn"></span></div>
    <div>マナ: <span id="mana"></span></div>
    <div id="manaGauge"></div>

    <div>撃破(A/B): <span id="kills"></span></div>
    <div>侵入(A/B): <span id="infil"></span></div>
    <div class="small" id="modeHint"></div>

    <div style="margin-top:6px;">
      <button id="modeSummon">召喚</button>
      <button id="modeMove">移動</button>
      <button id="modeAttack">攻撃</button>
      <button id="modeEvolve">進化</button>
      <button id="doEvolve" style="display:none;">進化実行</button>
      <button id="endTurn">ターンエンド</button>
    </div>

    <div id="quickActions" style="margin-top:8px; display:none;">
      <button id="quickMove" style="font-size:14px; padding:8px 10px;">🏃 移動</button>
      <button id="quickAttack" style="font-size:14px; padding:8px 10px;">⚔️ 攻撃</button>
      <span class="small" id="quickMsg" style="margin-left:8px;"></span>
    </div>
  </div>

  <div style="margin-top:8px;">
    <pre id="log"></pre>
  </div>
</div>

<div id="right">
  <h3>山札</h3>
  <div id="deckCount"></div>

  <div id="rightTop">
    <div id="handWrap">
      <h3>手札</h3>
      <div id="hand"></div>
    </div>

    <div id="detailWrap">
      <h3>行動</h3>
      <div id="actionPicker"></div>

      <h3 style="margin-top:10px;">詳細</h3>
      <div id="detail"></div>
      <div id="dice"></div>
    </div>
  </div>
</div>

<script type="module" src="./game.js?v=20260125k"></script>
</body>
</html>
