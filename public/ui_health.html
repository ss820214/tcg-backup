<!DOCTYPE html>

<head>

  <title>TCG UI Health</title>
  <link rel="stylesheet" href="./global_ui_20260821.css?v=20260926_device_switch4" />

  <style>
    body{margin:0;background:#070b0f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
    .healthWrap{max-width:1180px;margin:0 auto;padding:22px}
    .healthHero{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
    .healthGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .healthCard{border:1px solid rgba(255,255,255,.13);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));padding:14px}
    .healthCard b{display:block;font-size:26px;margin-top:4px}
    .healthList{display:grid;gap:8px;margin-top:14px}
    .healthRow{display:grid;grid-template-columns:140px 1fr auto;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:10px 12px;background:rgba(0,0,0,.22)}
    .ok{color:#78f7bd}.warn{color:#ffd86b}.bad{color:#ff7777}.note{color:#8fc8ff}
    .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    @media(max-width:760px){.healthGrid{grid-template-columns:1fr 1fr}.healthRow{grid-template-columns:1fr}.healthHero{align-items:flex-start;flex-direction:column}}
  </style>
</head>

      </div>
      <div class="row">
