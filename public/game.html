<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <title>TCG Online - Battle</title>

    <!-- Desktop/base battle UI -->
    <link rel="stylesheet" href="./game.css?v=20260228_9" />
    <!-- Mobile-only override. Desktop is intentionally untouched. -->
    <link rel="stylesheet" href="./game_mobile.css?v=20261003_1" />
  </head>
  <body>
    <!-- ===== FX/Overlay (game.js が参照) ===== -->
    <div id="turnBanner" aria-live="polite">あなたのターン！</div>
    <div id="fxFlash" aria-hidden="true"></div>
    <div id="pinchFx" aria-hidden="true"></div>

    <!-- ===== App Layout ===== -->
    <div id="app">
      <!-- LEFT: information + controls -->
      <aside id="leftPane">
        <div class="paneTitle">情報</div>

        <div class="kv">
          <div class="row small"><b>YOU:</b> <span id="you">?</span></div>
          <div class="row small"><b>TURN:</b> <span id="turn">?</span></div>

          <div class="row small" style="margin-top: 6px">
            <span id="mana">A ?/? | B ?/?</span>
          </div>

          <div id="manaGauge"></div>

          <div class="row small" style="margin-top: 8px">
            <div id="deckCount">残り A:? / B:?</div>
          </div>

          <div id="scoreWrap" class="scoreWrap">
            <div class="scoreRow">
              <div class="scoreLabel">🏴 KILL</div>

              <div class="scoreSide">
                <div class="scoreSideName">A</div>
                <div id="killMeterA" class="scoreMeter"></div>
                <div id="killTextA" class="scoreText">0/3</div>
              </div>

              <div class="scoreSide">
                <div class="scoreSideName">B</div>
                <div id="killMeterB" class="scoreMeter"></div>
                <div id="killTextB" class="scoreText">0/3</div>
              </div>
            </div>

            <div class="scoreRow" style="margin-top: 6px">
              <div class="scoreLabel">🕳️ INFIL</div>

              <div class="scoreSide">
                <div class="scoreSideName">A</div>
                <div id="infilMeterA" class="scoreMeter"></div>
                <div id="infilTextA" class="scoreText">0/3</div>
              </div>

              <div class="scoreSide">
                <div class="scoreSideName">B</div>
                <div id="infilMeterB" class="scoreMeter"></div>
                <div id="infilTextB" class="scoreText">0/3</div>
              </div>
            </div>

            <span id="kills" style="display: none"></span>
            <span id="infil" style="display: none"></span>
          </div>

          <div id="dice"></div>
          <div
            id="modeHint"
            class="small"
            style="margin-top: 8px; opacity: 0.85"
          ></div>
        </div>

        <div class="paneTitle">操作</div>
        <div class="controls">
          <button id="modeSummon" type="button">召喚</button>
          <button id="modeMove" type="button">移動</button>
          <button id="modeAttack" type="button">行動</button>
          <button id="modeEvolve" type="button">進化</button>
          <button id="modeSupport" type="button">サポート</button>
          <button id="doEvolve" type="button" style="display: none">進化実行</button>
          <button id="endTurn" type="button">ターン終了</button>
        </div>

        <!-- Quick actions -->
        <div id="quickActions" class="quickActions" style="display: none">
          <button id="quickMove" type="button">🏃 移動</button>
          <button id="quickAttack" type="button">⚔️ 行動</button>
          <span id="quickMsg" class="small"></span>
        </div>

        <!-- Pinch + EX -->
        <div id="exWrap" class="kv" style="margin-top: 10px">
          <div
            class="row"
            style="justify-content: space-between; align-items: center"
          >
            <b>EX</b>
            <button id="exBtn" type="button">EX発動</button>
          </div>
          <div id="exInfo" class="small" style="margin-top: 6px; opacity: 0.9">
            EXなし
          </div>
          <div class="small" style="margin-top: 6px; opacity: 0.75">
            ※ピンチ時のみ / 1回きり
          </div>
        </div>
      </aside>

      <!-- CENTER: 5x7 board -->
      <main id="centerPane" aria-label="battle-board">
        <div id="board"></div>
      </main>

      <!-- RIGHT: hand / actions / detail / log -->
      <aside id="rightPane">
        <div class="paneTitle">手札</div>
        <div id="hand"></div>

        <div class="paneTitle" style="margin-top: 10px">行動</div>
        <div id="actionPicker" class="small">
          ユニットを選択すると行動が表示されます。
        </div>

        <div class="paneTitle" style="margin-top: 10px">詳細</div>
        <div id="detail" class="small">
          ユニット/カードの詳細がここに表示されます。
        </div>

        <div class="paneTitle" style="margin-top: 10px">ログ</div>
        <pre id="log"></pre>
      </aside>
    </div>

    <!-- ===== Game code ===== -->
    <script type="module" src="./game.js?v=20260228_34"></script>
    <!-- Presentation-only mobile shell. It moves existing live DOM nodes; no game rules live here. -->
    <script type="module" src="./game_mobile.js?v=20261003_1"></script>

    <style>
      #joinGameBtn,
      #btnJoinGame,
      #gameJoinBtn,
      .join-game-btn {
        display: none !important;
      }
    </style>

    <!-- BGM UI/controller: use sfx.js public controller only. -->
    <script type="module">
      import {
        setBgmEnabled,
        setBgmMode,
      } from "./sfx.js?v=20260228_1";

      const BGM_KEY = "tcg_bgm_on";
      const VOLUME = 0.35;
      const RATE = 1.0;
      let bgmOn = (localStorage.getItem(BGM_KEY) ?? "1") === "1";
      let pinchLevel = 0;

      function modeFromLevel(lv) {
        if (lv >= 2) return "alert2";
        if (lv >= 1) return "alert1";
        return "battle";
      }

      function applyBgmState() {
        setBgmEnabled(bgmOn, { volume: VOLUME, playbackRate: RATE });
        if (bgmOn) {
          setBgmMode(modeFromLevel(pinchLevel), {
            volume: VOLUME,
            playbackRate: RATE,
          });
        }
      }

      function isSoloUrl() {
        const p = new URLSearchParams(location.search);
        return p.get("solo") === "1" || p.get("mode") === "solo";
      }

      function mountBgmToggle() {
        const btn = document.createElement("button");
        btn.id = "bgmToggleBtn";
        btn.type = "button";
        btn.textContent = bgmOn ? "🔊 BGM ON" : "🔇 BGM OFF";
        btn.style.marginLeft = "6px";

        const solo = isSoloUrl();
        let cbtn = null;
        if (solo) {
          cbtn = document.createElement("button");
          cbtn.id = "consoleToggleBtn";
          cbtn.type = "button";
          cbtn.textContent = "🖥 コンソール";
          cbtn.style.marginLeft = "6px";
        }

        const leftPane = document.querySelector("#leftPane");
        const controlsTitle = leftPane?.querySelectorAll(".paneTitle")?.[1];
        if (controlsTitle && controlsTitle.parentElement) {
          const wrap = document.createElement("div");
          wrap.className = "controlsTitleRow";
          wrap.style.display = "flex";
          wrap.style.alignItems = "center";
          wrap.style.justifyContent = "space-between";
          wrap.style.gap = "6px";

          const titleClone = controlsTitle.cloneNode(true);
          controlsTitle.replaceWith(wrap);
          wrap.appendChild(titleClone);

          const right = document.createElement("div");
          right.className = "audioControls";
          right.style.display = "flex";
          right.style.gap = "6px";
          right.appendChild(btn);
          if (cbtn) right.appendChild(cbtn);
          wrap.appendChild(right);
        } else {
          leftPane?.prepend(btn);
          if (cbtn) leftPane?.prepend(cbtn);
        }

        btn.addEventListener("click", () => {
          bgmOn = !bgmOn;
          localStorage.setItem(BGM_KEY, bgmOn ? "1" : "0");
          btn.textContent = bgmOn ? "🔊 BGM ON" : "🔇 BGM OFF";
          applyBgmState();
        });

        if (cbtn) {
          cbtn.addEventListener("click", async () => {
            if (typeof window.toggleSoloConsole === "function") {
              await window.toggleSoloConsole();
            } else {
              alert("console機能がまだ読み込まれていません。");
            }
          });
        }
      }

      // game.js can call this without caring how BGM is implemented.
      window.setPinchBgmLevel = function (lv) {
        pinchLevel = Math.max(0, Math.min(2, Number(lv) || 0));
        if (bgmOn) {
          setBgmMode(modeFromLevel(pinchLevel), {
            volume: VOLUME,
            playbackRate: RATE,
          });
        }
      };

      function armAutoStartOnce() {
        const startOnce = () => {
          if (!bgmOn) return;
          applyBgmState();
        };
        window.addEventListener("pointerdown", startOnce, { once: true });
      }

      mountBgmToggle();
      if (bgmOn) armAutoStartOnce();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) setBgmEnabled(false);
        else if (bgmOn) applyBgmState();
      });
      window.addEventListener("beforeunload", () => setBgmEnabled(false));
    </script>
  </body>
</html>
