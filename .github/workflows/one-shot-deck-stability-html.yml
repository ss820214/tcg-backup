name: One-shot Deck Stability HTML Patch

on:
  push:
    branches:
      - import/local-latest-20261003
    paths:
      - .github/workflows/one-shot-deck-stability-html.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/local-latest-20261003

      - name: Patch deck bootstrap and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public/deck.html')
          s = p.read_text(encoding='utf-8-sig')

          marker = '  <meta name="viewport" content="width=device-width,initial-scale=1" />\n'
          preload = '\n'.join([
              '  <meta name="viewport" content="width=device-width,initial-scale=1" />',
              '  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />',
              '  <link rel="dns-prefetch" href="//www.gstatic.com" />',
              '  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js" crossorigin />',
              '  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js" crossorigin />',
              '  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js" crossorigin />',
              ''
          ])
          if 'firebasejs/9.23.0/firebase-app.js" crossorigin' not in s:
              if marker not in s:
                  raise SystemExit('viewport marker not found')
              s = s.replace(marker, preload, 1)

          old_deck = '<script type="module" src="./deck.js?v=20260926_mobile_stack2"></script>'
          new_deck = '\n'.join([
              '<script src="./deck_runtime_guard_20261003.js?v=20261003_guard2" data-deck-runtime-guard="20261003_guard2"></script>',
              '<script type="module" src="./deck.js?v=20261003_play_stability2"></script>'
          ])
          if old_deck in s:
              s = s.replace(old_deck, new_deck, 1)
          elif 'deck_runtime_guard_20261003.js?v=20261003_guard2' not in s:
              raise SystemExit('deck module marker not found')

          s = s.replace(
              './global_ui_20260821.js?v=20260926_device_switch4',
              './global_ui_20260821.js?v=20261003_play_guard2'
          )

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'deck_runtime_guard_20261003.js?v=20261003_guard2' public/deck.html
          grep -q 'deck.js?v=20261003_play_stability2' public/deck.html
          grep -q 'global_ui_20260821.js?v=20261003_play_guard2' public/deck.html
          grep -q 'rel="preconnect" href="https://www.gstatic.com"' public/deck.html

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "ss820214"
          git config user.email "165994272+ss820214@users.noreply.github.com"
          git add public/deck.html
          git commit -m "PLAY安定化を先行ロードしてFirebase読込を高速化"
          git push origin HEAD:import/local-latest-20261003
