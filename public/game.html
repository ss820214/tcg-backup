    <script type="module">
      import { setBgmEnabled, setBgmMode } from "./sfx.js?v=20260919_ratbeat";

      const BGM_KEY = "tcg_bgm_on";
      const VOLUME = 0.35;
      const RATE = 1.0;

      let bgmOn = (localStorage.getItem(BGM_KEY) ?? "1") === "1";

      function applyBgmState() {
        setBgmEnabled(false);
      }

      function isSoloUrl() {
        const p = new URLSearchParams(location.search);
        return p.get("solo") === "1" || p.get("mode") === "solo";
      }

      function mountBgmToggle() {
        const btn = document.createElement("button");
        btn.id = "bgmToggleBtn";
        btn.type = "button";
        btn.style.marginLeft = "6px";
        btn.textContent = bgmOn ? "BGM ON" : "BGM OFF";

        const solo = isSoloUrl();

        // Console button is only shown in solo mode.
        let cbtn = null;
        if (solo) {
          cbtn = document.createElement("button");
          cbtn.id = "consoleToggleBtn";
          cbtn.type = "button";
          cbtn.style.marginLeft = "6px";
          cbtn.textContent = "コンソール";
        }

        const leftPane = document.querySelector("#leftPane");
        const controlsTitle = leftPane?.querySelectorAll(".paneTitle")?.[1];
        if (controlsTitle && controlsTitle.parentElement) {
          const wrap = document.createElement("div");
          wrap.style.display = "flex";
          wrap.style.alignItems = "center";
          wrap.style.justifyContent = "space-between";

          const titleClone = controlsTitle.cloneNode(true);
          controlsTitle.replaceWith(wrap);
          wrap.appendChild(titleClone);

          const right = document.createElement("div");
          right.style.display = "flex";
          right.style.gap = "6px";
          right.appendChild(btn);
          if (cbtn) right.appendChild(cbtn);
          wrap.appendChild(right);
        } else {
          leftPane?.prepend(btn);
          if (cbtn) leftPane?.prepend(cbtn);
        }

        btn.addEventListener("click", async () => {
          bgmOn = !bgmOn;
          localStorage.setItem(BGM_KEY, bgmOn ? "1" : "0");
          btn.textContent = bgmOn ? "BGM ON" : "BGM OFF";

          if (bgmOn) {
            setBgmEnabled(true, { volume: VOLUME, playbackRate: RATE });
            setBgmMode(modeByLevel(_pinchLevel), {
              volume: VOLUME,
              playbackRate: RATE,
            });
          } else {
            setBgmEnabled(false);
          }
        });

        const waitForSoloConsole = async (timeoutMs = 9000) => {
          const started = performance.now();
          while (performance.now() - started < timeoutMs) {
            if (typeof window.toggleSoloConsole === "function") {
              return window.toggleSoloConsole;
            }
            await new Promise((resolve) => setTimeout(resolve, 120));
          }
          return null;
        };

        if (cbtn) {
          cbtn.addEventListener("click", async () => {
            const prevText = cbtn.textContent;
            window.__soloConsoleOpenRequested = true;
            cbtn.disabled = true;
            cbtn.textContent = "読み込み中...";
            try {
              const toggle = await waitForSoloConsole();
              if (typeof toggle === "function") {
                window.__soloConsoleOpenRequested = false;
                await toggle();
              } else {
                window.__soloConsoleOpenRequested = false;
                alert("コンソールの準備に時間がかかっています。もう一度お試しください。");
              }
            } catch (error) {
              window.__soloConsoleOpenRequested = false;
              console.warn("[solo console] failed to open", error);
              alert("コンソールを開けませんでした。もう一度お試しください。");
            } finally {
              cbtn.disabled = false;
              cbtn.textContent = prevText || "コンソール";
            }
          });
        }

        return btn;
      }

      function armAutoStartOnce() {
        const startOnce = async () => {
          window.removeEventListener("pointerdown", startOnce);
          if (!bgmOn) return;
          setBgmEnabled(true, { volume: VOLUME, playbackRate: RATE });
          setBgmMode(modeByLevel(_pinchLevel), {
            volume: VOLUME,
            playbackRate: RATE,
          });
        };
        window.addEventListener("pointerdown", startOnce, { once: true });
      }

      // UI setup.
      const btn = mountBgmToggle();

      // Initial state.
      applyBgmState();

      if (bgmOn) armAutoStartOnce();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          setBgmEnabled(false);
        } else if (bgmOn) {
          setBgmEnabled(true, { volume: VOLUME, playbackRate: RATE });
          setBgmMode(modeByLevel(_pinchLevel), { volume: VOLUME, playbackRate: RATE });
        }
      });
      window.addEventListener("beforeunload", () => setBgmEnabled(false));

      // ===== Pinch BGM level controller (called from game.js) =====
      // lv: 0=normal(battle), 1=alert1, 2=alert2
      let _pinchLevel = 0;

      function modeByLevel(lv) {
        if (lv === 2) return "alert2";
        if (lv === 1) return "alert1";
        return "battle";
      }

      window.setPinchBgmLevel = async function (lv) {
        lv = Number(lv) || 0;
        lv = Math.max(0, Math.min(2, lv));
        if (lv === _pinchLevel) return;
        _pinchLevel = lv;

        if (!bgmOn) return;
        setBgmMode(modeByLevel(lv), { volume: VOLUME, playbackRate: RATE });
      };
    </script>

<style id="battleHideUtilityTools">
 body .tcgUtilityLinks{display:none!important}
 </style>
 <script>
 (()=>{
 const removeTargets=root=>{
  if(!(root instanceof Element || root===document.body))return;
  const elems=[root,...(root.querySelectorAll?.("button,a,[role=button],.tcgUtilityLinks")||[])];
  for(const el of elems){
   if(el.classList?.contains("tcgUtilityLinks")||el.textContent?.trim()==="次の一手")el.remove();
  }
  for(const el of root.querySelectorAll?.("span,div")||[]){
   if(el.children.length||el.textContent?.trim()!=="次の一手")continue;
   const target=el.closest("button,a,[role=button]")||el.parentElement;
   if(target && target!==document.body)target.remove();
  }
 };
 const begin=()=>{
  removeTargets(document.body);
  new MutationObserver(changes=>{
   for(const change of changes)for(const node of change.addedNodes)
    if(node.nodeType===1)removeTargets(node);
  }).observe(document.body,{childList:true,subtree:true});
 };
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",begin,{once:true});
 else begin();
})();
 </script>
