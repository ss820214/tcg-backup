<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    body{font-family:system-ui, sans-serif; margin:24px;}
    .box{max-width:420px; margin:0 auto; padding:16px; border:1px solid #ddd; border-radius:12px;}
    input{width:100%; padding:10px; margin:6px 0 12px; font-size:16px;}
    button{width:100%; padding:12px; font-size:16px;}
    .msg{margin-top:12px; white-space:pre-wrap;}
    .small{color:#666; font-size:12px;}
  </style>
</head>
<body>
  <div class="box">
    <h2>ログイン</h2>
    <div class="small">名前 + PIN(4〜8桁) を設定/入力してください（端末内の本人確認用）</div>

    <label>プレイヤー名</label>
    <input id="name" maxlength="16" placeholder="例: terada" />

    <label>PIN（数字4〜8桁）</label>
    <input id="pin" maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="例: 1234" />

    <button id="btn">進む</button>
    <div id="msg" class="msg"></div>
  </div>

  <script type="module" src="./login.js?v=20260226_2"></script>
</body>
</html>
