    white-space:nowrap!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckSaveDockHead,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckInfoDockHead,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .listHead{
    min-height:31px!important;
    padding:4px 6px!important;
    gap:4px!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckSaveDockHeadMain>span,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckInfoDockHeadMain>span,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .listHead>.small{
    display:none!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckSaveRow{
    display:grid!important;
