name: One-shot UI entry consolidation 20261005

on:
  push:
    branches:
      - import/local-latest-20261003
    paths:
      - '.github/workflows/one-shot-ui-entry-20261005.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: import/local-latest-20261003
          fetch-depth: 0

      - name: Replace legacy UI direct loads with canonical entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('public/index.html'), Path('public/deck.html')]
          css_names = [
              'visual_upgrade_20260805.css',
              'global_ui_20260821.css',
              'ui_stability_20260825.css',
              'mobile_deck_block_final_20260927.css',
          ]
          js_names = [
              'ui_polish.js',
              'deck_layout_guard.js',
              'visual_upgrade_20260805.js',
              'dopagaki_mode.js',
              'mobile_deck_ui.js',
              'ui_stability_20260825.js',
              'global_ui_20260821.js',
              'mobile_home_deck_ui_20260926.js',
              'mobile_deck_block_final_20260927.js',
              'deck_runtime_guard_20261003.js',
          ]
          entry = '  <script src="./deck_ui_entry_20261005.js?v=20261005_ui_entry2" defer></script>'

          for path in files:
              text = path.read_text(encoding='utf-8-sig')

              for name in css_names:
                  pattern = rf'\s*<link\b[^>]*href=["\']\./{re.escape(name)}(?:\?[^"\']*)?["\'][^>]*>\s*'
                  text = re.sub(pattern, '\n', text, flags=re.I)

              for name in js_names:
                  pattern = rf'\s*<script\b[^>]*src=["\']\./{re.escape(name)}(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*'
                  text = re.sub(pattern, '\n', text, flags=re.I)

              text = re.sub(
                  r'\s*<script\b[^>]*src=["\']\./deck_ui_entry_20261005\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*',
                  '\n',
                  text,
                  flags=re.I,
              )

              anchor = re.search(
                  r'(?P<tag><script\b[^>]*src=["\']\./ttcg_command\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>)',
                  text,
                  flags=re.I,
              )
              if anchor:
                  pos = anchor.end('tag')
                  text = text[:pos] + '\n' + entry + text[pos:]
              else:
                  text = text.replace('</body>', entry + '\n</body>')

              path.write_text(text, encoding='utf-8')

          for path in files:
              text = path.read_text(encoding='utf-8')
              assert text.count('deck_ui_entry_20261005.js') == 1, path
              assert '20261005_ui_entry2' in text, path
              for name in css_names:
                  assert not re.search(rf'href=["\']\./{re.escape(name)}(?:\?|["\'])', text), (path, name)
              for name in js_names:
                  assert not re.search(rf'src=["\']\./{re.escape(name)}(?:\?|["\'])', text), (path, name)
          PY

      - name: Wire shared mode theme into global UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/global_ui_20260821.js')
          text = path.read_text(encoding='utf-8-sig')
          marker = '20261005_unified_theme1'
          if marker not in text:
              text = text.rstrip() + r'''

// Shared visual theme for the non-battle game modes.
(() => {
  const THEME = "20261005_unified_theme1";
  const page = (location.pathname.split("/").pop() || "index.html")
    .toLowerCase()
    .replace(/\.html$/i, "");
  const themedPages = new Set(["profile", "gacha", "arcade", "creator"]);
  if (!themedPages.has(page)) return;

  const load = () => {
    if (!document.head) {
      requestAnimationFrame(load);
      return;
    }
    if (document.querySelector(`link[data-unified-mode-theme="${THEME}"]`)) return;
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = `./unified_mode_theme_20261005.css?v=${THEME}`;
    link.dataset.unifiedModeTheme = THEME;
    link.addEventListener("load", () => {
      document.documentElement.dataset.unifiedModeTheme = THEME;
      window.dispatchEvent(new CustomEvent("tcg:unified-mode-theme-ready", {
        detail: { version: THEME, page },
      }));
    }, { once: true });
    link.addEventListener("error", () => {
      console.error("[global_ui] unified mode theme failed to load");
    }, { once: true });
    document.head.appendChild(link);
  };

  load();
})();
''' + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax and wiring checks
        run: |
          node --check public/deck_ui_entry_20261005.js
          node --check public/global_ui_20260821.js
          test -s public/unified_mode_theme_20261005.css
          grep -q '20261005_unified_theme1' public/global_ui_20260821.js
          grep -q 'unified_mode_theme_20261005.css' public/global_ui_20260821.js
          grep -q 'ui-page-profile' public/unified_mode_theme_20261005.css
          grep -q 'ui-page-gacha' public/unified_mode_theme_20261005.css
          grep -q 'ui-page-arcade' public/unified_mode_theme_20261005.css
          grep -q 'ui-page-creator' public/unified_mode_theme_20261005.css

      - name: Commit consolidation
        run: |
          if [ -z "$(git status --porcelain -- public/index.html public/deck.html public/global_ui_20260821.js)" ]; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/deck.html public/global_ui_20260821.js
          git commit -m 'UI入口と各モード共通テーマを統合'
          git push origin HEAD:import/local-latest-20261003
