<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Match Intro</title>
    <style>
      :root {
        --bg1: #070a12;
        --bg2: #101a33;
        --txt: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --a: #6cffb6;
        --b: #ff6c87;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        --r: 22px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        color: var(--txt);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        background:
          radial-gradient(1200px 700px at 20% 15%, rgba(80, 140, 255, 0.18), transparent 55%),
          radial-gradient(900px 700px at 90% 10%, rgba(120, 255, 190, 0.12), transparent 50%),
          linear-gradient(180deg, var(--bg1), var(--bg2));
      }
      canvas.fx {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        pointer-events: none;
      }
      .wrap{
        position:relative; height:100%;
        display:flex; align-items:center; justify-content:center;
        padding:18px;
      }
      .panel{
        width:min(980px, 96vw);
        border-radius: var(--r);
        background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
        box-shadow: var(--shadow);
        border: 1px solid rgba(255,255,255,0.16);
        overflow:hidden;
        position:relative;
        transform: translateY(10px);
        opacity:0;
        animation: pop .42s ease forwards;
      }
      .panel::after{
        content:"";
        position:absolute;
        right:-28px;
        bottom:-34px;
        width:260px;
        height:176px;
        background:
          linear-gradient(90deg, rgba(0,0,0,.32), transparent 44%),
          url("./assets/home/menu-room.webp") center/cover no-repeat;
        opacity:.28;
        filter:saturate(1.18) contrast(1.05);
        pointer-events:none;
        mix-blend-mode:screen;
        border-radius:54px 0 22px 0;
      }
      @keyframes pop{ to { transform: translateY(0); opacity:1; } }

      .glow{
        position:absolute; inset:-140px -140px auto -140px;
        height:260px;
        background:
          radial-gradient(circle at 30% 60%, rgba(108,255,182,0.26), transparent 60%),
          radial-gradient(circle at 80% 40%, rgba(74,163,255,0.22), transparent 65%);
        filter: blur(12px);
        opacity:.95;
        pointer-events:none;
      }

      .row{ position:relative; z-index:1; display:grid; grid-template-columns: 1fr; gap:14px; padding:18px; }

      .top{
        display:flex; align-items:center; justify-content:space-between;
        gap:10px;
        padding:12px 14px;
        border-radius: 16px;
        background: rgba(0,0,0,.22);
        border: 1px solid rgba(255,255,255,.12);
      }
      .top .k{ font-size:12px; color:var(--muted); }
      .top b{ font-size:13px; letter-spacing:.08em; }
      .skip{
        appearance:none; border:none;
        cursor:pointer;
        border-radius: 999px;
        padding:10px 12px;
        font-weight: 900;
        color: rgba(255,255,255,0.92);
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.16);
      }
      .skip:hover{ background: rgba(255,255,255,0.14); }

      .vs{
        display:grid;
        grid-template-columns: 1fr auto 1fr;
        gap:12px;
        align-items:center;
      }
      .pCard{
        border-radius: var(--r);
        background: rgba(0,0,0,.18);
        border: 1px solid rgba(255,255,255,.12);
        padding:14px;
        position:relative;
        overflow:hidden;
        min-height: 128px;
      }
      .pCard::before{
        content:"";
        position:absolute;
        left:0; top:0; bottom:0;
        width:8px;
        opacity:.85;
      }
      .pCard.a::before{ background: linear-gradient(180deg, rgba(108,255,182,.85), rgba(0,0,0,0)); }
      .pCard.b::before{ background: linear-gradient(180deg, rgba(255,108,135,.82), rgba(0,0,0,0)); }

      .seat{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.16);
        background: rgba(0,0,0,.18);
        font-size:12px;
        color: rgba(255,255,255,.88);
        letter-spacing:.10em;
        font-weight:900;
        width: fit-content;
      }
      .name{
        margin-top:10px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing:.02em;
        line-height:1.1;
        word-break: break-word;
      }

      .mini{
        margin-top:10px;
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        align-items:center;
      }
      .pill{
        display:inline-flex;
        align-items:center;
        gap:6px;
        padding:6px 10px;
        border-radius:999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        font-size:12px;
        font-weight:900;
        letter-spacing:.08em;
        color: rgba(255,255,255,.86);
      }

      .youTag{
        margin-top:10px;
        display:inline-flex;
        padding:6px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.14);
        font-size:12px;
        font-weight:900;
        letter-spacing:.12em;
        color: rgba(255,255,255,.86);
        opacity:0;
        transform: translateY(4px);
        transition: .18s ease;
      }
      .youTag.on{ opacity:1; transform: translateY(0); }
      .matchDeckProfile{
        margin-top:12px;
        border-radius:14px;
        border:1px solid rgba(255,255,255,.11);
        background:
          radial-gradient(220px 90px at 10% 0%, rgba(255,255,255,.08), transparent 62%),
          rgba(0,0,0,.18);
        padding:10px;
      }
      .matchDeckTitle{
        font-size:10px;
        color:rgba(255,255,255,.58);
        letter-spacing:.16em;
        font-weight:900;
      }
      .matchDeckMeta{
        margin-top:5px;
        color:rgba(255,255,255,.84);
        font-size:12px;
        line-height:1.45;
        font-weight:850;
      }
      .matchAttrRail{
        display:flex;
        gap:5px;
        flex-wrap:wrap;
        margin-top:8px;
      }
      .matchAttrDot{
        min-width:26px;
        height:26px;
        display:grid;
        place-items:center;
        border-radius:999px;
        border:1px solid color-mix(in srgb, var(--attr-c, #7dd3fc) 65%, rgba(255,255,255,.18));
        background:color-mix(in srgb, var(--attr-c, #7dd3fc) 18%, rgba(0,0,0,.35));
        box-shadow:0 0 16px color-mix(in srgb, var(--attr-c, #7dd3fc) 18%, transparent);
        font-size:11px;
        font-weight:1000;
      }
      .matchFeaturedCards{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:6px;
        margin-top:9px;
      }
      .matchFeaturedCard{
        min-width:0;
        display:grid;
        gap:2px;
        padding:7px 8px;
        border-radius:11px;
        border:1px solid color-mix(in srgb, var(--attr-c, #7dd3fc) 42%, rgba(255,255,255,.12));
        background:
          radial-gradient(70px 40px at 12% 0%, color-mix(in srgb, var(--attr-c, #7dd3fc) 18%, transparent), transparent 72%),
          rgba(0,0,0,.18);
        box-shadow:inset 0 0 16px rgba(255,255,255,.025);
      }
      .matchFeaturedCard b{
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        font-size:11px;
      }
      .matchFeaturedCard em{
        color:color-mix(in srgb, var(--attr-c, #7dd3fc) 78%, white);
        font-style:normal;
        font-size:10px;
        font-weight:1000;
      }
      .matchFeaturedEmpty{
        grid-column:1/-1;
        padding:7px 8px;
        border-radius:10px;
        color:rgba(255,255,255,.52);
        background:rgba(0,0,0,.14);
        font-size:11px;
        font-weight:800;
      }

      .pCard.win{
      box-shadow: 0 0 0 2px rgba(255,255,255,0.25), var(--shadow);
      border-color: rgba(255,255,255,0.26);
      }
      .vsMid{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:10px 8px;
      }
      .vsText{
        font-size: 54px;
        font-weight: 1000;
        letter-spacing:.12em;
        text-shadow: 0 14px 30px rgba(0,0,0,.55);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse{
        0%,100%{ transform: scale(1); opacity:1; }
        50%{ transform: scale(1.03); opacity:.92; }
      }
      .count{
        font-size: 38px;
        font-weight: 1000;
        letter-spacing:.08em;
        padding: 8px 14px;
        border-radius: 16px;
        background: rgba(0,0,0,.22);
        border: 1px solid rgba(255,255,255,.12);
        min-width: 96px;
        text-align:center;
      }
      .sub{ font-size:12px; color: var(--muted); }
      .fieldPlate{
        min-width:118px;
        padding:8px 10px;
        border-radius:14px;
        border:1px solid rgba(255,255,255,.14);
        background:
          linear-gradient(135deg, rgba(105,180,255,.14), rgba(120,227,173,.10)),
          rgba(0,0,0,.20);
        text-align:center;
        box-shadow:inset 0 0 20px rgba(255,255,255,.04);
      }
      .fieldPlate b{display:block;font-size:12px;letter-spacing:.12em;}
      .fieldPlate span{display:block;margin-top:4px;color:rgba(255,255,255,.66);font-size:11px;}

      .bar{
        margin-top:4px;
        height: 10px;
        border-radius: 999px;
        background: rgba(0,0,0,.26);
        border: 1px solid rgba(255,255,255,.10);
        overflow:hidden;
      }
      .bar > i{
        display:block;
        height:100%;
        width:0%;
        background: linear-gradient(90deg, rgba(108,255,182,.65), rgba(74,163,255,.55));
        transition: width .12s linear;
      }

      .foot{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:12px 14px;
        border-radius: 16px;
        background: rgba(0,0,0,.18);
        border: 1px solid rgba(255,255,255,.10);
      }
      .foot .hint{ font-size:12px; color: var(--muted); }
      .badge{
        display:inline-flex; gap:8px; align-items:center;
        font-size:12px;
        color: rgba(255,255,255,.86);
        padding:6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.16);
        background: rgba(255,255,255,.08);
        letter-spacing:.08em;
        font-weight:900;
      }

      @media (max-width: 720px){
      .vs{ grid-template-columns: 1fr; }
      .vsMid{ order: -1; }

      .pCard.a .pill{ border-color: rgba(108,255,182,0.25); }
      .pCard.b .pill{ border-color: rgba(255,108,135,0.25); }
      }
    </style>

        <div class="row">

          <div class="vs">
            <div class="pCard a">

            <div class="vsMid">

              <div class="sub" id="finalFieldTxt">FIELD: ---</div>

            </div>

            <div class="pCard b">
              <div class="seat" id="seatB">SEAT B</div>
              <div class="name" id="nameB">---</div>

              <div class="mini">
                <span class="pill" id="fieldBTxt">FIELD: ---</span>
                <span class="pill">軸 <span id="diceBTxt">--</span></span>
              </div>

              <div class="youTag" id="youB">YOU</div>
              <div class="matchDeckProfile" id="deckProfileB">
                <div class="matchDeckTitle">DECK</div>
                <div class="matchDeckMeta">隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ</div>
                <div class="matchAttrRail"></div>
                <div class="matchFeaturedCards"></div>
              </div>
            </div>
          </div>

          <div class="bar"><i id="barFill"></i></div>

          <div class="foot">
            <div class="hint" id="hintTxt">繝槭ャ繝∵ュ蝣ｱ繧堤｢ｺ隱阪＠縺ｦ縺・∪縺吮ｦ</div>
            <div class="badge" id="badgeTxt">CONNECT</div>
          </div>
        </div>
      </div>
    </div>
