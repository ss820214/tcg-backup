name: One-shot root deck runtime fix

on:
  push:
    branches:
      - import/local-latest-20261003

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply root deck runtime fix bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/local-latest-20261003
          fetch-depth: 1

      - name: Patch root and deck runtime loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          replace_once(
              'public/global_ui_20260821.js',
              '  const path = (location.pathname.split("/").pop() || "").toLowerCase();\n  if (path !== "deck.html" && path !== "deck") return;',
              '  const path = (location.pathname.split("/").pop() || "").toLowerCase();\n  const pathLooksLikeDeck = path === "deck.html" || path === "deck";\n  const deckDomReady = () => !!(document.getElementById("cardList") && document.getElementById("deckPanel"));\n  if (!pathLooksLikeDeck && !deckDomReady()) return;'
          )
          replace_once(
              'public/global_ui_20260821.js',
              '  const GUARD = "20261003_guard2";',
              '  const GUARD = "20261003_guard3";'
          )

          replace_once(
              'public/deck_runtime_guard_20261003.js',
              '  const VERSION = "20261003_guard2";',
              '  const VERSION = "20261003_guard3";'
          )
          replace_once(
              'public/deck_runtime_guard_20261003.js',
              '  function isDeckPage() {\n    const path = (location.pathname.split("/").pop() || "deck.html").toLowerCase();\n    return (path === "deck.html" || path === "deck") && !!document.body;\n  }',
              '  function isDeckPage() {\n    const path = (location.pathname.split("/").pop() || "").toLowerCase();\n    const pathLooksLikeDeck = path === "deck.html" || path === "deck";\n    const deckDomReady = !!($("cardList") && $("deckPanel"));\n    return !!document.body && (pathLooksLikeDeck || deckDomReady);\n  }'
          )

          replace_once(
              'public/index.html',
              './global_ui_20260821.js?v=20260926_device_switch4',
              './global_ui_20260821.js?v=20261003_root_guard3'
          )
          replace_once(
              'public/deck.html',
              './global_ui_20260821.js?v=20261003_play_guard2',
              './global_ui_20260821.js?v=20261003_root_guard3'
          )

          # Also make the root HTML revalidate aggressively so Android Chrome does not
          # keep a stale deck shell after a deploy.
          p = Path('firebase.json')
          text = p.read_text(encoding='utf-8-sig')
          if '"source": "/index.html"' not in text:
              marker = '    "rewrites": ['
              headers = '''    "headers": [\n      {\n        "source": "/index.html",\n        "headers": [\n          { "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }\n        ]\n      },\n      {\n        "source": "/",\n        "headers": [\n          { "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }\n        ]\n      },\n      {\n        "source": "/deck.html",\n        "headers": [\n          { "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }\n        ]\n      },\n      {\n        "source": "/**/*.js",\n        "headers": [\n          { "key": "Cache-Control", "value": "no-cache, must-revalidate" }\n        ]\n      }\n    ],\n'''
              if marker not in text:
                  raise SystemExit('firebase rewrites marker missing')
              text = text.replace(marker, headers + marker, 1)
              p.write_text(text, encoding='utf-8')

          # Sanity assertions.
          idx = Path('public/index.html').read_text(encoding='utf-8')
          glob = Path('public/global_ui_20260821.js').read_text(encoding='utf-8')
          guard = Path('public/deck_runtime_guard_20261003.js').read_text(encoding='utf-8')
          assert '20261003_root_guard3' in idx
          assert 'deckDomReady' in glob
          assert '20261003_guard3' in glob
          assert '20261003_guard3' in guard
          assert 'deckDomReady' in guard
          PY

      - name: Syntax check
        run: |
          node --check public/global_ui_20260821.js
          node --check public/deck_runtime_guard_20261003.js
          python -m json.tool firebase.json >/dev/null

      - name: Commit root fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/deck.html public/global_ui_20260821.js public/deck_runtime_guard_20261003.js firebase.json
          git commit -m "ルート版Deck Builderにも最終UIガードを適用"
          git push origin HEAD:import/local-latest-20261003
