<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OBATO - デッキ一覧</title>
  <style>
    :root{
      --bg:#070b10;
      --panel:rgba(16,22,28,.88);
      --line:rgba(255,255,255,.13);
      --text:#f7fbff;
      --muted:rgba(247,251,255,.68);
      --blue:#70c7ff;
      --green:#76f2b2;
      --gold:#f3d17a;
      --bad:#ff7585;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(900px 500px at 80% 10%,rgba(105,160,255,.16),transparent 60%),
        radial-gradient(700px 420px at 14% 12%,rgba(120,255,190,.14),transparent 58%),
        linear-gradient(180deg,#0c1219,#06080c 72%);
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 88%);
    }
    button,input{font:inherit;color:inherit}
    .page{
      width:min(1180px,calc(100vw - 28px));
      margin:0 auto;
      padding:22px 0 34px;
      position:relative;
      z-index:1;
    }
    .top{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:center;
      margin-bottom:16px;
    }
    .title h1{
      margin:0;
      font-size:clamp(26px,4vw,46px);
      letter-spacing:.04em;
    }
    .title p{margin:6px 0 0;color:var(--muted);font-size:14px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .btn{
      min-height:42px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      padding:10px 16px;
      background:rgba(255,255,255,.07);
      cursor:pointer;
      font-weight:850;
      letter-spacing:.03em;
    }
    .btn.primary{
      border-color:rgba(118,242,178,.42);
      background:linear-gradient(135deg,rgba(118,242,178,.28),rgba(95,157,255,.16));
      box-shadow:0 0 24px rgba(118,242,178,.12);
    }
    .btn.danger{
      border-color:rgba(255,117,133,.36);
      background:rgba(255,117,133,.10);
    }
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .status{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
      color:var(--muted);
    }
    .pill{
      border:1px solid rgba(255,255,255,.13);
      border-radius:999px;
      padding:7px 11px;
      background:rgba(0,0,0,.22);
      font-size:13px;
    }
    .board{
      border:1px solid var(--line);
      border-radius:24px;
      background:
        radial-gradient(680px 260px at 20% 0%,rgba(112,199,255,.11),transparent 60%),
        linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.018)),
        var(--panel);
      box-shadow:0 28px 80px rgba(0,0,0,.46);
      overflow:hidden;
    }
    .boardHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.18);
    }
    .boardHead b{font-size:18px}
    .search{
      min-width:min(360px,100%);
      height:42px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      background:rgba(0,0,0,.25);
      padding:0 14px;
      outline:none;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      padding:16px;
    }
    .deckCard{
      min-height:146px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:18px;
      background:
        linear-gradient(135deg,rgba(112,199,255,.10),transparent 34%),
        linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.18));
      padding:14px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      position:relative;
      overflow:hidden;
    }
    .deckCard::before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:5px;
      background:linear-gradient(180deg,var(--deck-color,var(--blue)),var(--green));
      opacity:.9;
    }
    .deckCard.empty{
      opacity:.65;
      border-style:dashed;
      background:rgba(0,0,0,.16);
    }
    .slot{
      color:var(--blue);
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .deckName{
      margin-top:7px;
      font-size:20px;
      line-height:1.22;
      font-weight:950;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .tag{
      border:1px solid rgba(255,255,255,.13);
      border-radius:999px;
      padding:5px 8px;
      color:rgba(255,255,255,.78);
      background:rgba(0,0,0,.22);
      font-size:12px;
    }
    .tag.public{border-color:rgba(118,242,178,.32);color:#a8ffd1}
    .tag.private{border-color:rgba(255,117,133,.30);color:#ffc4cc}
    .tag.unlisted{border-color:rgba(243,209,122,.32);color:#ffe6a6}
    .sub{
      color:var(--muted);
      font-size:12px;
      margin-top:9px;
      line-height:1.45;
      word-break:break-all;
    }
    .cardActions{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:104px;
    }
    .modeTabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .modeTab{
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      background:rgba(255,255,255,.055);
      padding:9px 14px;
      cursor:pointer;
      font-weight:900;
    }
    .modeTab.active{
      border-color:rgba(112,199,255,.55);
      background:linear-gradient(135deg,rgba(112,199,255,.22),rgba(118,242,178,.10));
      box-shadow:0 0 18px rgba(112,199,255,.16);
    }
    .editBox{
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(130px,.8fr) auto;
      gap:8px;
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.10);
    }
    .editBox label{
      display:grid;
      gap:5px;
      color:rgba(255,255,255,.62);
      font-size:12px;
      font-weight:800;
    }
    .editInput{
      min-width:0;
      height:38px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:12px;
      background:rgba(0,0,0,.24);
      padding:0 11px;
      outline:none;
    }
    .editColor{
      width:54px;
      height:38px;
      padding:4px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:12px;
      background:rgba(0,0,0,.24);
    }
    .message{
      margin-top:14px;
      min-height:22px;
      color:#97ffbc;
      white-space:pre-wrap;
    }
    .message.bad{color:var(--bad)}
    @media (max-width: 760px){
      .page{width:calc(100vw - 18px);padding-top:12px}
      .top{align-items:flex-start;flex-direction:column}
      .actions{justify-content:flex-start}
      .boardHead{align-items:stretch;flex-direction:column}
      .search{width:100%}
      .grid{grid-template-columns:1fr;padding:10px}
      .deckCard{grid-template-columns:1fr;min-height:0}
      .cardActions{flex-direction:row;min-width:0}
      .cardActions .btn{flex:1}
      .editBox{grid-template-columns:1fr 1fr auto}
    }
  </style>
  <link rel="stylesheet" href="./ui_stability_20260825.css?v=20260826_deckspace1" />
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="title">
        <h1 id="pageTitle">自分のデッキ</h1>
        <p id="pageDesc">保存済みデッキは最大10件。名前・公開範囲・テーマカラーをここで管理できます。</p>
      </div>
      <div class="actions">
        <button class="btn" id="btnHome" type="button">トップへ</button>
        <button class="btn primary" id="btnBuilder" type="button">デッキ作成へ</button>
      </div>
    </header>
    <div class="status">
      <span class="pill" id="uidPill">uid: ...</span>
      <span class="pill" id="countPill">0 / 10</span>
      <span class="pill">v20260822 deck-meta1</span>
    </div>

    <div class="modeTabs">
      <button class="modeTab active" id="tabMy" type="button">自分のデッキ</button>
      <button class="modeTab" id="tabPublic" type="button">みんなのデッキ</button>
    </div>

    <section class="board">
      <div class="boardHead">
        <b id="boardTitle">保存スロット</b>
        <input class="search" id="searchInput" placeholder="デッキ名 / ID / タグで検索" />
      </div>
      <div class="grid" id="deckGrid"></div>
    </section>
    <div class="message" id="message"></div>
  </main>
  <script type="module" src="./deck_list.js?v=20261005_community_fix1"></script>
  <script src="./ui_stability_20260825.js?v=20260826_deckspace1" defer></script>
</body>
</html>
