<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0バト｜対戦準備</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans JP",sans-serif;background:#09111b;color:#f1f6ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 85% 0%,#14494466,transparent 55%),#09111b}.app{width:min(660px,100%);margin:auto;padding:16px 14px 45px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}a{color:#bceeff;text-decoration:none}.back{padding:9px 14px;border:1px solid #426371;border-radius:12px}h1{font-size:27px;margin:8px 0}.eyebrow{font-size:12px;color:#82e5c4;letter-spacing:.14em}.lead{color:#b9cbd4;line-height:1.6}.panel{border:1px solid #344856;background:#121d2b;border-radius:18px;padding:17px;margin:13px 0}h2{font-size:19px;margin:0 0 15px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#adc1ce;font-size:13px}.count{font-size:24px;font-weight:900;color:#80f0bd}.card{border:1px solid #405567;border-radius:12px;padding:13px;background:#1a2a38;margin:10px 0;overflow-wrap:anywhere}.button,button,select,input{font:inherit}button,.button{min-height:46px;padding:11px 13px;border-radius:12px;border:1px solid #5a8394;background:#203c4b;color:#eefaff;font-weight:750;cursor:pointer}button.primary{background:linear-gradient(100deg,#1d695b,#22597a);border-color:#72d6c3;width:100%}button:disabled{opacity:.4;cursor:not-allowed}.buttons{display:grid;gap:10px}input,select{width:100%;background:#0d1925;color:#fff;border:1px solid #526978;border-radius:10px;min-height:44px;padding:10px}.message{min-height:20px;font-size:14px;color:#f8c778;line-height:1.6}.hidden{display:none}small{color:#aac1cc} .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:390px){.two{grid-template-columns:1fr}h1{font-size:23px}}.heroTitle{padding:22px 20px;margin:12px 0 22px;border:1px solid #427982;border-radius:22px;background:linear-gradient(135deg,#173d51ee,#142633,#1a2248);box-shadow:0 12px 40px #0008,inset 0 1px #ffffff26}.heroTitle .eyebrow{color:#8de9f6}.heroTitle h1{font-size:clamp(26px,7vw,38px);letter-spacing:.08em;margin:9px 0}.panel{box-shadow:0 15px 40px #0006,inset 0 1px #ffffff19;background:linear-gradient(140deg,#1b303d,#111927 70%)}.panel h2{border-left:4px solid #72e5c8;padding-left:11px}button.primary{background:linear-gradient(100deg,#2c815f,#1679a5);box-shadow:0 8px 26px #169ba333;font-size:18px}.selected-confirm{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:#1b4b4c;border:1px solid #8aded0}.selected-confirm.hidden{display:none}.selected-confirm button{background:#366c66;border-color:#86ebce}button,.button{transition:filter .15s,transform .15s}button:active,.button:active{transform:scale(.98)}@media(max-width:420px){.selected-confirm{flex-direction:column;align-items:stretch}} </style></head><body><main class="app"><header><a class="back" href="./index.html?skipIntro=1">← デッキに戻る</a><span class="eyebrow">0BATO / PLAY</span></header><div class="heroTitle"><div class="eyebrow">BATTLE ENTRY / 0BATO</div><h1>対戦準備</h1></div><section class="panel"><h2>使用するデッキ</h2><div class="card"><div class="line"><strong id="deckTitle">編集中のデッキ</strong><span id="deckCount" class="count">0 / 30</span></div><div class="muted" id="deckStatus">デッキを確認中...</div></div><div class="two"><button id="refreshDeck">現在のデッキを使う</button><a class="button" style="text-align:center" href="./deck_list.html?mode=my&return=play">保存済みデッキから選ぶ ↗</a></div><div id="chosenDeckConfirm" class="selected-confirm hidden"><span>選択したデッキを使用</span><button id="confirmDeck" type="button">決定してPLAYへ</button></div></section><section class="panel"><h2>プレイヤー設定</h2><label for="playerName">プレイヤー名</label><input id="playerName" maxlength="24" placeholder="プレイヤー名"></section><section class="panel"><h2>フィールド選択</h2><label for="fieldSelect">対戦フィールド</label><select id="fieldSelect" style="width:100%;min-height:48px;padding:10px;border-radius:12px;background:#172433;color:#fff;border:1px solid #58718a"><option value="grass">草原</option><option value="danger">危険地帯</option><option value="swamp">沼地</option></select><p id="fieldStatus" class="message" role="status">フィールドを選択してください</p><button id="confirmField" type="button">このフィールドに決定</button></section><section class="panel"><h2>対戦方法を選ぶ</h2><div class="buttons"><button class="primary" id="solo">ソロ開始 — CPUと練習</button><button id="create">ルーム作成 — 友達と対戦</button><div class="two"><input id="joinCode" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="4桁のルーム番号" aria-label="ルーム番号"><button id="join">ルーム参加</button></div></div><p id="message" class="message" role="status"></p></section></main><script type="module" src="./play.js?v=20261017_field_confirm3"></script></body></html>
