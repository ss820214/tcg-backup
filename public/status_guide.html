<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>0バト｜状態異常ガイド</title>
    <link rel="stylesheet" href="./status_icons.css?v=20260831_player_icons1" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b10;
        --panel: rgba(18, 25, 31, 0.92);
        --panel2: rgba(11, 16, 22, 0.96);
        --line: rgba(255, 255, 255, 0.14);
        --text: rgba(255, 255, 255, 0.94);
        --muted: rgba(255, 255, 255, 0.64);
        --blue: #6ee7ff;
        --green: #74f2a7;
        --yellow: #ffd95a;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 12% 16%, rgba(110, 231, 255, 0.16), transparent 28rem),
          radial-gradient(circle at 82% 10%, rgba(190, 130, 255, 0.16), transparent 32rem),
          linear-gradient(135deg, #070b10, #101711 55%, #08070c);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(180deg, #000, transparent 92%);
      }

      a,
      button { font: inherit; }

      .page {
        position: relative;
        z-index: 1;
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        background:
          radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.72), transparent 0 13%),
          radial-gradient(circle at 68% 68%, rgba(116, 242, 167, 0.78), transparent 0 20%),
          linear-gradient(135deg, #8b7cff, #4fbf93);
        box-shadow: 0 0 24px rgba(110, 231, 255, 0.22);
      }

      h1,
      h2,
      h3,
      p { margin: 0; }

      h1 {
        font-size: clamp(1.55rem, 4.4vw, 2.55rem);
        letter-spacing: 0;
      }

      .lead {
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.75;
      }

      .back {
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 800;
        white-space: nowrap;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(280px, 0.92fr) minmax(360px, 1.08fr);
        gap: 18px;
        align-items: stretch;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 34%),
          var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }

      .intro {
        padding: 24px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(116, 242, 167, 0.45);
        border-radius: 999px;
        color: #bdff8c;
        background: rgba(116, 242, 167, 0.1);
        padding: 7px 12px;
        font-weight: 900;
        font-size: 0.82rem;
      }

      .intro h2 {
        margin-top: 16px;
        font-size: clamp(1.35rem, 4.2vw, 2.4rem);
        line-height: 1.12;
      }

      .intro p {
        margin-top: 14px;
        color: var(--muted);
        line-height: 1.8;
      }

      .orbit {
        position: relative;
        min-height: 360px;
        padding: 24px;
        display: grid;
        place-items: center;
      }

      .orbitRing {
        position: relative;
        width: min(420px, 82vw);
        aspect-ratio: 1;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        background:
          radial-gradient(circle, rgba(116, 242, 167, 0.14), transparent 0 28%, rgba(110, 231, 255, 0.06) 29%, transparent 67%),
          radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.32), transparent 62%);
      }

      .orbitCenter {
        position: absolute;
        inset: 50%;
        width: 140px;
        height: 140px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        display: grid;
        place-items: center;
        text-align: center;
        font-weight: 900;
        color: #bdff8c;
        border: 1px solid rgba(189, 255, 140, 0.42);
        background: rgba(35, 48, 30, 0.78);
        box-shadow: 0 0 38px rgba(189, 255, 140, 0.18);
      }

      .orbitItem {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 72px;
        height: 72px;
        margin: -36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: var(--tone);
        transform:
          rotate(var(--angle))
          translateX(min(180px, 36vw))
          rotate(calc(var(--angle) * -1));
      }

      .orbitItem .statusDoodle {
        font-size: 62px;
        background-color: rgba(255, 255, 255, 0.09);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(8, 12, 17, 0.76);
      }

      .filter {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        padding: 9px 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .filter.active {
        color: #07110c;
        border-color: rgba(116, 242, 167, 0.82);
        background: linear-gradient(135deg, #77f0b0, #6ee7ff);
        box-shadow: 0 0 20px rgba(116, 242, 167, 0.2);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 14px;
        min-height: 184px;
        padding: 18px;
        border: 1px solid color-mix(in srgb, var(--tone), transparent 58%);
        border-radius: 18px;
        background:
          radial-gradient(circle at 18% 14%, color-mix(in srgb, var(--tone), transparent 82%), transparent 12rem),
          linear-gradient(180deg, rgba(255, 255, 255, 0.055), transparent 48%),
          var(--panel2);
      }

      .statusMark {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        color: var(--tone);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
      }

      .statusMark .statusDoodle { font-size: 54px; }

      .card h3 {
        font-size: 1.15rem;
        margin-top: 2px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 9px 0 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 3px 9px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.06);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .card p {
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.7;
      }

      .note {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: color-mix(in srgb, var(--tone), white 28%);
        line-height: 1.65;
        font-size: 0.9rem;
      }

      @media (max-width: 920px) {
        .hero { grid-template-columns: 1fr; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 20px, 540px);
          padding-top: 14px;
        }

        .topbar {
          align-items: flex-start;
        }

        .brand {
          align-items: flex-start;
        }

        .mark {
          width: 42px;
          height: 42px;
          border-radius: 13px;
        }

        .back {
          padding: 10px 13px;
          font-size: 0.88rem;
        }

        .intro,
        .orbit {
          padding: 18px;
        }

        .orbit { min-height: 300px; }
        .orbitItem {
          transform:
            rotate(var(--angle))
            translateX(min(132px, 34vw))
            rotate(calc(var(--angle) * -1));
        }
        .orbitItem .statusDoodle { font-size: 48px; }

        .orbitCenter {
          width: 108px;
          height: 108px;
          font-size: 0.9rem;
        }

        .grid { grid-template-columns: 1fr; }

        .card {
          grid-template-columns: 58px 1fr;
          min-height: 0;
          padding: 14px;
        }

        .statusMark {
          width: 54px;
          height: 54px;
          border-radius: 16px;
        }

        .statusMark .statusDoodle { font-size: 42px; }
      }
    </style>
  </head>
  <body>
<main class="page">
<header class="topbar"><div class="brand"><div class="mark" aria-hidden="true"></div><div><h1>状態異常ガイド</h1><p class="lead">状態異常・強化・防御の効果を確認できます。詳しい数値はカード本文を優先してください。</p></div></div><a class="back" href="./index.html">ホームへ戻る</a></header>
<section class="hero">
<div class="panel intro"><span class="tag">STATUS GUIDE</span><h2>状態を知れば、次の一手が変わる。</h2><p>状態異常はHPやSPだけでなく、技の成功率、移動、消費マナなどにも影響します。</p><p>下の分類で絞り込み、各マークと効果を確認できます。</p></div>
<div class="panel orbit" aria-label="状態異常マークの一覧"><div class="orbitRing" id="orbitRing"><div class="orbitCenter">状態異常<br>マーク</div></div></div>
</section>
<nav class="filters" aria-label="分類で絞り込み">
<button class="filter active" type="button" data-filter="all">全部</button>
<button class="filter" type="button" data-filter="damage">ダメージ</button>
<button class="filter" type="button" data-filter="control">行動妨害</button>
<button class="filter" type="button" data-filter="hand">技の妨害</button>
<button class="filter" type="button" data-filter="guard">防御</button>
<button class="filter" type="button" data-filter="buff">強化</button>
<button class="filter" type="button" data-filter="special">特殊</button>
</nav>
<section class="grid" id="statusGrid" aria-live="polite"></section>
</main>
<script>
(()=>{
"use strict";
const statuses=[{"key":"blind","name":"盲目","cat":"control","tone":"#d4d7dc","timing":"技の命中判定","effect":"技の成功率が半分になります。","tip":"高コストの技を使う前に解除を考えましょう。"},{"key":"smell","name":"におい","cat":"control","tone":"#9ca3af","timing":"ターン終了時","effect":"ターン終了時にSPを10減らします。","tip":"SPが少ないキャラはパニックに注意。"},{"key":"seal","name":"封印","cat":"control","tone":"#8fb4ff","timing":"技の使用時","effect":"攻撃技が使用できなくなる状態です。","tip":"技に依存するキャラを止めると効果的。"},{"key":"lostSoul","name":"失魂","cat":"special","tone":"#b889ff","timing":"付与中","effect":"一部の回復・強化などの補助効果を受けられません。","tip":"味方の支援が届かなくなる点に注意。"},{"key":"rage","name":"激怒","cat":"special","tone":"#ff8b4a","timing":"技が失敗した時","effect":"技が失敗すると自分にHP20のダメージを受けます。","tip":"成功率の低い大技は危険になります。"},{"key":"brainwash","name":"洗脳","cat":"hand","tone":"#ff7fe5","timing":"技の選択時","effect":"一定確率で相手に技の使用を左右されます。","tip":"使いたい技が選べなくなる場合があります。"},{"key":"sludge","name":"ヘドロ","cat":"control","tone":"#9b8a62","timing":"技の使用時","effect":"技の消費マナが1増えます。","tip":"連続で技を使う戦術に不利です。"},{"key":"evade","name":"回避","cat":"guard","tone":"#6ee7ff","timing":"攻撃を受けた時","effect":"表示確率で攻撃を避け、攻撃を失敗扱いにします。","tip":"命中率を補助すると対処しやすくなります。"},{"key":"counter","name":"カウンター","cat":"guard","tone":"#74f2a7","timing":"ダメージを受けた時","effect":"条件を満たすと受けるダメージを軽減し、反撃します。","tip":"反撃の条件はカード本文で確認してください。"},{"key":"armor","name":"装甲","cat":"guard","tone":"#d4d7dc","timing":"HPダメージ時","effect":"受けるHPダメージを装甲の数値分減らします。","tip":"SPダメージには適用されません。"},{"key":"bleed","name":"出血","cat":"damage","tone":"#ff6b7a","timing":"移動時","effect":"移動するとHPダメージを受けます。","tip":"無理に移動する前に回復方法を確認。"},{"key":"powerUp","name":"攻撃増加","cat":"buff","tone":"#ffd95a","timing":"HPダメージ時","effect":"与えるHPダメージを数値分増やします。","tip":"HPダメージを与える技と相性がよい効果。"},{"key":"fracture","name":"骨折","cat":"control","tone":"#f2c56b","timing":"移動時","effect":"移動ができなくなる状態です。","tip":"位置取りが重要なキャラは注意。"},{"key":"poison","name":"毒","cat":"damage","tone":"#a78bfa","timing":"ターン開始時","effect":"50%で毒が解除され、失敗するとHPに10ダメージを受けます。","tip":"長引くと被害が増えます。"},{"key":"taiman","name":"タイマン","cat":"special","tone":"#f2c56b","timing":"攻撃を受けた時","effect":"正面から向き合う敵以外の攻撃を防ぎます。","tip":"側面や背後の攻撃条件を確認しましょう。"},{"key":"aim","name":"命中増加","cat":"buff","tone":"#6ee7ff","timing":"技の判定時","effect":"技の成功率を上昇させます。上限は95%です。","tip":"重要な攻撃の前に使うと有効。"},{"key":"hitUp","name":"命中補助","cat":"buff","tone":"#a7f3d0","timing":"技の判定時","effect":"技の成功率を数値分上昇させます。","tip":"他の命中補正との重なりに注意。"},{"key":"jinx","name":"命中低下","cat":"control","tone":"#a78bfa","timing":"技の判定時","effect":"技の成功率を数値分下げます。","tip":"強力な技を持つ相手に有効。"},{"key":"power","name":"攻撃強化","cat":"buff","tone":"#ffca5f","timing":"HPダメージ時","effect":"HPダメージを数値分増やします。","tip":"攻撃増加と同様に、HPに影響する技を強化します。"},{"key":"panic","name":"パニック","cat":"special","tone":"#ff6b7a","timing":"SPが0になった時","effect":"SPが0になるとパニック状態になります。SP回復で復帰します。","tip":"SPを守ることも重要です。"},{"key":"fatigue","name":"疲労","cat":"control","tone":"#ffd95a","timing":"行動後","effect":"そのターンに行動した状態です。進化で再行動できる場合があります。","tip":"移動回数は進化してもリセットされません。"}];
const catLabel={damage:"ダメージ",control:"行動妨害",hand:"技の妨害",guard:"防御",buff:"強化",special:"特殊"};
const iconHtml=(key,name)=>'<span class="statusDoodle statusDoodle-'+key+'" aria-hidden="true"><i></i><b></b><em></em><strong></strong><span>'+name.slice(0,1)+'</span></span>';
const orbit=document.getElementById("orbitRing");
statuses.slice(0,12).forEach((s,index)=>{const el=document.createElement("div");el.className="orbitItem";el.style.setProperty("--angle",(360/12*index)+"deg");el.style.setProperty("--tone",s.tone);el.title=s.name;el.innerHTML=iconHtml(s.key,s.name);orbit.appendChild(el)});
const grid=document.getElementById("statusGrid"),buttons=[...document.querySelectorAll("[data-filter]")];
function render(filter="all"){const shown=statuses.filter(s=>filter==="all"||s.cat===filter);grid.innerHTML=shown.map(s=>'<article class="card" style="--tone:'+s.tone+'"><div class="statusMark">'+iconHtml(s.key,s.name)+'</div><div><h3>'+s.name+'</h3><div class="meta"><span class="pill">'+catLabel[s.cat]+'</span><span class="pill">'+s.timing+'</span></div><p>'+s.effect+'</p><div class="note">対策：'+s.tip+'</div></div></article>').join("");}
buttons.forEach(btn=>btn.addEventListener("click",()=>{buttons.forEach(b=>b.classList.toggle("active",b===btn));render(btn.dataset.filter)}));
render();
})();
</script></body></html>
