name: One-shot unified mode theme 20261005

on:
  push:
    branches:
      - import/local-latest-20261003
    paths:
      - '.github/workflows/one-shot-unified-theme-20261005.yml'

permissions:
  contents: write

jobs:
  wire-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: import/local-latest-20261003
          fetch-depth: 0

      - name: Append unified mode theme loader once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/global_ui_20260821.js')
          text = path.read_text(encoding='utf-8-sig')
          marker = '20261005_unified_theme1'
          if marker not in text:
              text = text.rstrip() + r'''

// Shared visual theme for the non-battle game modes.
(() => {
  const THEME = "20261005_unified_theme1";
  const page = (location.pathname.split("/").pop() || "index.html")
    .toLowerCase()
    .replace(/\.html$/i, "");
  const themedPages = new Set(["profile", "gacha", "arcade", "creator"]);
  if (!themedPages.has(page)) return;

  const load = () => {
    if (!document.head) {
      requestAnimationFrame(load);
      return;
    }
    if (document.querySelector(`link[data-unified-mode-theme="${THEME}"]`)) return;
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = `./unified_mode_theme_20261005.css?v=${THEME}`;
    link.dataset.unifiedModeTheme = THEME;
    link.addEventListener("load", () => {
      document.documentElement.dataset.unifiedModeTheme = THEME;
      window.dispatchEvent(new CustomEvent("tcg:unified-mode-theme-ready", {
        detail: { version: THEME, page },
      }));
    }, { once: true });
    link.addEventListener("error", () => {
      console.error("[global_ui] unified mode theme failed to load");
    }, { once: true });
    document.head.appendChild(link);
  };

  load();
})();
''' + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          node --check public/global_ui_20260821.js
          test -s public/unified_mode_theme_20261005.css
          grep -q '20261005_unified_theme1' public/global_ui_20260821.js
          grep -q 'ui-page-profile' public/unified_mode_theme_20261005.css
          grep -q 'ui-page-gacha' public/unified_mode_theme_20261005.css
          grep -q 'ui-page-arcade' public/unified_mode_theme_20261005.css
          grep -q 'ui-page-creator' public/unified_mode_theme_20261005.css

      - name: Commit theme wiring
        run: |
          if git diff --quiet -- public/global_ui_20260821.js; then
            echo 'Theme loader already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/global_ui_20260821.js
          git commit -m '各モードへ共通デザインテーマを接続'
          git push origin HEAD:import/local-latest-20261003
