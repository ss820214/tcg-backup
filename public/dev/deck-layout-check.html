<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>デッキ表示確認</title>
<style>
body { margin:0; background:#101018; color:white; font:14px sans-serif; }
header { padding:12px; display:flex; gap:12px; align-items:center; }
button { padding:8px 14px; }
iframe { display:block; margin:0 12px 12px; border:1px solid #666; width:390px; height:844px; }
</style>
<header>デッキ表示確認 <button data-width="360">360px</button><button data-width="390">390px</button><button data-width="430">430px</button><button data-width="1200">PC</button></header>
<iframe title="デッキ表示" src="/index.html"></iframe>
<script>
document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => {
  document.querySelector('iframe').style.width = button.dataset.width + 'px';
}));
</script>
</html>
