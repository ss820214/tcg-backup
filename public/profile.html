<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>0BATo - 繝ｦ繝ｼ繧ｶ繝ｼ</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: rgba(255,255,255,.055);
      --panel2: rgba(255,255,255,.085);
      --line: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --accent: #78e3ad;
      --warn: #ffd166;
      --blue: #8fc7ff;
      --bad: #ff7a90;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 640px at 12% 0%, rgba(120,227,173,.14), transparent 58%),
        radial-gradient(820px 620px at 86% 4%, rgba(255,209,102,.10), transparent 52%),
        linear-gradient(180deg, #090a0e, var(--bg) 48%, #08090c);
    }
    .wrap { width: min(1160px, calc(100vw - 28px)); margin: 0 auto; padding: 18px 0 34px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 13px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.11); }
    .grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 14px; }
    .panel {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .panel h2 { margin: 0 0 10px; font-size: 14px; color: rgba(255,255,255,.8); }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 12px;
      background: rgba(0,0,0,.2);
      min-height: 76px;
    }
    .label { color: var(--muted); font-size: 12px; }
    .value { margin-top: 6px; font-size: 24px; font-weight: 900; letter-spacing: .01em; }
    .value.gem { color: var(--warn); }
    .value.good { color: var(--accent); }
    .uid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .uidTools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .uidTools button { padding: 7px 10px; font-size: 12px; }
    .uidCopyMsg { font-size: 12px; color: var(--accent); }
    .uidCopyMsg.bad { color: var(--bad); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
    .search {
      width: min(360px, 100%);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      background: rgba(0,0,0,.22);
      color: var(--text);
      outline: none;
    }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card {
      position: relative;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 8px;
      padding: 12px;
      background: rgba(0,0,0,.20);
      min-height: 104px;
    }
    .rar { font-size: 11px; font-weight: 900; color: var(--blue); }
    .rar.SSR { color: var(--warn); }
    .rar.SR { color: #d2a8ff; }
    .name { margin-top: 8px; font-size: 14px; font-weight: 900; line-height: 1.35; }
    .meta { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .count {
      position: absolute; right: 10px; top: 10px;
      min-width: 34px; text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      padding: 3px 7px;
      background: rgba(255,255,255,.08);
      font-weight: 900;
    }
    .history { display: grid; gap: 8px; }
    .youBox {
      display: grid;
      gap: 12px;
    }
    .youCardHead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px 72px;
      gap: 10px;
      align-items: stretch;
      border: 1px solid rgba(120,227,173,.22);
      border-radius: 8px;
      padding: 12px;
      background:
        radial-gradient(280px 160px at 0% 0%, rgba(120,227,173,.16), transparent 60%),
        rgba(0,0,0,.22);
    }
    .youName { font-size: 24px; font-weight: 1000; letter-spacing: .04em; }
    .youMeta { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .youStat {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 22px;
      font-weight: 1000;
      background: rgba(255,255,255,.06);
    }
    .youStat b { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
    .youList { display: grid; gap: 6px; }
    .youLine {
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      padding: 8px 10px;
      background: rgba(0,0,0,.18);
      font-size: 12px;
      line-height: 1.45;
    }
    .youLine.muted { color: var(--muted); }
    .youSkillRow { display: grid; gap: 8px; }
    .youSkillTop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .youSkillTop span { min-width: 0; }
    .perkIconBtn {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      border-color: rgba(255,209,102,.34);
      background: rgba(255,209,102,.10);
      font-size: 16px;
    }
    .perkIconBtn.active {
      border-color: rgba(120,227,173,.55);
      background: rgba(120,227,173,.14);
      box-shadow: 0 0 0 1px rgba(120,227,173,.08), 0 0 16px rgba(120,227,173,.12);
    }
    .youPerkPanel {
      display: grid;
      gap: 7px;
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 8px;
    }
    .youPerkCurrent { color: rgba(255,255,255,.78); font-size: 12px; line-height: 1.45; }
    .youPerkApply { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .youAttrRow, .youPerkRows {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }
    .youPerkRows { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .youAttrRow label, .youPerkRows label { display: grid; gap: 5px; min-width: 0; }
    .youAttrRow select, .youPerkRows select, .youPerkApply select {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text);
      background: rgba(0,0,0,.28);
      outline: none;
    }
    .youBtns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .youBtns button { border-color: rgba(120,227,173,.28); }
    .youBtns button:disabled { opacity: .42; cursor: not-allowed; }
    .youMsg { min-height: 18px; color: var(--accent); font-size: 12px; }
    .youMsg.bad { color: var(--bad); }
    .adminGrid { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
    .adminWide { grid-column: 1 / -1; }
    .adminInput {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: rgba(0,0,0,.22);
      color: var(--text);
      outline: none;
    }
    .adminBtns { display: flex; gap: 10px; flex-wrap: wrap; }
    .adminMsg { margin-top: 10px; min-height: 18px; font-size: 12px; color: var(--accent); }
    .adminMsg.bad { color: var(--bad); }
    .hidden { display: none !important; }
    .row {
      display: grid;
      grid-template-columns: 82px 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      padding: 10px;
      background: rgba(0,0,0,.18);
      font-size: 13px;
    }
    .result.win { color: var(--accent); font-weight: 900; }
    .result.lose { color: var(--bad); font-weight: 900; }
    .empty { color: var(--muted); padding: 12px 0; }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .stats { grid-template-columns: 1fr 1fr; }
      .row { grid-template-columns: 68px 1fr; }
      .row .reward { grid-column: 2; }
      .youCardHead { grid-template-columns: 1fr 64px 64px; }
      .youAttrRow, .youPerkRows { grid-template-columns: 1fr; }
      .youBtns { grid-template-columns: 1fr 1fr; }
    }
  </style>

  <style id="profileMobileLayout20261009">
    /* Profile-only overflow guard: never affect deck builder or battle screens. */
    html,body { max-width:100%; overflow-x:clip; }
    .wrap,.grid,.panel,.stats,.stat,.toolbar,.youBox,.youCardHead,.adminGrid { min-width:0; max-width:100%; }
    .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .stat { overflow:hidden; }
    .stat .label { overflow-wrap:anywhere; word-break:normal; line-height:1.45; }
    .stat .value { min-width:0; max-width:100%; overflow-wrap:anywhere; }
    .stat .uid { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:clamp(15px,4vw,22px); }
    .cards { grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr)); }
    .card,.row,.youLine { min-width:0; overflow-wrap:anywhere; }
    .adminGrid { grid-template-columns:minmax(0,1fr) minmax(90px,120px); }
    @media (max-width:820px) {
      body .wrap { width:calc(100% - 24px); margin-inline:auto; padding-top:14px; }
      body .grid { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
      body .panel { width:100%; min-width:0; max-width:100%; padding:12px; }
      body .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
      body .stat { min-width:0; width:auto; min-height:78px; padding:11px; }
      body .stat:first-child { grid-column:1/-1; }
      body .stat .value { font-size:clamp(19px,6vw,27px); line-height:1.25; }
      body .stat .uid { font-size:clamp(15px,4.4vw,22px); }
      body .stat .uidTools { gap:6px; }
      body header { min-width:0; width:100%; gap:10px; }
      body .actions { width:100%; min-width:0; justify-content:flex-start; gap:7px; }
      body .actions button { min-width:0; padding:9px 12px; }
      body .toolbar { flex-wrap:wrap; align-items:flex-start; }
      body .toolbar .search { min-width:0; width:100%; }
      body .youCardHead { grid-template-columns:minmax(0,1fr) 60px 60px; gap:6px; padding:9px; }
      body .youName { font-size:19px; overflow-wrap:anywhere; }
      body .youStat { min-width:0; padding:7px 3px; font-size:18px; }
      body .youBtns { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
      body .youBtns button { min-width:0; white-space:normal; overflow-wrap:anywhere; }
      body .adminGrid { grid-template-columns:minmax(0,1fr) minmax(90px,110px); }
    }
    @media (max-width:359px) {
      body .wrap { width:calc(100% - 16px); }
      body .panel { padding:9px; }
      body .stats { gap:6px; }
      body .stat { padding:8px; }
      body .youCardHead { grid-template-columns:minmax(0,1fr) 50px 50px; }
    }
  </style>
</head>
<body>

      <div>

        <div class="sub">謇謖√き繝ｼ繝峨√ず繧ｧ繝縲∝ｯｾ謌ｦ螻･豁ｴ</div>
