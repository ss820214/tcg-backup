<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Battle Lobby</title>
  <link rel="stylesheet" href="./battle.css" />
</head>
<body>
  <div class="page">
    <!-- Top bar -->
    <header class="topbar">
      <div class="room">
        <div class="roomLabel">ROOM</div>
        <div class="roomId" id="roomId">----</div>
      </div>

      <div class="topStatus">
        <div class="statusTitle">ステータス</div>
        <div class="statusText" id="status">読み込み中…</div>
        <div class="statusSub muted" id="readyNote"></div>
      </div>

      <div class="topActions">
        <button id="readyBtn" class="btnPrimary" disabled>準備完了</button>
        <div class="hint muted">両者 READY で自動開始</div>
      </div>
    </header>

    <!-- VS Banner -->
    <section class="vsBanner panel">
      <div class="sideCard" id="p1Card">
        <div class="seatLabel">1P</div>
        <div class="playerName" id="p1Name">---</div>
        <div class="readyBadge" id="p1Ready"></div>
        <div class="youTag" id="p1You"></div>
      </div>

      <div class="vsCenter">
        <div class="vsText">VS</div>
        <div class="muted small">準備が揃うまで待機</div>
      </div>

      <div class="sideCard right" id="p2Card">
        <div class="seatLabel">2P</div>
        <div class="playerName" id="p2Name">---</div>
        <div class="readyBadge" id="p2Ready"></div>
        <div class="youTag" id="p2You"></div>
      </div>
    </section>

    <!-- Main -->
    <main class="mainGrid">
      <!-- Deck (left) -->
      <section class="panel deckPanel">
        <div class="panelHeader">
          <div class="panelTitle">デッキ（左：カード / 右：詳細）</div>
          <div class="panelSub muted">クリックでカード詳細</div>
        </div>

        <div class="deckWrap">
          <div class="deckLeft">
            <div class="subTitle">カード一覧</div>
            <div id="myDeck" class="deckList"></div>
          </div>

          <div class="deckDetail panelInner">
            <div class="subTitle">カード詳細</div>
            <div id="deckDetail" class="deckDetailBody muted">カードを選択してください</div>
          </div>
        </div>

        <!-- 互換のため残す（今までの players 表示も残す） -->
        <details class="compatBox">
          <summary>（互換）参加者一覧 / デバッグ</summary>
          <ul id="players" class="playersList"></ul>
        </details>
      </section>

      <!-- Deck Evaluation (right) -->
      <section class="panel evalPanel">
        <div class="panelHeader">
          <div class="panelTitle">デッキ評価</div>
          <div class="panelSub muted">レーダー＋属性分布</div>
        </div>

        <div class="radarWrap">
          <canvas id="battleDeckRadar" width="360" height="260"></canvas>
          <div id="battleDeckRadarText" class="muted small"></div>
        </div>

        <div class="attrWrap">
          <div class="subTitle">属性の分布</div>
          <div id="attrDist" class="attrDist">
            <div class="muted">デッキが読み込まれると表示されます</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Pong -->
    <section class="panel pongPanel">
      <div class="panelHeader">
        <div class="panelTitle">ピンポン（待ち時間用）</div>
        <div class="panelSub muted">左端付近で「打ち返す！」</div>
      </div>

      <div class="pongRow">
        <div class="pong">
          <div class="wall wallL"></div>
          <div class="wall wallR"></div>
          <div class="paddle"></div>
          <div class="ball" id="ball"></div>
        </div>

        <div class="pongControls">
          <button id="pingBtn" class="btnGhost">打ち返す！</button>
          <button id="pingResetBtn" class="btnGhost">リセット</button>
          <div id="pingStatus" class="muted">スタート！</div>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="./battle.js"></script>
</body>
</html>
