name: Deck Play Stability V3 Check

on:
  push:
    branches:
      - test/play-stability3-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check public/global_ui_20260821.js
          node --check public/deck_mobile_refine_20261003.js
          node --check public/deck_mobile_density_20261003.js
          node --check public/deck_runtime_guard_20261003.js

      - name: Start site
        run: |
          cd public
          nohup python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          curl --fail -I http://127.0.0.1:8000/deck.html

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Check PLAY, safe back, browser back, and reload stability
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 460, height: 900 },
            userAgent: 'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 Chrome/154 Mobile Safari/537.36'
          });
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', msg => {
            if (msg.type() === 'error') pageErrors.push(`console: ${msg.text()}`);
          });

          await page.addInitScript(() => {
            try {
              localStorage.setItem('tcgDeckStartSeen', '1');
              localStorage.setItem('tcgDeviceModeOverrideV2', 'mobile');
            } catch {}
          });

          async function waitGuardQuick() {
            await page.waitForFunction(() =>
              document.documentElement.dataset.deckRuntimeGuardBound === '20261003_guard2' &&
              !!document.getElementById('btnSafeBack'),
              null,
              { timeout: 5000 }
            );
          }

          async function waitDynamicHome() {
            await page.waitForFunction(() => {
              const h = document.getElementById('deckStart');
              const p = h?.querySelector?.('[data-home-action="play"]');
              if (!h || !p) return false;
              const hs = getComputedStyle(h);
              const ps = getComputedStyle(p);
              const r = p.getBoundingClientRect();
              return document.body.classList.contains('mobileHomeFit') &&
                !h.classList.contains('hide') &&
                h.getAttribute('aria-hidden') !== 'true' &&
                hs.display !== 'none' && hs.visibility !== 'hidden' &&
                ps.display !== 'none' && ps.visibility !== 'hidden' &&
                Number(ps.opacity || 1) > 0 &&
                r.width > 40 && r.height > 30;
            }, null, { timeout: 30000 });
          }

          async function waitDrawer(open) {
            await page.waitForFunction((wanted) => {
              const d = document.getElementById('roomDrawer');
              if (!d) return false;
              const isOpen = d.classList.contains('open') && d.getAttribute('aria-hidden') === 'false';
              return wanted ? isOpen : !isOpen;
            }, open, { timeout: 7000 });
          }

          await page.goto('http://127.0.0.1:8000/deck.html?view=mobile&stability=3', { waitUntil: 'domcontentloaded' });
          await waitGuardQuick();
          await waitDynamicHome();

          // Normal user click: PLAY must open the room UI.
          await page.click('[data-home-action="play"]');
          await waitDrawer(true);

          // Safe back closes the overlay first, without leaving the page.
          const urlBeforeBack = page.url();
          await page.click('#btnSafeBack');
          await waitDrawer(false);
          if (page.url() !== urlBeforeBack) throw new Error('safe back unexpectedly navigated away while drawer was open');

          // PLAY again, then browser back should also close the drawer safely.
          await page.waitForSelector('#roomDrawerToggle');
          await page.click('#roomDrawerToggle');
          await waitDrawer(true);
          await page.evaluate(() => history.back());
          await waitDrawer(false);
          if (!page.url().includes('/deck.html')) throw new Error('browser back escaped deck page instead of closing drawer');

          // One more safe back from builder state should restore the dynamic home.
          await page.click('#btnSafeBack');
          await waitDynamicHome();

          await page.screenshot({ path: 'play-stability3.png', fullPage: true });

          // Reload several times: guard must come up immediately; full home must settle each time.
          for (let i = 0; i < 3; i++) {
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitGuardQuick();
            await waitDynamicHome();
          }

          const critical = pageErrors.filter(x => !/favicon|ERR_BLOCKED_BY_CLIENT|Failed to load resource.*404/i.test(x));
          if (critical.length) {
            console.log('Browser console/page errors observed:');
            critical.forEach(x => console.log(x));
          }

          console.log('PLAY_STABILITY_V3_OK');
          await browser.close();
          EOF
          node check.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-stability3-check
          path: play-stability3.png
          if-no-files-found: ignore
          retention-days: 1
