  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckSaveRow #deckTitle,
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckSaveRow #btnSave{
    min-height:29px!important;
    height:29px!important;
    font-size:10px!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) .deckInfoBody{
    min-height:0!important;
    padding:0 4px 4px!important;
    gap:3px!important;
  }
  body.mobileFitUi.mobileDeckUi.${BODY_CLASS}:not(.mobileHomeFit) #deckList.list{
    flex:0 0 auto!important;
    min-height:0!important;
    height:auto!important;
    max-height:44dvh!important;
    gap:3px!important;
    padding:0 1px 4px!important;
    overflow-y:auto!important;
  }
'''
              s = s.replace(marker, strong + "\n" + marker, 1)

          pattern = re.compile(r'  function normalizeHeader\(\) \{.*?\n  \}\n\n  function hideRedundantLabels', re.S)
          repl = '''  function normalizeHeader() {
            const home = $("btnHome");
            const deck = $("btnDeckTop");
            const settings = $("btnSettings");
            const badge = $("deviceModeBadge");
            const header = document.querySelector("header");
            if (home) {
              home.hidden = false;
              home.textContent = "ホーム";
              home.setAttribute("aria-label", "ホームへ戻る");
            }
            if (deck) {
              deck.hidden = false;
              deck.textContent = "デッキ";
              deck.setAttribute("aria-label", "デッキ画面");
            }
            if (settings) settings.hidden = true;
            if (badge && header && badge.parentElement !== header) header.appendChild(badge);
          }

          function hideRedundantLabels'''
          s2, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit("density normalizeHeader patch failed")
          s = s2

          pattern = re.compile(r'  function compactAttributeGuide\(\) \{.*?\n  \}\n\n  function compactDeckStatus', re.S)
          repl = '''  function compactAttributeGuide() {
            document.querySelectorAll("#deckMainPanel *").forEach((el) => {
              if (!(el instanceof HTMLElement)) return;
              const text = String(el.textContent || "").replace(/\\s+/g, " ").trim();
              if (!text.includes("属性の特徴")) return;
              const box = el.closest(".msg,.small,.guide,.attributeGuide,.attributeHint,[class*='attribute'],[class*='guide']") || el;
              const targets = [el, box, box.parentElement, box.parentElement?.parentElement];
              targets.forEach((node) => {
                if (!(node instanceof HTMLElement)) return;
                if (!node.closest("#deckMainPanel")) return;
                if (node.matches("#deckMainPanel,#mobileCardSection,.filterBox")) return;
                node.style.setProperty("margin-top", "2px", "important");
                node.style.setProperty("margin-bottom", "3px", "important");
                node.style.setProperty("padding-top", "4px", "important");
                node.style.setProperty("padding-bottom", "4px", "important");
                node.style.setProperty("min-height", "0", "important");
                node.style.setProperty("height", "auto", "important");
                node.style.setProperty("max-height", "none", "important");
                node.style.setProperty("line-height", "1.22", "important");
              });
              const next = box.nextElementSibling;
              if (next instanceof HTMLElement) next.style.setProperty("margin-top", "3px", "important");
            });
          }

          function compactDeckStatus'''
          s2, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit("compactAttributeGuide patch failed")
          write(path, s2)

          # 3) Loader versions: force fresh refine+density scripts.
          path = "public/global_ui_20260821.js"
          s = read(path)
          if "20261003_refine2" not in s or "20261003_density1" not in s:
              raise SystemExit("global loader versions not found")
          s = s.replace("20261003_refine2", "20261003_refine3")
          s = s.replace("20261003_density1", "20261003_density2")
          write(path, s)

          # 4) Deck page cache-bust for the global loader itself.
          path = "public/deck.html"
          s = read(path)
          old = "./global_ui_20260821.js?v=20260926_device_switch4"
          new = "./global_ui_20260821.js?v=20261003_density2"
          if old not in s and new not in s:
              raise SystemExit("deck global-ui script tag not found")
          s = s.replace(old, new)
          write(path, s)
          PY

      - name: Validate changed scripts
        run: |
          node --check public/global_ui_20260821.js
          node --check public/deck_mobile_refine_20261003.js
          node --check public/deck_mobile_density_20261003.js
          git diff --check
          git diff --stat

      - name: Commit to latest branch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "ss820214"
          git config user.email "165994272+ss820214@users.noreply.github.com"
          git add public/deck.html public/global_ui_20260821.js public/deck_mobile_refine_20261003.js public/deck_mobile_density_20261003.js
          git commit -m "スマホ版デッキの空白と操作密度を再調整"
          git push origin HEAD:import/local-latest-20261003
