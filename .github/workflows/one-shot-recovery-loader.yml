name: One-shot Recovery Loader
on:
  push:
    branches: [import/local-latest-20261003]
    paths: [.github/workflows/one-shot-recovery-loader.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/local-latest-20261003
      - name: Insert recovery bootstrap before runtime guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/deck.html')
          s = p.read_text(encoding='utf-8-sig')
          recovery = '<script src="./deck_bootstrap_recovery_20261003.js?v=20261003_recovery1"></script>'
          guard = '<script src="./deck_runtime_guard_20261003.js?v=20261003_guard2" data-deck-runtime-guard="20261003_guard2"></script>'
          if recovery not in s:
              if guard not in s:
                  raise SystemExit('runtime guard marker missing')
              s = s.replace(guard, recovery + '\n' + guard, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'deck_bootstrap_recovery_20261003.js?v=20261003_recovery1' public/deck.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ss820214"
          git config user.email "165994272+ss820214@users.noreply.github.com"
          git add public/deck.html
          git commit -m "Firebase待ち用の復旧ホームを先行ロード"
          git push origin HEAD:import/local-latest-20261003
