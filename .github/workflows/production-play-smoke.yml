name: Production PLAY Smoke Check

on:
  push:
    branches:
      - test/production-play-smoke-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose deployed files
        run: |
          set -euxo pipefail
          URL="https://tcg-0bato.web.app/deck.html?diag=$(date +%s)"
          curl -fsSL -D prod-headers.txt "$URL" -o prod-deck.html
          echo '--- RESPONSE HEADERS ---'
          cat prod-headers.txt
          echo '--- HTML TITLE / SCRIPT MARKERS ---'
          grep -n -E '<title>|deck_bootstrap_recovery|deck_runtime_guard|deck\.js\?v=|global_ui_20260821' prod-deck.html || true
          echo '--- FIRST 12 LINES ---'
          head -12 prod-deck.html
          echo '--- FILE CHECKS ---'
          curl -fsSL "https://tcg-0bato.web.app/deck_bootstrap_recovery_20261003.js?v=20261003_recovery1&diag=$(date +%s)" -o recovery.js
          curl -fsSL "https://tcg-0bato.web.app/deck_runtime_guard_20261003.js?v=20261003_guard2&diag=$(date +%s)" -o guard.js
          grep -n '20261003_recovery1' recovery.js | head
          grep -n '20261003_guard2' guard.js | head
          grep -q 'deck_bootstrap_recovery_20261003.js?v=20261003_recovery1' prod-deck.html
          grep -q 'deck_runtime_guard_20261003.js?v=20261003_guard2' prod-deck.html
          grep -q 'deck.js?v=20261003_play_stability2' prod-deck.html

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Test deployed mobile deck
        run: |
          cat > prod-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 460, height: 900 },
            userAgent: 'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 Chrome/154 Mobile Safari/537.36'
          });
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          await page.addInitScript(() => {
            try {
              localStorage.setItem('tcgDeckStartSeen', '1');
              localStorage.setItem('tcgDeviceModeOverrideV2', 'mobile');
            } catch {}
          });

          async function waitEntry() {
            await page.waitForFunction(() => {
              const guard = document.documentElement.dataset.deckRuntimeGuardBound === '20261003_guard2';
              const recoveryLoaded = document.documentElement.dataset.deckBootstrapRecovery === '20261003_recovery1';
              if (!guard || !recoveryLoaded || !document.getElementById('btnSafeBack')) return false;
              const normal = document.querySelector('#deckStart [data-home-action="play"]');
              const nr = normal?.getBoundingClientRect();
              const ns = normal ? getComputedStyle(normal) : null;
              const normalVisible = !!normal && nr.width > 30 && nr.height > 25 && ns.visibility !== 'hidden' && ns.display !== 'none' && Number(ns.opacity || 1) > 0;
              const recovery = document.querySelector('#deckRecoveryHome [data-recovery-play]');
              const rr = recovery?.getBoundingClientRect();
              const recoveryVisible = !!recovery && !document.getElementById('deckRecoveryHome')?.hidden && rr.width > 30 && rr.height > 25;
              return normalVisible || recoveryVisible;
            }, null, { timeout: 20000 });
          }

          async function clickEntry() {
            const which = await page.evaluate(() => {
              const normal = document.querySelector('#deckStart [data-home-action="play"]');
              if (normal) {
                const r = normal.getBoundingClientRect();
                const s = getComputedStyle(normal);
                if (r.width > 30 && r.height > 25 && s.visibility !== 'hidden' && s.display !== 'none' && Number(s.opacity || 1) > 0) return 'normal';
              }
              const recovery = document.querySelector('#deckRecoveryHome [data-recovery-play]');
              if (recovery && !document.getElementById('deckRecoveryHome')?.hidden) return 'recovery';
              return '';
            });
            if (which === 'normal') await page.click('#deckStart [data-home-action="play"]');
            else if (which === 'recovery') await page.click('#deckRecoveryHome [data-recovery-play]');
            else throw new Error('No usable PLAY entry');
            console.log('ENTRY=' + which);
          }

          async function waitDrawer(open) {
            await page.waitForFunction((wanted) => {
              const d = document.getElementById('roomDrawer');
              if (!d) return false;
              const actual = d.classList.contains('open') && d.getAttribute('aria-hidden') === 'false';
              return wanted ? actual : !actual;
            }, open, { timeout: 8000 });
          }

          const base = 'https://tcg-0bato.web.app/deck.html?view=mobile&prodsmoke=a08ac8-' + Date.now();
          const response = await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });
          console.log('HTTP=' + response?.status() + ' FINAL_URL=' + page.url());
          try {
            await waitEntry();
          } catch (e) {
            const diag = await page.evaluate(() => ({
              title: document.title,
              href: location.href,
              htmlDataset: { ...document.documentElement.dataset },
              bodyClass: document.body?.className || '',
              scripts: [...document.scripts].map(s => s.src || 'inline').filter(Boolean),
              recovery: !!document.getElementById('deckRecoveryHome'),
              guardBack: !!document.getElementById('btnSafeBack'),
              room: !!document.getElementById('roomDrawer'),
              text: (document.body?.innerText || '').slice(0, 1200)
            }));
            console.log('ENTRY_TIMEOUT_DIAG=' + JSON.stringify(diag));
            await page.screenshot({ path: 'production-deck-smoke.png', fullPage: true });
            throw e;
          }
          await clickEntry();
          await waitDrawer(true);
          await page.click('#btnSafeBack');
          await waitDrawer(false);
          if (!page.url().includes('tcg-0bato.web.app/deck.html')) throw new Error('Safe back escaped production deck');

          for (let i = 0; i < 2; i++) {
            await page.goto(base + '&reload=' + i, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitEntry();
          }

          await page.screenshot({ path: 'production-deck-smoke.png', fullPage: true });
          const critical = errors.filter(x => !/favicon|404|ERR_BLOCKED_BY_CLIENT/i.test(x));
          if (critical.length) console.log('NONFATAL_BROWSER_ERRORS=' + JSON.stringify(critical.slice(0, 20)));
          console.log('PRODUCTION_PLAY_SMOKE_OK');
          await browser.close();
          EOF
          node prod-smoke.mjs

      - name: Upload production screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-play-smoke
          path: production-deck-smoke.png
          if-no-files-found: ignore
          retention-days: 1
