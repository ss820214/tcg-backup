          </div>
          <div id="scoreWrap" class="scoreWrap">
            <div class="scoreRow">

              <div class="scoreSide">
                <div class="scoreSideName">A</div>

              <div class="scoreSide">

            </div>

            <div class="scoreRow" style="margin-top: 6px">

                <div class="scoreSideName">A</div>
                <div id="infilMeterA" class="scoreMeter"></div>
                <div id="infilTextA" class="scoreText">0/3</div>
              </div>

              <div class="scoreSide">
                <div class="scoreSideName">B</div>
                <div id="infilMeterB" class="scoreMeter"></div>
                <div id="infilTextB" class="scoreText">0/3</div>
              </div>
            </div>

            <!-- Hidden legacy spans kept for compatibility. -->
            <span id="kills" style="display: none"></span>
            <span id="infil" style="display: none"></span>
          </div>

          <div id="dice"></div>
          <div
            id="modeHint"
            class="small"
            style="margin-top: 8px; opacity: 0.85"
          ></div>
        </div>

        <div class="paneTitle">謫堺ｽ・/div>
        <div class="controls">
          <button id="modeSummon">蜿ｬ蝟・/button>
          <button id="modeMove">遘ｻ蜍・/button>
          <button id="modeAttack">陦悟虚</button>
          <button id="modeEvolve">騾ｲ蛹・/button>

          <button id="doEvolve" style="display: none">騾ｲ蛹門ｮ溯｡・/button>
          <button id="endTurn">繧ｿ繝ｼ繝ｳ邨ゆｺ・/button>
        </div>

        <!-- Quick actions -->
        <div id="quickActions" class="quickActions" style="display: none">
          <button id="quickMove">遘ｻ蜍・/button>
          <button id="quickAttack">陦悟虚</button>
          <span id="quickMsg" class="small"></span>

        <!-- Pinch + EX UI -->
        <div id="exWrap" class="kv" style="margin-top: 10px">
          <div
            class="row"

          CENTER PANE

          RIGHT PANE

        <div class="paneTitle">謇区惆</div>

        <div class="paneTitle" style="margin-top: 10px">陦悟虚</div>
        <div id="actionPicker" class="small">
          繝ｦ繝九ャ繝医ｒ驕ｸ謚槭☆繧九→陦悟虚縺瑚｡ｨ遉ｺ縺輔ｌ縺ｾ縺吶・        </div>

        <div class="paneTitle" style="margin-top: 10px">隧ｳ邏ｰ</div>

          繝ｦ繝九ャ繝・繧ｫ繝ｼ繝峨・隧ｳ邏ｰ縺後％縺薙↓陦ｨ遉ｺ縺輔ｌ縺ｾ縺吶・        </div>

        <div class="paneTitle" style="margin-top: 10px">繝ｭ繧ｰ</div>
        <pre id="log"></pre>

    <nav id="mobileBattleNav" class="mobileBattleNav" aria-label="繧ｹ繝槭・逕ｨ繝舌ヨ繝ｫ遘ｻ蜍・>
      <button type="button" data-jump-target="centerPane">逶､髱｢</button>
      <button type="button" data-jump-target="leftPane">謫堺ｽ・/button>
      <button type="button" data-jump-target="rightPane">隧ｳ邏ｰ</button>

    <!-- ===== Game code ===== -->
<script type="module" src="./game.js?v=20260919_hand_fan3"></script>

    <style>
      /* Hide old join buttons while keeping existing battle UI intact. */
      #joinGameBtn,
      #btnJoinGame,
      #gameJoinBtn {
        display: none !important;
      }

      /* Also catch legacy class-based join buttons. */
      .join-game-btn {
        display: none !important;
      }
    </style>

    <script type="module">
      import { setBgmEnabled, setBgmMode } from "./sfx.js?v=20260919_ratbeat";

      const BGM_KEY = "tcg_bgm_on";
      const VOLUME = 0.35;
      const RATE = 1.0;

      let bgmOn = (localStorage.getItem(BGM_KEY) ?? "1") === "1";

      function applyBgmState() {
        setBgmEnabled(false);
      }

      function isSoloUrl() {
        const p = new URLSearchParams(location.search);
        return p.get("solo") === "1" || p.get("mode") === "solo";
      }

      function mountBgmToggle() {
        const btn = document.createElement("button");
        btn.id = "bgmToggleBtn";
        btn.type = "button";
        btn.style.marginLeft = "6px";
        btn.textContent = bgmOn ? "BGM ON" : "BGM OFF";

        const solo = isSoloUrl();

        // Console button is only shown in solo mode.
        let cbtn = null;
        if (solo) {
          cbtn = document.createElement("button");
          cbtn.id = "consoleToggleBtn";
          cbtn.type = "button";
          cbtn.style.marginLeft = "6px";
          cbtn.textContent = "繧ｳ繝ｳ繧ｽ繝ｼ繝ｫ";
        }

        const leftPane = document.querySelector("#leftPane");
        const controlsTitle = leftPane?.querySelectorAll(".paneTitle")?.[1];
        if (controlsTitle && controlsTitle.parentElement) {
          const wrap = document.createElement("div");
          wrap.style.display = "flex";
          wrap.style.alignItems = "center";
          wrap.style.justifyContent = "space-between";

          const titleClone = controlsTitle.cloneNode(true);
          controlsTitle.replaceWith(wrap);
          wrap.appendChild(titleClone);

          const right = document.createElement("div");
          right.style.display = "flex";
          right.style.gap = "6px";
          right.appendChild(btn);
          if (cbtn) right.appendChild(cbtn);
          wrap.appendChild(right);
        } else {
          leftPane?.prepend(btn);
          if (cbtn) leftPane?.prepend(cbtn);
        }

        btn.addEventListener("click", async () => {
          bgmOn = !bgmOn;
          localStorage.setItem(BGM_KEY, bgmOn ? "1" : "0");
          btn.textContent = bgmOn ? "BGM ON" : "BGM OFF";

          if (bgmOn) {
            setBgmEnabled(true, { volume: VOLUME, playbackRate: RATE });
            setBgmMode(modeByLevel(_pinchLevel), {
              volume: VOLUME,
              playbackRate: RATE,
            });
          } else {
            setBgmEnabled(false);
          }
        });

        const waitForSoloConsole = async (timeoutMs = 9000) => {
          const started = performance.now();
          while (performance.now() - started < timeoutMs) {
            if (typeof window.toggleSoloConsole === "function") {
              return window.toggleSoloConsole;
            }
            await new Promise((resolve) => setTimeout(resolve, 120));
          }
          return null;
        };

        if (cbtn) {
          cbtn.addEventListener("click", async () => {
            const prevText = cbtn.textContent;
            window.__soloConsoleOpenRequested = true;
            cbtn.disabled = true;
            cbtn.textContent = "隱ｭ霎ｼ荳ｭ...";
            try {
              const toggle = await waitForSoloConsole();
              if (typeof toggle === "function") {
                window.__soloConsoleOpenRequested = false;
                await toggle();
              } else {
                alert("繧ｳ繝ｳ繧ｽ繝ｼ繝ｫ縺ｮ貅門ｙ縺ｫ譎る俣縺後°縺九▲縺ｦ縺・∪縺吶ょｰ代＠蠕・▲縺ｦ繧ゅ≧荳蠎ｦ謚ｼ縺励※縺ｭ縲・);
              }
            } finally {
              cbtn.disabled = false;
              cbtn.textContent = prevText || "繧ｳ繝ｳ繧ｽ繝ｼ繝ｫ";
            }
          });
        }

        return btn;
      }

      function armAutoStartOnce() {
        const startOnce = async () => {
          window.removeEventListener("pointerdown", startOnce);
          if (!bgmOn) return;
          setBgmEnabled(true, { volume: VOLUME, playbackRate: RATE });
          setBgmMode(modeByLevel(_pinchLevel), {
            volume: VOLUME,
            playbackRate: RATE,
          });
        };
        window.addEventListener("pointerdown", startOnce, { once: true });
      }

      // UI setup.
      const btn = mountBgmToggle();

      // Initial state.
      applyBgmState();

      if (bgmOn) armAutoStartOnce();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) setBgmEnabled(false);
      });
      window.addEventListener("beforeunload", () => setBgmEnabled(false));

      // ===== Pinch BGM level controller (called from game.js) =====
      // lv: 0=normal(battle), 1=alert1, 2=alert2
      let _pinchLevel = 0;

      function modeByLevel(lv) {
        if (lv === 2) return "alert2";
        if (lv === 1) return "alert1";
        return "battle";
      }

      window.setPinchBgmLevel = async function (lv) {
        lv = Number(lv) || 0;
        lv = Math.max(0, Math.min(2, lv));
        if (lv === _pinchLevel) return;
        _pinchLevel = lv;

        if (!bgmOn) return;
        setBgmMode(modeByLevel(lv), { volume: VOLUME, playbackRate: RATE });
      };
    </script>

    <script>
      (() => {
        const nav = document.getElementById("mobileBattleNav");
        if (!nav) return;
        const setActive = (id) => {
          nav.querySelectorAll("button").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.jumpTarget === id);
          });
        };
        nav.addEventListener("click", (ev) => {
          const btn = ev.target.closest("button[data-jump-target]");
          if (!btn) return;
          const target = document.getElementById(btn.dataset.jumpTarget);
          if (!target) return;
          setActive(btn.dataset.jumpTarget);
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        setActive("centerPane");
      })();
    </script>
