<!-- public/match_intro.html -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Match Intro</title>
    <style>
      :root {
        --bg1: #070a12;
        --bg2: #101a33;
        --txt: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --a: #6cffb6;
        --b: #ff6c87;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        --r: 22px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        color: var(--txt);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        background:
          radial-gradient(1200px 700px at 20% 15%, rgba(80, 140, 255, 0.18), transparent 55%),
          radial-gradient(900px 700px at 90% 10%, rgba(120, 255, 190, 0.12), transparent 50%),
          linear-gradient(180deg, var(--bg1), var(--bg2));
      }
      canvas.fx {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        pointer-events: none;
      }
      .wrap{
        position:relative; height:100%;
        display:flex; align-items:center; justify-content:center;
        padding:18px;
      }
      .panel{
        width:min(980px, 96vw);
        border-radius: var(--r);
        background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
        box-shadow: var(--shadow);
        border: 1px solid rgba(255,255,255,0.16);
        overflow:hidden;
        position:relative;
        transform: translateY(10px);
        opacity:0;
        animation: pop .42s ease forwards;
      }
      @keyframes pop{ to { transform: translateY(0); opacity:1; } }

      .glow{
        position:absolute; inset:-140px -140px auto -140px;
        height:260px;
        background:
          radial-gradient(circle at 30% 60%, rgba(108,255,182,0.26), transparent 60%),
          radial-gradient(circle at 80% 40%, rgba(74,163,255,0.22), transparent 65%);
        filter: blur(12px);
        opacity:.95;
        pointer-events:none;
      }

      .row{ display:grid; grid-template-columns: 1fr; gap:14px; padding:18px; }

      .top{
        display:flex; align-items:center; justify-content:space-between;
        gap:10px;
        padding:12px 14px;
        border-radius: 16px;
        background: rgba(0,0,0,.22);
        border: 1px solid rgba(255,255,255,.12);
      }
      .top .k{ font-size:12px; color:var(--muted); }
      .top b{ font-size:13px; letter-spacing:.08em; }
      .skip{
        appearance:none; border:none;
        cursor:pointer;
        border-radius: 999px;
        padding:10px 12px;
        font-weight: 900;
        color: rgba(255,255,255,0.92);
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.16);
      }
      .skip:hover{ background: rgba(255,255,255,0.14); }

      .vs{
        display:grid;
        grid-template-columns: 1fr auto 1fr;
        gap:12px;
        align-items:center;
      }
      .pCard{
        border-radius: var(--r);
        background: rgba(0,0,0,.18);
        border: 1px solid rgba(255,255,255,.12);
        padding:14px;
        position:relative;
        overflow:hidden;
        min-height: 128px;
      }
      .pCard::before{
        content:"";
        position:absolute;
        left:0; top:0; bottom:0;
        width:8px;
        opacity:.85;
      }
      .pCard.a::before{ background: linear-gradient(180deg, rgba(108,255,182,.85), rgba(0,0,0,0)); }
      .pCard.b::before{ background: linear-gradient(180deg, rgba(255,108,135,.82), rgba(0,0,0,0)); }

      .seat{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.16);
        background: rgba(0,0,0,.18);
        font-size:12px;
        color: rgba(255,255,255,.88);
        letter-spacing:.10em;
        font-weight:900;
        width: fit-content;
      }
      .name{
        margin-top:10px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing:.02em;
        line-height:1.1;
        word-break: break-word;
      }

      .mini{
        margin-top:10px;
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        align-items:center;
      }
      .pill{
        display:inline-flex;
        align-items:center;
        gap:6px;
        padding:6px 10px;
        border-radius:999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        font-size:12px;
        font-weight:900;
        letter-spacing:.08em;
        color: rgba(255,255,255,.86);
      }

      .youTag{
        margin-top:10px;
        display:inline-flex;
        padding:6px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.14);
        font-size:12px;
        font-weight:900;
        letter-spacing:.12em;
        color: rgba(255,255,255,.86);
        opacity:0;
        transform: translateY(4px);
        transition: .18s ease;
      }
      .youTag.on{ opacity:1; transform: translateY(0); }

      .pCard.win{
      box-shadow: 0 0 0 2px rgba(255,255,255,0.25), var(--shadow);
      border-color: rgba(255,255,255,0.26);
      }
      .vsMid{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:10px 8px;
      }
      .vsText{
        font-size: 54px;
        font-weight: 1000;
        letter-spacing:.12em;
        text-shadow: 0 14px 30px rgba(0,0,0,.55);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse{
        0%,100%{ transform: scale(1); opacity:1; }
        50%{ transform: scale(1.03); opacity:.92; }
      }
      .count{
        font-size: 38px;
        font-weight: 1000;
        letter-spacing:.08em;
        padding: 8px 14px;
        border-radius: 16px;
        background: rgba(0,0,0,.22);
        border: 1px solid rgba(255,255,255,.12);
        min-width: 96px;
        text-align:center;
      }
      .sub{ font-size:12px; color: var(--muted); }

      .bar{
        margin-top:4px;
        height: 10px;
        border-radius: 999px;
        background: rgba(0,0,0,.26);
        border: 1px solid rgba(255,255,255,.10);
        overflow:hidden;
      }
      .bar > i{
        display:block;
        height:100%;
        width:0%;
        background: linear-gradient(90deg, rgba(108,255,182,.65), rgba(74,163,255,.55));
        transition: width .12s linear;
      }

      .foot{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:12px 14px;
        border-radius: 16px;
        background: rgba(0,0,0,.18);
        border: 1px solid rgba(255,255,255,.10);
      }
      .foot .hint{ font-size:12px; color: var(--muted); }
      .badge{
        display:inline-flex; gap:8px; align-items:center;
        font-size:12px;
        color: rgba(255,255,255,.86);
        padding:6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.16);
        background: rgba(255,255,255,.08);
        letter-spacing:.08em;
        font-weight:900;
      }

      @media (max-width: 720px){
      .vs{ grid-template-columns: 1fr; }
      .vsMid{ order: -1; }

      .pCard.a .pill{ border-color: rgba(108,255,182,0.25); }
      .pCard.b .pill{ border-color: rgba(255,108,135,0.25); }
      }
    </style>
  </head>
  <body>
    <canvas id="bgFx" class="fx"></canvas>

    <div class="wrap">
      <div class="panel">
        <div class="glow"></div>

        <div class="row">
          <div class="top">
            <div>
              <div class="k">ROOM</div>
              <b id="roomTxt">----</b>
            </div>
            <button class="skip" id="skipBtn">SKIP</button>
          </div>

          <div class="vs">
            <div class="pCard a">
              <div class="seat" id="seatA">SEAT A</div>
              <div class="name" id="nameA">---</div>

              <div class="mini">
                <span class="pill" id="fieldATxt">FIELD: ---</span>
                <span class="pill">🎲 <span id="diceATxt">--</span></span>
              </div>

              <div class="youTag" id="youA">YOU</div>
            </div>

            <div class="vsMid">
              <div class="vsText">VS</div>
              <div class="count" id="countTxt">3</div>
              <div class="sub" id="subTxt">対戦準備中…</div>
              <div class="sub" id="finalFieldTxt">FIELD: ---</div>
            </div>

            <div class="pCard b">
              <div class="seat" id="seatB">SEAT B</div>
              <div class="name" id="nameB">---</div>

              <div class="mini">
                <span class="pill" id="fieldBTxt">FIELD: ---</span>
                <span class="pill">🎲 <span id="diceBTxt">--</span></span>
              </div>

              <div class="youTag" id="youB">YOU</div>
            </div>
          </div>

          <div class="bar"><i id="barFill"></i></div>

          <div class="foot">
            <div class="hint" id="hintTxt">マッチ情報を確認しています…</div>
            <div class="badge" id="badgeTxt">CONNECT</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./match_intro.js?v=20260209_2"></script>
  </body>
</html>
