name: Deploy 0bato to Firebase Hosting

on:
  push:
    branches:
      - deploy/live
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Firebase config
        run: |
          test -f firebase.json
          test -f .firebaserc
          test -d public
          grep -q '"default": "tcg-0bato"' .firebaserc
          grep -q '"public": "public"' firebase.json

      - name: Verify deck regressions before publishing
        run: |
          node --check public/auth.js
          node --check public/join.js
          node --check public/deck.js
          node --check public/deck_detail_drag.js
          node --check public/deck_library.js
          node --check public/deck_save_unify_20261016.js
          node --check public/deck_mobile_hotfix_20261006_cardlayout5.js
          node --check public/deck_mobile_hotfix_20261006_skills6.js
          node tools/deck_regression_20261008.mjs
          node tools/deck_ui_v5_regression.mjs
          node tools/deck_home_navigation_regression_20261024.mjs
          node tools/room_entry_regression_20261024.mjs

      - name: Verify battle runtime syntax before publishing
        run: |
          node --check public/game.js
          node --check public/game_ui.js
          node --check public/evolve_system.js
          node --check public/support_core.js
          node --check public/game_core.js
          node --check public/action_text.js
          node --check public/sfx.js
          node --check tools/set_firebase_hosting_retention_20261024.mjs

      - name: Limit Firebase Hosting live history to five releases
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TCG_0BATO }}
        run: node tools/set_firebase_hosting_retention_20261024.mjs

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TCG_0BATO }}
          channelId: live
          projectId: tcg-0bato
