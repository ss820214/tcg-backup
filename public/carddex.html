<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>繧ｫ繝ｼ繝牙峙髑・- OBATO</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b10;
      --panel: rgba(17, 24, 31, .86);
      --panel2: rgba(21, 34, 43, .74);
      --line: rgba(159, 210, 255, .18);
      --text: #f5f7fb;
      --muted: rgba(245, 247, 251, .66);
      --blue: #62b8ff;
      --green: #6ef2a4;
      --gold: #ffd967;
      --red: #ff6675;
      --support: #b9c2cc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 14%, rgba(76, 176, 255, .18), transparent 34rem),
        radial-gradient(circle at 86% 18%, rgba(128, 255, 161, .12), transparent 32rem),
        linear-gradient(135deg, #071017, #08070d 62%, #110914);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 35%, black, transparent 75%);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .titleBlock h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 44px);
      letter-spacing: .04em;
    }
    .titleBlock p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .navBtns, .filterLine, .chips {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn, .chipBtn, .selectBox, .search {
      border: 1px solid rgba(255,255,255,.16);
      background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.035));
      color: var(--text);
      border-radius: 999px;
      min-height: 42px;
      padding: 0 16px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: inset 0 1px rgba(255,255,255,.1);
    }
    .btn.primary {
      border-color: rgba(111, 242, 164, .44);
      background: linear-gradient(135deg, rgba(70, 180, 115, .34), rgba(66, 137, 255, .18));
    }
    .chipBtn {
      min-height: 36px;
      padding: 0 14px;
      font-weight: 800;
    }
    .chipBtn.active {
      border-color: rgba(110, 242, 164, .72);
      color: #eaffef;
      box-shadow: 0 0 0 2px rgba(110, 242, 164, .1), 0 0 18px rgba(110, 242, 164, .26);
    }
    .chipBtn.attr-active {
      border-color: rgba(98, 184, 255, .72);
      box-shadow: 0 0 0 2px rgba(98, 184, 255, .11), 0 0 18px rgba(98, 184, 255, .28);
    }
    .statbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--line);
      background: rgba(12, 18, 25, .72);
      border-radius: 16px;
      padding: 12px 14px;
    }
    .stat span { color: var(--muted); font-size: 12px; display: block; }
    .stat b { font-size: 24px; letter-spacing: .04em; }
    .filters {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(33, 52, 64, .78), rgba(9, 13, 18, .82));
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .filterTop {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 210px;
      gap: 12px;
      margin-bottom: 12px;
    }
    .search, .selectBox {
      width: 100%;
      border-radius: 14px;
      justify-content: flex-start;
      background: rgba(4, 8, 12, .66);
    }
    .search { padding: 0 18px; }
    .selectBox { color: var(--text); }
    .selectBox option { background: #101821; }
    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 430px);
      gap: 16px;
      align-items: start;
    }
    .gridPanel, .detailPanel {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(9, 13, 18, .78);
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      overflow: hidden;
    }
    .panelHead {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(24, 37, 47, .72);
    }
    .panelHead h2 { margin: 0; font-size: 17px; }
    .panelHead small { color: var(--muted); }
    .cardGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
      gap: 12px;
      max-height: calc(100vh - 275px);
      min-height: 420px;
      overflow: auto;
      padding: 14px;
      scrollbar-color: rgba(98, 184, 255, .6) rgba(255,255,255,.08);
    }
    .dexCard {
      position: relative;
      min-height: 154px;
      border: 1px solid rgba(255,255,255,.13);
      border-left: 5px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
      color: var(--text);
      padding: 12px 12px 12px 118px;
      text-align: left;
      overflow: hidden;
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    }
    .dexCard:hover, .dexCard.active {
      transform: translateY(-2px);
      border-color: rgba(98,184,255,.62);
      box-shadow: 0 0 0 2px rgba(98,184,255,.12), 0 16px 34px rgba(0,0,0,.28);
    }
    .dexCard.locked { opacity: .56; filter: saturate(.72); }
    .dexCard.support { border-left-color: var(--support); }
    .cardThumb {
      position: absolute;
      left: 12px;
      top: 12px;
      width: 86px;
      height: 120px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
    }
    .cardThumb img, .detailArt img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .fallbackArt {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 52% 42%, var(--attrGlow, rgba(98,184,255,.45)), transparent 46%),
        linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
      font-size: 34px;
      font-weight: 900;
    }
    .dexName {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 7px;
    }
    .dexMeta, .dexSub {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
      padding: 0 9px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
    }
    .pill.owned { border-color: rgba(110,242,164,.36); color: #b8ffd0; }
    .pill.missing { border-color: rgba(255,255,255,.12); color: rgba(245,247,251,.58); }
    .dexText {
      margin-top: 9px;
      color: rgba(245,247,251,.78);
      font-size: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .detailPanel {
      position: sticky;
      top: 14px;
    }
    .detailBody {
      padding: 18px;
    }
    .detailHero {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .detailArt {
      width: 132px;
      height: 184px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 0 32px var(--attrGlow, rgba(98,184,255,.22));
      background: rgba(255,255,255,.06);
    }
    .detailName { margin: 0 0 10px; font-size: 27px; line-height: 1.16; }
    .detailId { color: var(--muted); font-size: 12px; word-break: break-all; margin-bottom: 12px; }
    .bars { margin-top: 14px; display: grid; gap: 9px; }
    .barRow { display: grid; grid-template-columns: 30px 1fr 58px; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .bar { height: 9px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); }
    .sectionTitle { margin: 20px 0 10px; font-weight: 900; color: #dff1ff; }
    .actionList { display: grid; gap: 9px; }
    .actionItem {
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      padding: 12px;
    }
    .actionTop {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .actionText {
      color: rgba(245,247,251,.76);
      font-size: 13px;
      line-height: 1.55;
    }
    .empty {
      min-height: 260px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 26px;
    }
    @media (max-width: 980px) {
      .shell { width: min(100vw - 18px, 760px); padding-top: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .statbar { grid-template-columns: repeat(2, 1fr); }
      .filterTop { grid-template-columns: 1fr; }
      .main { grid-template-columns: 1fr; }
      .detailPanel { position: static; }
      .cardGrid { max-height: none; min-height: 0; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
      .dexCard { padding: 10px; min-height: 138px; }
      .cardThumb { position: static; width: 100%; height: 108px; margin-bottom: 9px; }
      .detailHero { grid-template-columns: 96px 1fr; }
      .detailArt { width: 96px; height: 134px; }
      .detailName { font-size: 21px; }
    }
  </style>
</head>
<body>

  <script type="module" src="./carddex.js?v=20260913_carddex1"></script>

</html>
