<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TCG Online - Deck Builder</title>
  <style>
    :root{
      --bg:#111; --panel:#1b1b1b; --panel2:#222;
      --line:#333; --text:#fff; --muted:#b9b9b9;
      --acc:#5aaaff; --ok:#78ffaa; --bad:#ff7878;
    }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, Segoe UI, sans-serif; }
    header{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      padding:12px 14px; border-bottom:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,0));
    }
    header .left{ display:flex; gap:10px; align-items:center; }
    header h1{ margin:0; font-size:16px; letter-spacing:.02em; }
    header .meta{ font-size:12px; color:var(--muted); }

    .wrap{
      display:grid;
      grid-template-columns: 1.35fr 0.85fr; /* 右ペインを“ちゃんと広く” */
      gap:14px;
      padding:14px;
      min-height: calc(100vh - 56px);
      box-sizing:border-box;
    }

    .panel{
      background: rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .panel .hd{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.20);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .panel .hd b{ font-size:13px; }
    .panel .bd{ padding:12px; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .pill{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      background: rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.10);
      font-size:12px; color:var(--muted);
    }

    /* 左：カード一覧 + デッキ */
    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    .list{
      display:flex; flex-direction:column; gap:8px;
      max-height: calc(100vh - 160px);
      overflow:auto;
      padding-right:4px;
    }
    .cardRow{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      border-radius:12px;
      padding:10px 10px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      cursor:pointer;
    }
    .cardRow:hover{ border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.05); }
    .cardRow .name{ font-weight:900; font-size:13px; }
    .cardRow .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
    .cardRow .btns{ display:flex; gap:6px; align-items:center; }
    .miniBtn{
      border-radius:10px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.22);
      color:#fff;
      padding:6px 10px;
      font-weight:900;
      cursor:pointer;
      font-size:12px;
    }
    .miniBtn:hover{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.26); }
    .miniBtn:disabled{ opacity:.45; cursor:not-allowed; }

    .count{
      min-width:34px;
      text-align:center;
      font-weight:900;
      border:1px solid rgba(255,255,255,.14);
      border-radius:10px;
      padding:6px 8px;
      background: rgba(0,0,0,.18);
    }

    /* 右：操作タブ + 詳細（広い！） */
    .tabs{
      display:flex; gap:8px;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.18);
    }
    .tab{
      border-radius:999px;
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      color:#fff;
      cursor:pointer;
      font-weight:900;
      font-size:12px;
      user-select:none;
    }
    .tab.active{
      border-color: rgba(90,170,255,.55);
      background: rgba(90,170,255,.18);
    }

    .tabBody{ padding:12px; }
    .tabBody[hidden]{ display:none; }

    .input{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color:#fff;
      padding:10px 10px;
      box-sizing:border-box;
      font-size:14px;
      outline:none;
    }
    .input:focus{ border-color: rgba(90,170,255,.55); }
    .btn{
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(90,170,255,.16);
      color:#fff;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
    }
    .btn:hover{ background: rgba(90,170,255,.22); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; background: rgba(0,0,0,.16); }

    .btnGhost{
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      color:#fff;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
    }
    .btnGhost:hover{ background: rgba(255,255,255,.06); }

    .msg{ font-size:12px; color:var(--muted); white-space:pre-wrap; line-height:1.35; }
    .msg.bad{ color: var(--bad); }
    .msg.ok{ color: var(--ok); }

    /* 詳細を“右下の狭い枠”から解放：右ペイン下を大きく使う */
    #detail{
      min-height: 260px;
      max-height: calc(100vh - 340px);
      overflow:auto;
      padding:12px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.14);
      white-space: pre-wrap;
      line-height:1.35;
      font-size:13px;
    }
    .small{ font-size:12px; color:var(--muted); }

    @media (max-width: 980px){
      .wrap{ grid-template-columns: 1fr; }
      .grid2{ grid-template-columns: 1fr; }
      #detail{ max-height: unset; }
    }
  </style>
</head>

<body>
  <header>
    <div class="left">
      <h1>Deck Builder</h1>
      <div class="meta">30枚 / 同名4枚まで</div>
    </div>

    <div class="row" style="gap:8px; justify-content:flex-end;">
      <button id="btnArcade" type="button">アーケード</button>
      <button id="btnSolo" type="button">ソロで開始</button>
      <span id="versionLabel" class="badge">v20260207</span>
      <button id="btnSettings" type="button">設定</button>
    </div>
  </header>

  <div style="padding:10px 14px;">
    <span class="pill">v20260207 deck-ui</span>
  </div>

  <div class="wrap">
    <!-- LEFT -->
    <div class="panel">
      <div class="hd">
        <b>カード / デッキ</b>
        <div class="pill">デッキ枚数：<span id="deckCount">0</span>/30</div>
      </div>

      <div class="bd grid2">
        <!-- Card list -->
        <div>
          <div class="row" style="justify-content:space-between; margin-bottom:8px;">
            <b style="font-size:13px;">カード一覧</b>
            <span class="small">クリックで詳細</span>
          </div>
          <div id="cardList" class="list"></div>
        </div>

        <!-- Deck list -->
        <div>
          <div class="row" style="justify-content:space-between; margin-bottom:8px;">
            <b style="font-size:13px;">デッキ</b>
            <button id="btnClearDeck" class="btnGhost" type="button">全消し</button>
          </div>
          <div id="deckList" class="list"></div>
          <div id="deckMsg" class="msg bad" style="margin-top:8px;"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="panel">
      <!-- name input -->
      <div class="hd">
        <b>プレイヤー設定</b>
        <span class="small">部屋作成/参加時に保存</span>
      </div>
      <div class="bd">
        <div class="row" style="margin-bottom:10px;">
          <input id="playerName" class="input" maxlength="16" placeholder="プレイヤーネーム（例：Terada）" />
          <button id="btnSaveName" class="btn" type="button">保存</button>
        </div>
        <div id="nameMsg" class="msg"></div>
      </div>

      <!-- tabs -->
      <div class="tabs">
        <div class="tab active" data-tab="create">ルーム作成</div>
        <div class="tab" data-tab="join">ルーム参加</div>
      </div>

      <div class="tabBody" id="tab-create">
        <div class="row" style="margin-bottom:8px;">
          <button id="createBtn" class="btn" type="button" disabled>ルーム作成</button>
          <span class="small">デッキ30枚で有効</span>
        </div>
        <div id="createMsg" class="msg"></div>
      </div>

      <div class="tabBody" id="tab-join" hidden>
        <div class="row" style="margin-bottom:8px;">
          <input id="joinRoomId" class="input" placeholder="roomId を入力" />
        </div>
        <div class="row">
          <button id="joinBtn" class="btn" type="button" disabled>ルーム参加</button>
        </div>
        <div id="joinMsg" class="msg"></div>
      </div>

      <!-- 詳細パネル：左下固定 -->
<div id="detailWrap" class="detailWrap" style="display:none;" aria-hidden="true">
  <div class="detailHead">
    <b>詳細</b>
    <button id="detailClose" class="detailClose" type="button" title="詳細を閉じる">✕</button>
  </div>
  <div id="detail" class="detailBody">カード詳細がここに表示されます。</div>
</div>

  <script type="module" src="./deck.js?v=20260214_2"></script>
</body>
</html>
