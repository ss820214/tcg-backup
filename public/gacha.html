<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>OBATO - &#12460;&#12481;&#12515;</title>
  <style>
    :root{
      --bg:#0b0d12;
      --panel:rgba(255,255,255,.06);
      --panel2:rgba(255,255,255,.09);
      --line:rgba(255,255,255,.10);
      --txt:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --accent:#7dd3fc;
      --gold:#ffd166;
      --pink:#ff4d8d;
      --vio:#a78bfa;
      --good:#7CFFB2;
      --bad:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", Arial;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(167,139,250,.16), transparent 55%),
        radial-gradient(1200px 800px at 80% 0%, rgba(125,211,252,.12), transparent 50%),
        radial-gradient(900px 700px at 50% 90%, rgba(255,77,141,.10), transparent 60%),
        linear-gradient(180deg, #07080c, #0b0d12 55%, #07080c);
      color:var(--txt);
      min-height:100vh;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
    }
    a{color:inherit}
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
    }
    header{
      display:flex; gap:12px;
      align-items:center; justify-content:space-between;
      margin-bottom:16px;
    }
    .brand{
      display:flex; gap:12px; align-items:center;
    }
    .logo{
      width:44px;height:44px;border-radius:14px;
      background:
        radial-gradient(14px 14px at 30% 30%, rgba(255,255,255,.55), transparent 60%),
        linear-gradient(135deg, rgba(167,139,250,.75), rgba(125,211,252,.75));
      box-shadow: 0 14px 50px rgba(0,0,0,.35);
    }
    h1{
      font-size:18px; margin:0;
      letter-spacing:.06em;
    }
    .sub{
      font-size:12px; color:var(--muted); margin-top:2px;
    }

    .topbar{
      display:flex; gap:10px; align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding:10px 12px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:999px;
      backdrop-filter: blur(10px);
    }
    .pill b{font-size:13px}
    .pill .small{font-size:12px;color:var(--muted)}
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.15);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      color:var(--txt);
      border-radius:14px;
      padding:11px 14px;
      cursor:pointer;
      font-weight:800;
      letter-spacing:.03em;
      transition: transform .08s ease, filter .15s ease;
      user-select:none;
      min-height:44px;
      touch-action:manipulation;
    }
    .btn:hover{filter:brightness(1.12)}
    .btn:active{transform:translateY(1px) scale(.99)}
    .btnPrimary{
      border-color: rgba(125,211,252,.35);
      background:linear-gradient(180deg, rgba(125,211,252,.18), rgba(125,211,252,.06));
    }
    .btn.active{
      border-color: rgba(120,255,185,.58);
      background:
        linear-gradient(180deg, rgba(120,255,185,.22), rgba(120,255,185,.07)),
        rgba(255,255,255,.05);
      box-shadow:0 0 0 2px rgba(120,255,185,.08), 0 0 22px rgba(120,255,185,.10);
    }
    .btnGold{
      border-color: rgba(255,209,102,.45);
      background:linear-gradient(180deg, rgba(255,209,102,.20), rgba(255,209,102,.06));
    }
    .btnDanger{
      border-color: rgba(255,107,107,.40);
      background:linear-gradient(180deg, rgba(255,107,107,.14), rgba(255,107,107,.04));
    }
    .btn:disabled{
      cursor:not-allowed;
      opacity:.45;
      filter:saturate(.7);
    }

    .grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:16px;
    }
    @media(max-width:980px){
      .grid{grid-template-columns:1fr}
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      padding:16px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
    }
    .panel > *{position:relative; z-index:1}
    .panel::before{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(600px 240px at 30% 0%, rgba(255,255,255,.10), transparent 60%);
      pointer-events:none;
    }
    .panel h2{
      margin:0 0 6px;
      font-size:14px;
      letter-spacing:.08em;
      color:rgba(255,255,255,.82);
    }
    .note{
      font-size:12px; color:var(--muted);
      line-height:1.6;
      margin-bottom:12px;
      white-space:pre-line;
    }

    .themeDeck{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
      gap:10px;
      margin:12px 0 14px;
    }
    .themeCard{
      appearance:none;
      isolation:isolate;
      min-height:116px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      padding:14px;
      color:var(--txt);
      cursor:pointer;
      text-align:left;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(180px 120px at 15% 0%, rgba(255,209,102,.14), transparent 58%),
        radial-gradient(220px 150px at 100% 0%, rgba(125,211,252,.13), transparent 60%),
        linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
      box-shadow:0 14px 34px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.035);
      transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease, filter .16s ease;
      touch-action:manipulation;
    }
    .themeCard::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        linear-gradient(120deg, transparent 0 32%, rgba(255,255,255,.20) 45%, transparent 58% 100%),
        radial-gradient(180px 120px at 70% 18%, rgba(255,255,255,.14), transparent 62%);
      transform:translateX(-120%);
      opacity:0;
      pointer-events:none;
    }
    .themeCard::before{
      content:"";
      position:absolute;
      inset:auto -25% -45% -25%;
      height:78px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transform:rotate(-6deg);
      opacity:.45;
      pointer-events:none;
    }
    .themeCard.theme-mix{
      background:
        radial-gradient(220px 150px at 18% 8%, rgba(255,209,102,.18), transparent 60%),
        radial-gradient(220px 150px at 86% 12%, rgba(167,139,250,.18), transparent 62%),
        linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    }
    .themeCard.theme-tokiori{
      background:
        radial-gradient(220px 150px at 18% 8%, rgba(125,211,252,.18), transparent 60%),
        radial-gradient(220px 150px at 86% 12%, rgba(240,171,252,.16), transparent 62%),
        linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    }
    .themeCard.theme-fairy{
      background:
        radial-gradient(220px 150px at 18% 8%, rgba(124,255,178,.18), transparent 60%),
        radial-gradient(220px 150px at 86% 12%, rgba(255,209,102,.16), transparent 62%),
        linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    }
    .themeCard.theme-jewel{
      background:
        radial-gradient(180px 130px at 18% 4%, rgba(125,211,252,.26), transparent 60%),
        radial-gradient(210px 150px at 84% 10%, rgba(255,229,138,.24), transparent 62%),
        radial-gradient(180px 130px at 55% 110%, rgba(184,137,255,.18), transparent 60%),
        linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.025));
    }
    .themeCard.theme-jewel.active{
      border-color:rgba(125,211,252,.82);
      box-shadow:
        0 0 0 1px rgba(125,211,252,.22),
        0 20px 48px rgba(125,211,252,.16),
        0 0 32px rgba(255,229,138,.13),
        inset 0 0 32px rgba(255,255,255,.055);
    }
    .themeCard:hover{
      transform:translateY(-2px);
      border-color:rgba(125,211,252,.45);
      filter:brightness(1.08);
    }
    .themeCard.active{
      border-color:rgba(255,209,102,.76);
      box-shadow:
        0 0 0 1px rgba(255,209,102,.18),
        0 20px 48px rgba(255,209,102,.16),
        0 18px 42px rgba(0,0,0,.34),
        inset 0 0 26px rgba(255,209,102,.08);
    }
    .themeCard:hover::after,
    .themeCard.active::after{
      animation:gachaPackSheen 2.4s ease-in-out infinite;
      opacity:.85;
    }
    .themeKicker{
      display:block;
      font-size:10px;
      letter-spacing:.12em;
      color:rgba(255,255,255,.58);
      margin-bottom:10px;
    }
    .themeName{
      display:block;
      font-size:22px;
      font-weight:950;
      letter-spacing:.03em;
      text-shadow:0 8px 22px rgba(0,0,0,.5);
      overflow-wrap:anywhere;
    }
    .themeMeta{
      display:block;
      margin-top:9px;
      font-size:11px;
      color:rgba(255,255,255,.72);
      line-height:1.45;
    }
    .themeAttrRail{
      display:flex;
      gap:5px;
      flex-wrap:wrap;
      margin-top:10px;
      padding-right:44px;
    }
    .themeAttrChip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:28px;
      height:24px;
      padding:0 8px;
      border-radius:999px;
      border:1px solid color-mix(in srgb, var(--attr-c), white 14%);
      background:
        radial-gradient(circle at 30% 22%, color-mix(in srgb, var(--attr-c), white 32%), transparent 38%),
        color-mix(in srgb, var(--attr-c), transparent 78%);
      color:#fff;
      font-size:11px;
      font-weight:900;
      box-shadow:0 0 16px color-mix(in srgb, var(--attr-c), transparent 72%);
      text-shadow:0 1px 8px rgba(0,0,0,.45);
    }
    .themeCount{
      position:absolute;
      right:12px;
      top:12px;
      min-width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.24);
      font-weight:900;
    }
    @keyframes gachaPackSheen{
      0%{transform:translateX(-125%); opacity:0}
      22%,70%{opacity:.78}
      100%{transform:translateX(125%); opacity:0}
    }

    .banner{
      display:flex; align-items:stretch; gap:12px;
    }
    .bannerArt{
      flex:1;
      min-height:190px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(600px 260px at 20% 20%, rgba(167,139,250,.20), transparent 60%),
        radial-gradient(600px 260px at 80% 0%, rgba(125,211,252,.18), transparent 60%),
        radial-gradient(600px 260px at 40% 90%, rgba(255,77,141,.14), transparent 60%),
        linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      position:relative;
      overflow:hidden;
      box-shadow:inset 0 0 40px rgba(255,255,255,.04), 0 18px 54px rgba(0,0,0,.30);
    }
    .bannerArt::before{
      content:"";
      position:absolute;
      inset:-40%;
      background:
        linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,.12) 48%, transparent 54% 100%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 12px);
      transform:rotate(-8deg);
      opacity:.55;
      pointer-events:none;
    }
    .bannerArt .title{
      position:absolute; left:14px; top:14px;
      font-weight:900; letter-spacing:.08em;
      text-shadow: 0 6px 20px rgba(0,0,0,.55);
    }
    .bannerArt .title .big{font-size:22px}
    .bannerArt .title .small{font-size:12px;color:rgba(255,255,255,.72)}
    .bannerArt .stamp{
      position:absolute; right:14px; top:14px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      font-weight:900;
      letter-spacing:.08em;
      box-shadow:0 0 28px rgba(255,209,102,.12);
    }
    .rates{
      display:flex; gap:8px; flex-wrap:wrap;
      margin-top:10px;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
    }
    .rate{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      font-size:12px;
    }
    .rate b{margin-left:6px}
    .rate.ur{border-color: rgba(255,68,68,.45); color:#ff8b8b}
    .rate.ssr{border-color: rgba(255,209,102,.30)}
    .rate.sr{border-color: rgba(124,255,178,.35); color:var(--good)}
    .rate.r{border-color: rgba(125,211,252,.28)}

    .actions{
      width:320px;
      min-width:300px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    @media(max-width:980px){
      .actions{width:100%; min-width:unset}
    }

    .row{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .row .btn{flex:1}
    .mini{
      padding:10px 12px;
      border-radius:16px;
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      font-size:12px;
      color:rgba(255,255,255,.78);
      line-height:1.55;
      white-space:pre-line;
    }

    /* results */
    .resultHead{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }
    .resultHead .left{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .tag{
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      font-size:12px;
    }
    .tag.good{border-color: rgba(124,255,178,.28)}
    .tag.bad{border-color: rgba(255,107,107,.25)}
    .tag.gold{border-color: rgba(255,209,102,.35)}
    .tag.vio{border-color: rgba(167,139,250,.35)}
    .tag.cyan{border-color: rgba(125,211,252,.35)}

    .cards{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
    }
    @media(max-width:980px){ .cards{grid-template-columns: repeat(4, 1fr);} }
    @media(max-width:640px){ .cards{grid-template-columns: repeat(3, 1fr);} }

    .card{
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(180px 110px at 30% 20%, rgba(255,255,255,.09), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      padding:10px;
      position:relative;
      overflow:hidden;
      min-height:110px;
      transform: translateZ(0);
    }
    .card .name,
    .card .id{overflow-wrap:anywhere}
    .card .rar{
      position:absolute; right:10px; top:10px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      padding:6px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(6px);
    }
    .card .name{
      font-weight:900;
      font-size:13px;
      letter-spacing:.03em;
      line-height:1.25;
      margin-top:26px;
      margin-bottom:6px;
    }
    .card .id{
      font-size:11px; color:var(--muted);
    }
    .card .new{
      position:absolute; left:10px; top:10px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      padding:6px 8px;
      border-radius:999px;
      border:1px solid rgba(124,255,178,.35);
      background: rgba(124,255,178,.10);
    }
    .card.ssr{
      border-color: rgba(255,209,102,.40);
      box-shadow: 0 0 0 1px rgba(255,209,102,.12), 0 18px 60px rgba(255,209,102,.08);
    }
    .card.sr{
      border-color: rgba(124,255,178,.46);
      box-shadow: 0 0 0 1px rgba(124,255,178,.12), 0 18px 60px rgba(124,255,178,.08);
    }
    .card.r{
      border-color: rgba(125,211,252,.28);
    }
    .card.ur{
      border-color: rgba(255,68,68,.70);
      box-shadow:0 0 0 1px rgba(255,68,68,.22), 0 18px 68px rgba(255,68,68,.18);
    }

    /* overlay (darken + jackpot) */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.0);
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      opacity:0;
      transition: opacity .24s ease, background .24s ease;
    }
    .overlay.on{
      opacity:1;
      pointer-events:auto;
      background: rgba(0,0,0,.78);
    }
    .overlay.miracle{
      animation:gachaFreeze 900ms steps(2,end) 1;
    }
    .overlay.miracle::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.95), rgba(255,209,102,.55) 18%, transparent 42%),
        linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      opacity:0;
      pointer-events:none;
      animation:gachaPuchun 1200ms ease-out forwards;
    }
    @keyframes gachaFreeze{
      0%,45%{filter:brightness(.03) contrast(2.5)}
      46%,100%{filter:brightness(1)}
    }
    @keyframes gachaPuchun{
      0%,42%{opacity:0}
      48%{opacity:1}
      100%{opacity:0}
    }
    .reveal{
      width:min(720px, 92vw);
      border-radius:24px;
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(700px 260px at 50% 0%, rgba(255,255,255,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      box-shadow: 0 24px 90px rgba(0,0,0,.55);
      padding:18px 16px 16px;
      position:relative;
      overflow:hidden;
    }
    .reveal .headline{
      text-align:center;
      font-weight:1000;
      letter-spacing:.12em;
      margin:6px 0 12px;
      font-size:22px;
      text-shadow: 0 10px 35px rgba(0,0,0,.55);
    }
    .reveal .headline.ssr{ color: var(--gold); }
    .reveal .headline.sr{ color: var(--good); }
    .reveal .headline.r{ color: var(--accent); }
    .reveal .headline.ur{ color:#ff6b6b; }

    .spot{
      position:absolute; inset:-40%;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,209,102,.18), transparent 60%),
        radial-gradient(closest-side at 50% 50%, rgba(167,139,250,.14), transparent 62%),
        radial-gradient(closest-side at 50% 50%, rgba(125,211,252,.10), transparent 64%);
      filter: blur(2px);
      transform: rotate(12deg);
      animation: spin 3.8s linear infinite;
      opacity:.0;
    }
    .overlay.on .spot{opacity:1}
    @keyframes spin{
      from{ transform: rotate(0deg) scale(1.05);}
      to{ transform: rotate(360deg) scale(1.05);}
    }

    .confetti{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
    }
    .confetti i{
      position:absolute;
      top:-14px;
      width:8px;
      height:14px;
      border-radius:3px;
      opacity:.95;
      animation: confettiFall 1100ms ease-out forwards;
    }
    @keyframes confettiFall{
      0%{ transform: translate3d(0,-20px,0) rotate(0deg); opacity:0; }
      12%{ opacity:1; }
      100%{ transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot)); opacity:0; }
    }

    .reveal .bigmsg{
      text-align:center;
      font-size:42px;
      font-weight:1000;
      letter-spacing:.10em;
      margin:6px 0 8px;
      line-height:1;
      text-shadow: 0 18px 60px rgba(0,0,0,.60);
    }
    .reveal .bigmsg.ssr{ color: var(--gold); }
    .reveal .bigmsg.sr{ color: var(--good); }
    .reveal .bigmsg.r{ color: var(--accent); }
    .reveal .bigmsg.ur{ color:#ff6b6b; }

    .reveal .submsg{
      text-align:center;
      font-size:12px;
      color:rgba(255,255,255,.75);
      white-space:pre-line;
      margin-bottom:12px;
      position:relative;
      z-index:2;
    }
    .reveal .rewards{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
      position:relative;
      z-index:2;
    }
    @media(max-width:680px){ .reveal .rewards{grid-template-columns: repeat(3, 1fr);} }
    .gachaSpinBoard{
      min-height:260px;
      display:grid;
      place-items:center;
      position:relative;
      isolation:isolate;
      overflow:hidden;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(360px 220px at 50% 40%, rgba(255,255,255,.10), transparent 64%),
        radial-gradient(360px 220px at 50% 45%, rgba(125,211,252,.14), transparent 72%),
        linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
      box-shadow:inset 0 0 42px rgba(255,255,255,.035);
    }
    .gachaSpinBoard::before,
    .gachaSpinBoard::after{
      content:"";
      position:absolute;
      inset:-45%;
      pointer-events:none;
      z-index:-1;
    }
    .gachaSpinBoard::before{
      background:
        conic-gradient(from 0deg, transparent, rgba(125,211,252,.20), transparent, rgba(255,209,102,.18), transparent),
