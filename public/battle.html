<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0バト｜対戦待機</title>
<link rel="stylesheet" href="./battle.css?v=20260914_radar_readable1">
<link rel="stylesheet" href="./global_ui_20260821.css?v=20260926_device_switch4">
<link rel="stylesheet" href="./battle_lobby_fix_20261015.css?v=20261015_lobby1">
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="room"><div class="roomLabel">ROOM</div><div class="roomId" id="roomId">----</div></div>
  <div class="topStatus"><div class="statusTitle">対戦待機</div><div class="statusText" id="status">読み込み中…</div><div class="statusSub muted" id="readyNote"></div></div>
  <div class="topActions"><button id="readyBtn" class="btnPrimary" disabled>準備完了</button><div class="hint muted">両者がREADYになると開始</div></div>
</header>
<section id="fieldPick" class="fieldPick">
  <div class="fieldPickHead"><div class="fieldPickTitle"><span class="fieldPickIcon">✦</span> フィールド選択</div><div class="fieldPickSub">希望フィールドを選んでください</div></div>
  <div class="fieldPickBtns">
    <button type="button" data-field="grass" class="fieldGrass"><span class="fieldArt" aria-hidden="true"><span></span></span><span class="fieldText"><span class="fieldEmoji">🌿</span><span class="fieldName">草原</span><span class="fieldCode">balance field</span><span class="fieldCopy">基本的で戦いやすいフィールド</span></span></button>
    <button type="button" data-field="danger" class="fieldDanger"><span class="fieldArt" aria-hidden="true"><span></span></span><span class="fieldText"><span class="fieldEmoji">⚡</span><span class="fieldName">危険地帯</span><span class="fieldCode">high risk zone</span><span class="fieldCopy">危険が待ち受ける戦場</span></span></button>
    <button type="button" data-field="swamp" class="fieldSwamp"><span class="fieldArt" aria-hidden="true"><span></span></span><span class="fieldText"><span class="fieldEmoji">💧</span><span class="fieldName">沼地</span><span class="fieldCode">slow field</span><span class="fieldCopy">足元に気をつけて進むフィールド</span></span></button>
  </div><div id="fieldPickNote" class="fieldPickNote"></div>
</section>
<section class="vsBanner panel">
<div class="sideCard" id="p1Card"><div class="seatLabel">1P</div><div class="playerName" id="p1Name">---</div><div class="readyBadge" id="p1Ready"></div><div class="youTag" id="p1You"></div></div>
<div class="vsCenter"><div class="vsText">VS</div><div class="muted small">準備がそろうまで待機</div></div>
<div class="sideCard right" id="p2Card"><div class="seatLabel">2P</div><div class="playerName" id="p2Name">---</div><div class="readyBadge" id="p2Ready"></div><div class="youTag" id="p2You"></div></div>
</section>
<main class="mainGrid">
<section class="panel deckPanel"><div class="panelHeader"><div class="panelTitle">デッキ確認</div><div class="panelSub muted">カードを押すと詳細を表示</div></div><div class="deckWrap"><div class="deckLeft"><div class="subTitle">採用カード一覧</div><div id="myDeck" class="deckList"></div></div><div class="deckDetail panelInner"><div class="subTitle">カード詳細</div><div id="deckDetail" class="deckDetailBody muted">カードを選択してください</div></div></div><details class="compatBox"><summary>参加プレイヤー一覧</summary><ul id="players" class="playersList"></ul></details></section>
<section class="panel evalPanel"><div class="panelHeader"><div class="panelTitle">デッキ評価</div><div class="panelSub muted">レーダー・属性分布</div></div><div class="radarWrap"><canvas id="battleDeckRadar" width="360" height="260"></canvas><div id="battleDeckRadarText" class="muted small"></div></div><div class="attrWrap"><div class="subTitle">属性の分布</div><div id="attrDist" class="attrDist"><div class="muted">デッキ読み込み後に表示</div></div></div></section>
</main>
<label class="aiSwitch"><input id="aiToggle" type="checkbox"><span>AI対戦（CPU）</span></label>
<section class="panel pongPanel"><div class="panelHeader"><div><div class="panelTitle">ピンポン・ボーナス</div><div class="panelSub muted">待機中のミニゲーム</div></div><div class="pongRewardPill" id="pongRewardPill">20 COMBO = +10 Gems</div></div><div class="pongRow"><div class="pong"><div class="wall wallL"></div><div class="wall wallR"></div><div class="pongLane"></div><div class="pongJudgeLine"></div><div class="paddle"></div><div class="ball" id="ball"></div></div><div class="pongControls"><div class="pongStats"><div><span>SCORE</span><b id="pongScore">0</b></div><div><span>COMBO</span><b id="pongCombo">0</b></div><div><span>GEMS</span><b id="pongReward">+0</b></div></div><button id="pingBtn" class="btnGhost">打ち返す</button><button id="pingResetBtn" class="btnGhost">リセット</button><div id="pingStatus" class="muted">スタート！</div></div></div></section>
</div>
<script type="module" src="./battle.js?v=20260914_radar_readable1"></script>
<script src="./ui_polish.js?v=20260801_screen_nav_mobile1"></script>
<script src="./dopagaki_mode.js?v=20260728_tech1"></script>
<script src="./global_ui_20260821.js?v=20260926_device_switch4" defer></script>
</body></html>
