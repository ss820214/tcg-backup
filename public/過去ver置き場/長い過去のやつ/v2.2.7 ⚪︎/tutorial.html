<!-- public/tutorial.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TCG チュートリアル</title>
  <style>
    body{ font-family:sans-serif; background:#111; color:#fff; margin:0; }
    header{ padding:12px 14px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; }
    .wrap{ padding:14px; max-width:980px; margin:0 auto; }
    .card{ border:1px solid #333; background:#0b0b0b; border-radius:10px; padding:12px; margin:12px 0; }
    .small{ opacity:.85; font-size:13px; }
    button{ padding:8px 12px; cursor:pointer; }
    .nav{ display:flex; gap:10px; justify-content:flex-end; margin-top:10px; }
    .pill{ display:inline-block; padding:2px 8px; border:1px solid #444; border-radius:999px; font-size:12px; opacity:.9; }
    code{ background:#222; padding:1px 4px; border-radius:4px; }
    ul{ margin:6px 0 6px 18px; }
    ol{ margin:6px 0 6px 18px; }
  </style>
</head>
<body>
  <header>
    <div>
      <b>📘 TCG チュートリアル</b>
      <div class="small">最短で遊べるように、必要なことだけ順番に説明するよ</div>
    </div>
    <button id="backBtn">← デッキ構築に戻る</button>
  </header>

  <div class="wrap">
    <div class="pill">Step <span id="stepNum">1</span> / <span id="stepMax">9</span></div>

    <div id="stepBox" class="card"></div>

    <div class="nav">
      <button id="prevBtn">← 前へ</button>
      <button id="nextBtn">次へ →</button>
    </div>

    <div class="small" style="margin-top:10px;">
      ※ このチュートリアルは <code>tutorial.js</code> で自由に編集OK
    </div>
  </div>

  <script type="module" src="./tutorial.js?v=20260127c"></script>
</body>
</html>
