name: Deploy 0bato to Firebase Hosting

on:
  push:
    branches:
      - deploy/live
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Firebase config
        run: |
          test -f firebase.json
          test -f .firebaserc
          test -d public
          grep -q '"default": "tcg-0bato"' .firebaserc
          grep -q '"public": "public"' firebase.json

      - name: Verify deck regressions before publishing
        run: |
          node --check public/auth.js
          node --check public/deck.js
          node --check public/deck_detail_drag.js
          node --check public/deck_library.js
          node --check public/deck_save_unify_20261016.js
          node --check public/deck_mobile_hotfix_20261006_cardlayout5.js
          node --check public/deck_mobile_hotfix_20261006_skills6.js
          node tools/deck_regression_20261008.mjs

      - name: Verify battle runtime syntax before publishing
        run: |
          node --check public/game.js
          node --check public/game_ui.js
          node --check public/evolve_system.js
          node --check public/support_core.js
          node --check public/game_core.js
          node --check public/action_text.js
          node --check public/sfx.js

      - name: Verify CPU and gameplay regressions before publishing
        run: |
          node --check public/cpu_ai.js
          node --check public/cpu_driver.js
          node --check public/cpu_tactics.js
          node --check public/battle.js
          node --check public/support_spatial_rules.js
          node --check public/opponent_hand_ui.js
          node --check public/battle_readability.js
          node --check public/battle_result_details.js
          node tools/cpu_regression_20261019.mjs
          node tools/cpu_styles_regression_20261019.mjs
          node tools/cpu_advanced_regression_20261019.mjs
          node tools/cpu_evolve_integration_regression_20261019.mjs
          node tools/cpu_deck_bootstrap_regression_20261020.mjs
          node tools/cpu_deck_recovery_regression_20261020.mjs
          node tools/cpu_bootstrap_integration_20261020.mjs
          node tools/opponent_hand_regression_20261020.mjs
          node tools/support_spatial_regression_20261019.mjs
          node tools/battle_readability_regression_20261020.mjs

      - name: Verify health, damage, and deck layout contracts
        run: |
          node --check public/mobile_home_deck_ui_20260926.js
          node --check public/mobile_deck_block_final_20260927.js
          node --check public/deck_layout_guard.js
          node tools/stability_contracts_20261023.mjs
          node tools/editor_navigation_5checks_20261024.mjs

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TCG_0BATO }}
          channelId: live
          projectId: tcg-0bato
