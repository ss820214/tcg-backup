name: One-shot community deck load save fix

on:
  push:
    branches:
      - fix/community-deck-load-save-20261005
    paths:
      - '.github/workflows/one-shot-community-deck-load-save-fix-20261005.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/community-deck-load-save-20261005

      - name: Patch community deck import and save flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if new in text:
                  print(f'{label}: already patched')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: target not found')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
              print(f'{label}: patched')

          # 1) Public/community load must become a fresh personal draft.
          replace_once(
              'public/deck_list.js',
              'const PENDING_CLOUD_DECK_KEY = "tcg_pending_cloud_deck_v20260822";\n',
              'const PENDING_CLOUD_DECK_KEY = "tcg_pending_cloud_deck_v20260822";\nconst COMMUNITY_IMPORT_KEY = "tcg_community_deck_import_v20261005";\nconst DECKLIB_LAST_OPENED_KEY = "tcg_decklib_last_opened_id_v1";\n',
              'deck_list constants',
          )

          replace_once(
              'public/deck_list.js',
              '''      setLS(EX_KEY, payload.exSupport);\n      if (payload.desiredField) setLS(FIELD_KEY, payload.desiredField);\n      setLS(LAST_ID_KEY, id);\n      setLS(PENDING_CLOUD_DECK_KEY, JSON.stringify(payload));\n''',
              '''      setLS(EX_KEY, payload.exSupport);\n      // Always copy the field value too. An empty source value must clear the previous deck's field.\n      setLS(FIELD_KEY, payload.desiredField);\n\n      if (mode === "public") {\n        // A community deck is a clone source, never the user's current cloud-save target.\n        try { localStorage.removeItem(LAST_ID_KEY); } catch {}\n        try { localStorage.removeItem(DECKLIB_LAST_OPENED_KEY); } catch {}\n        try {\n          sessionStorage.setItem(\n            COMMUNITY_IMPORT_KEY,\n            JSON.stringify({ sourceId: id, title: payload.title, importedAt: Date.now() }),\n          );\n        } catch {}\n      } else {\n        // Loading one's own deck keeps update semantics.\n        setLS(LAST_ID_KEY, id);\n        try { sessionStorage.removeItem(COMMUNITY_IMPORT_KEY); } catch {}\n      }\n      setLS(PENDING_CLOUD_DECK_KEY, JSON.stringify(payload));\n''',
              'deck_list load identity',
          )

          replace_once(
              'public/deck.js',
              'import { initDeckLibrary } from "./deck_library.js?v=20260822_deck_meta1";',
              'import { initDeckLibrary } from "./deck_library.js?v=20261005_community_fix1";',
              'deck library cache version',
          )

          replace_once(
              'public/deck.js',
              '''    if (snap.sourceId) {\n      try {\n        localStorage.setItem("tcg_cloud_deck_last_id_v20260204", String(snap.sourceId));\n      } catch {}\n    }\n''',
              '''    if (snap.sourceId) {\n      try {\n        let communityImport = null;\n        try {\n          const markerRaw = sessionStorage.getItem("tcg_community_deck_import_v20261005") || "";\n          communityImport = markerRaw ? JSON.parse(markerRaw) : null;\n        } catch {}\n        const isCommunityClone =\n          communityImport &&\n          String(communityImport.sourceId || "") === String(snap.sourceId);\n\n        if (isCommunityClone) {\n          // Keep provenance in sessionStorage only. Never point personal overwrite state at somebody else's deck.\n          localStorage.removeItem("tcg_cloud_deck_last_id_v20260204");\n          localStorage.removeItem("tcg_decklib_last_opened_id_v1");\n        } else {\n          localStorage.setItem("tcg_cloud_deck_last_id_v20260204", String(snap.sourceId));\n        }\n      } catch {}\n    }\n''',
              'deck pending source identity',
          )

          replace_once(
              'public/deck_library.js',
              'const LS_DEVICEKEY = "tcg_cloud_device_key_v20260204";\nconst DECK_LIST_PAGE_SIZE = 10;\n',
              'const LS_DEVICEKEY = "tcg_cloud_device_key_v20260204";\nconst COMMUNITY_IMPORT_KEY = "tcg_community_deck_import_v20261005";\nconst DECK_LIST_PAGE_SIZE = 10;\n',
              'deck library import marker',
          )

          replace_once(
              'public/deck_library.js',
              '''  btnNew?.addEventListener("click", () => uploadDeck({ overwrite: false }));\n  btnOw?.addEventListener("click", () => uploadDeck({ overwrite: true }));\n\n  // 初期表示\n''',
              '''  btnNew?.addEventListener("click", () => uploadDeck({ overwrite: false }));\n  btnOw?.addEventListener("click", () => uploadDeck({ overwrite: true }));\n\n  // Main "デッキ保存" should clone an imported community deck into a new personal slot.\n  // Normal personal-deck edits keep their existing behavior and are not duplicated.\n  let communityImportSaveBusy = false;\n  const mainDeckSaveBtn = $("btnSave");\n  mainDeckSaveBtn?.addEventListener("click", () => {\n    let marker = null;\n    try {\n      const raw = sessionStorage.getItem(COMMUNITY_IMPORT_KEY) || "";\n      marker = raw ? JSON.parse(raw) : null;\n    } catch {}\n    if (!marker?.sourceId || communityImportSaveBusy) return;\n\n    communityImportSaveBusy = true;\n    // Force new-save semantics even if an old/stale cloud id survived elsewhere.\n    setLS(LS_LAST_ID, "");\n\n    setTimeout(async () => {\n      try {\n        await uploadDeck({ overwrite: false });\n        const newId = getLS(LS_LAST_ID);\n        if (newId && newId !== String(marker.sourceId)) {\n          try { sessionStorage.removeItem(COMMUNITY_IMPORT_KEY); } catch {}\n          updateOverwriteState();\n        }\n      } finally {\n        communityImportSaveBusy = false;\n      }\n    }, 0);\n  });\n\n  // 初期表示\n''',
              'deck library main save clone',
          )

          replace_once(
              'public/deck_list.html',
              './deck_list.js?v=20260926_deck_critical3',
              './deck_list.js?v=20261005_community_fix1',
              'deck list cache version',
          )

          replace_once(
              'public/index.html',
              './deck.js?v=20260930_mobile_deck_stable3',
              './deck.js?v=20261005_community_fix1',
              'deck entry cache version',
          )
          PY

      - name: Syntax and regression checks
        run: |
          node --check public/deck.js
          node --check public/deck_list.js
          node --check public/deck_library.js
          python3 - <<'PY'
          from pathlib import Path
          dl = Path('public/deck_list.js').read_text(encoding='utf-8')
          d = Path('public/deck.js').read_text(encoding='utf-8')
          lib = Path('public/deck_library.js').read_text(encoding='utf-8')
          assert 'mode === "public"' in dl
          assert 'sessionStorage.setItem' in dl and 'COMMUNITY_IMPORT_KEY' in dl
          assert 'setLS(FIELD_KEY, payload.desiredField);' in dl
          assert 'if (payload.desiredField) setLS(FIELD_KEY' not in dl
          assert 'isCommunityClone' in d
          assert 'localStorage.removeItem("tcg_cloud_deck_last_id_v20260204")' in d
          assert 'communityImportSaveBusy' in lib
          assert 'await uploadDeck({ overwrite: false })' in lib
          assert 'sessionStorage.removeItem(COMMUNITY_IMPORT_KEY)' in lib
          print('community deck import/save regression checks passed')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/deck.js public/deck_list.js public/deck_library.js public/deck_list.html public/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "みんなのデッキ読み込み後の新規保存を修正"
          git push origin HEAD:fix/community-deck-load-save-20261005
