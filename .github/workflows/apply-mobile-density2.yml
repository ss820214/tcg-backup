name: Apply Mobile Density V2

on:
  push:
    branches:
      - automation/mobile-density2-20261003

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest working branch
        uses: actions/checkout@v4
        with:
          ref: import/local-latest-20261003
          fetch-depth: 0

      - name: Apply targeted mobile layout fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # 1) Root mobile refinement: stop fighting over Home/Deck/Settings.
          path = "public/deck_mobile_refine_20261003.js"
          s = read(path)
          s = s.replace('const VERSION = "20261003_refine2";', 'const VERSION = "20261003_refine3";', 1)
          pattern = re.compile(r'  function normalizeHeader\(\) \{.*?\n  \}\n\n  function normalizeFilters', re.S)
          repl = '''  function normalizeHeader() {
            const home = $("btnHome"), deckTop = $("btnDeckTop"), settings = $("btnSettings");
            if (home) {
              rememberText(home); home.hidden = false; setText(home, "ホーム"); home.setAttribute("aria-label", "ホームへ戻る");
            }
            if (deckTop) {
              rememberText(deckTop); deckTop.hidden = false; setText(deckTop, "デッキ"); deckTop.setAttribute("aria-label", "デッキ画面");
            }
            if (settings) {
              rememberText(settings); settings.hidden = true;
            }
          }

          function normalizeFilters'''
          s2, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit("normalizeHeader patch failed")
          write(path, s2)

          # 2) Density pass: beat the older mobile grid specificity and reduce text/space.
          path = "public/deck_mobile_density_20261003.js"
          s = read(path)
          s = s.replace('const VERSION = "20261003_density1";', 'const VERSION = "20261003_density2";', 1)
          marker = '  @media(max-width:380px){'
          if 'density2HighSpecificity' not in s:
              if marker not in s:
                  raise SystemExit("density CSS insertion marker missing")
              strong = r'''
