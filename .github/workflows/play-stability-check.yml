name: Deck Play Stability Check

on:
  push:
    branches:
      - test/play-stability-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check public/global_ui_20260821.js
          node --check public/deck_mobile_refine_20261003.js
          node --check public/deck_mobile_density_20261003.js
          node --check public/deck_runtime_guard_20261003.js

      - name: Start site
        run: |
          cd public
          nohup python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          curl --fail -I http://127.0.0.1:8000/deck.html

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Check mobile render, PLAY, and safe back
        run: |
          cat > /tmp/check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 460, height: 900 } });
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', msg => {
            if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
          });

          async function waitStable() {
            await page.waitForFunction(() =>
              document.documentElement.dataset.deckMobileDensity === '20261003_density2' &&
              document.documentElement.dataset.deckRuntimeGuardBound === '20261003_guard1' &&
              !!document.getElementById('btnSafeBack'),
              null,
              { timeout: 10000 }
            );
          }

          await page.goto('http://127.0.0.1:8000/deck.html?view=mobile', { waitUntil: 'domcontentloaded' });
          await waitStable();
          await page.waitForSelector('[data-home-action="play"]', { state: 'visible', timeout: 10000 });
          await page.click('[data-home-action="play"]');
          await page.waitForFunction(() => {
            const d = document.getElementById('roomDrawer');
            return !!d && d.classList.contains('open') && d.getAttribute('aria-hidden') === 'false';
          }, null, { timeout: 7000 });

          await page.click('#btnSafeBack');
          await page.waitForFunction(() => {
            const d = document.getElementById('roomDrawer');
            return !!d && !d.classList.contains('open') && d.getAttribute('aria-hidden') !== 'false';
          }, null, { timeout: 3000 });

          await page.click('#btnSafeBack');
          await page.waitForFunction(() => {
            const h = document.getElementById('deckStart');
            return !!h && !h.classList.contains('hide') && h.getAttribute('aria-hidden') !== 'true';
          }, null, { timeout: 5000 });

          await page.screenshot({ path: 'play-stability.png', fullPage: true });

          for (let i = 0; i < 3; i++) {
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitStable();
          }

          const critical = errors.filter(x => !/favicon|ERR_BLOCKED_BY_CLIENT/i.test(x));
          if (critical.length) {
            console.log('Browser errors observed:');
            critical.forEach(x => console.log(x));
          }

          await browser.close();
          EOF
          node /tmp/check.mjs

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: play-stability-check
          path: play-stability.png
          retention-days: 1
