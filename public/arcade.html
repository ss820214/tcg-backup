<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>0BATo - Arcade</title>
  <style>
    :root {
      --bg: #090b0f;
      --panel: rgba(255,255,255,.065);
      --panel2: rgba(255,255,255,.095);
      --line: rgba(255,255,255,.13);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --good: #73e6a6;
      --bad: #ff6f82;
      --gold: #ffd166;
      --blue: #89c7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      background:
        radial-gradient(920px 520px at 12% 0%, rgba(115,230,166,.14), transparent 55%),
        radial-gradient(760px 560px at 90% 4%, rgba(137,199,255,.12), transparent 52%),
        linear-gradient(180deg, #07090d, var(--bg) 52%, #07080b);
    }
    .wrap { width: min(1180px, calc(100vw - 28px)); margin: 0 auto; padding: 18px 0 34px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255,255,255,.07);
      color: var(--text);
      font-weight: 900;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.12); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { border-color: rgba(115,230,166,.42); background: rgba(115,230,166,.14); }
    .gold { border-color: rgba(255,209,102,.42); background: rgba(255,209,102,.13); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      padding: 14px;
      min-width: 0;
      box-shadow: 0 18px 54px rgba(0,0,0,.28);
    }
    .panel h2 { margin: 0 0 10px; font-size: 14px; color: rgba(255,255,255,.78); }
    .setup { display: grid; gap: 12px; }
    .difficulty { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .difficulty button.active {
      border-color: rgba(115,230,166,.64);
      box-shadow: 0 0 0 2px rgba(115,230,166,.12);
      background: rgba(115,230,166,.18);
    }
    .map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .node {
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 10px;
      padding: 10px;
      background: rgba(0,0,0,.23);
      text-align: center;
      min-height: 74px;
    }
    .node b { display: block; font-size: 17px; }
    .node span { display: block; margin-top: 5px; font-size: 12px; color: var(--muted); }
    .node.active { border-color: var(--gold); box-shadow: 0 0 22px rgba(255,209,102,.18); }
    .node.clear { border-color: rgba(115,230,166,.42); background: rgba(115,230,166,.10); }
    .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .unit {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      padding: 10px;
      background: rgba(0,0,0,.20);
      min-height: 112px;
    }
    .unit.selected {
      border-color: rgba(255,209,102,.62);
      box-shadow: 0 0 0 1px rgba(255,209,102,.18), 0 0 22px rgba(255,209,102,.12);
    }
    .unit.dead { opacity: .45; filter: grayscale(.35); }
    .unitName { font-weight: 1000; line-height: 1.25; }
    .unitMeta { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .mini { color: var(--gold); font-size: 11px; font-weight: 900; }
    .command {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: rgba(0,0,0,.20);
    }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field label { color: var(--muted); font-size: 12px; }
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      background: rgba(0,0,0,.32);
      color: var(--text);
      outline: none;
      min-width: 0;
    }
    .bar { display: grid; grid-template-columns: 26px 1fr 52px; gap: 6px; align-items: center; margin-top: 6px; font-size: 11px; color: rgba(255,255,255,.75); }
    .track { height: 7px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; }
    .fill { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), rgba(255,255,255,.78)); }
    .fill.hp { background: linear-gradient(90deg, var(--good), rgba(255,255,255,.78)); }
    .log {
      margin: 0;
      min-height: 260px;
      max-height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.55;
      color: rgba(255,255,255,.82);
      background: rgba(0,0,0,.28);
      border-radius: 10px;
      padding: 12px;
    }
    .status { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .reward { color: var(--gold); font-weight: 1000; }
    @media (max-width: 880px) {
      header { align-items: flex-start; flex-direction: column; }
      .top { justify-content: flex-start; }
      .grid, .teams, .command { grid-template-columns: 1fr; }
      .difficulty, .map { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="./global_ui_20260821.css?v=20260926_device_switch4" />
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>繧｢繝ｼ繧ｱ繝ｼ繝峨Δ繝ｼ繝・/h1>
        <div class="sub">30譫壹ョ繝・く縺九ｉ5譫壹ラ繝ｭ繝ｼ縺励※縲・繝ｩ繧ｦ繝ｳ繝峨ｒ遯∫ｴ縺吶ｋ遏ｭ譛滓姶縲・/div>
      </div>
      <div class="top">
        <span class="status">Gems: <b id="gems">-</b></span>
        <button id="btnDeck" type="button">繝・ャ繧ｭ縺ｸ</button>
        <button id="btnProfile" type="button">繝ｦ繝ｼ繧ｶ繝ｼ</button>
      </div>
    </header>

    <main class="grid">
      <section class="panel setup">
        <h2>繝ｩ繝ｳ險ｭ螳・/h2>
        <div class="status" id="deckStatus">繝・ャ繧ｭ遒ｺ隱堺ｸｭ...</div>
        <div class="difficulty" id="difficulty">
          <button type="button" data-diff="easy">EASY<br><span class="status">蝣ｱ驟ｬ120</span></button>
          <button type="button" data-diff="normal" class="active">NORMAL<br><span class="status">蝣ｱ驟ｬ200</span></button>
          <button type="button" data-diff="hard">HARD<br><span class="status">蝣ｱ驟ｬ350</span></button>
        </div>
        <div class="map" id="roundMap"></div>
        <button id="btnStart" class="primary" type="button">繝ｩ繝ｳ髢句ｧ・/button>
        <button id="btnNext" class="gold" type="button" disabled>谺｡縺ｮ繝ｩ繧ｦ繝ｳ繝・/button>
        <div class="status" id="runStatus"></div>
      </section>

      <section class="panel">
        <h2>謌ｦ蝣ｴ</h2>
        <div class="teams">
          <div>
            <h2>閾ｪ霆・/h2>
            <div id="party"></div>
          </div>
          <div>
            <h2>謨ｵ霆・/h2>
            <div id="enemies"></div>
          </div>
        </div>
        <div id="commandPanel" class="command" hidden>
          <div class="field">
            <label for="actorSelect">閾ｪ霆・/label>
            <select id="actorSelect"></select>
          </div>
          <div class="field">
            <label for="actionSelect">謚</label>
            <select id="actionSelect"></select>
          </div>
          <div class="field">
            <label for="targetSelect">蟇ｾ雎｡</label>
            <select id="targetSelect"></select>
          </div>
          <button id="btnRoll" class="primary" type="button">繝繧､繧ｹ繝ｭ繝ｼ繝ｫ</button>
        </div>
      </section>

      <section class="panel" style="grid-column:1 / -1;">
        <h2>繝ｭ繧ｰ</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>
  </div>

  <script type="module" src="./arcade.js?v=20260723_starter_series1"></script>
  <script src="./player_journey.js?v=20260801_journey1"></script>
  <script src="./ttcg_command.js?v=20260819_cmd_hidden1"></script>
  <script src="./ui_polish.js?v=20260801_screen_nav_mobile1"></script>
  <script src="./dopagaki_mode.js?v=20260728_tech1"></script>

  <script src="./global_ui_20260821.js?v=20260926_device_switch4" defer></script>
</body>
</html>
