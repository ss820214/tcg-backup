<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>0BATo - ログイン</title>
  <style>
    :root{
      --bg:#071017;
      --panel:#0d1821;
      --panel2:#111f2a;
      --line:rgba(255,255,255,.12);
      --text:#f6fbff;
      --muted:rgba(246,251,255,.65);
      --accent:#75d7ff;
      --accent2:#79f0b8;
      --bad:#ff8194;
    }
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;overflow-x:hidden}
    body{
      margin:0;
      color:var(--text);
      font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
      background:
        radial-gradient(700px 420px at 15% 0%,rgba(117,215,255,.13),transparent 58%),
        radial-gradient(620px 400px at 90% 8%,rgba(121,240,184,.09),transparent 60%),
        linear-gradient(180deg,#09121a,var(--bg));
    }
    button,input{font:inherit;color:inherit}
    .screen{
      width:min(920px,calc(100vw - 24px));
      margin:0 auto;
      padding:max(18px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom));
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(340px,430px);
      gap:26px;
      align-items:center;
      min-height:100vh;
    }
    .brand{min-width:0;padding:8px 4px}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:34px;
      padding:0 10px;
      border:1px solid rgba(117,215,255,.28);
      border-radius:999px;
      background:rgba(117,215,255,.08);
      color:#cfefff;
      font-size:12px;
      font-weight:900;
    }
    .brand h1{
      margin:16px 0 0;
      font-size:clamp(36px,6vw,72px);
      line-height:.98;
      letter-spacing:-.03em;
    }
    .brand p{
      margin:15px 0 0;
      max-width:560px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }
    .brandLinks{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:18px;
    }
    .brandLinks a{
      min-height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
      border:1px solid var(--line);
      border-radius:11px;
      background:rgba(255,255,255,.05);
      color:var(--text);
      text-decoration:none;
      font-weight:850;
      font-size:13px;
    }
    .panel{
      min-width:0;
      width:100%;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg,rgba(17,31,42,.96),rgba(10,19,27,.96));
      box-shadow:0 24px 70px rgba(0,0,0,.36);
    }
    .panelHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:15px 16px;
      border-bottom:1px solid var(--line);
    }
    .panelTitle{font-size:18px;font-weight:950}
    .status{
      max-width:150px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:var(--muted);
      font-size:11px;
    }
    .tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:12px 14px 4px;
    }
    .tab{
      min-width:0;
      min-height:44px;
      border:1px solid var(--line);
      border-radius:11px;
      background:rgba(255,255,255,.04);
      color:var(--muted);
      font-weight:900;
    }
    .tab[aria-selected="true"]{
      color:white;
      border-color:rgba(117,215,255,.48);
      background:rgba(117,215,255,.13);
      box-shadow:inset 0 -2px 0 rgba(117,215,255,.62);
    }
    form{padding:4px 14px 14px}
    label{
      display:block;
      margin:13px 0 6px;
      color:var(--muted);
      font-size:12px;
      font-weight:850;
    }
    .idRow{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px;
      align-items:stretch;
    }
    input{
      width:100%;
      min-width:0;
      height:46px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(0,0,0,.20);
      padding:0 12px;
      outline:none;
      font-size:16px;
    }
    input:focus{
      border-color:rgba(117,215,255,.55);
      box-shadow:0 0 0 3px rgba(117,215,255,.10);
    }
    .miniBtn{
      min-width:68px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.055);
      font-weight:900;
      padding:0 12px;
    }
    .hint{
      margin-top:6px;
      color:rgba(246,251,255,.48);
      font-size:11px;
      line-height:1.55;
    }
    .primary{
      width:100%;
      min-height:48px;
      margin-top:16px;
      border:1px solid rgba(121,240,184,.42);
      border-radius:11px;
      background:linear-gradient(135deg,rgba(117,215,255,.18),rgba(121,240,184,.18));
      font-weight:950;
      font-size:16px;
    }
    button{cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    .subActions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:9px;
    }
    .linkBtn,.deckTextLink{
      min-width:0;
      min-height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.035);
      color:#cfefff;
      text-decoration:none;
      font-size:12px;
      font-weight:850;
      padding:0 9px;
    }
    #btnBack{grid-column:1/-1}
    .message{
      min-height:46px;
      margin-top:11px;
      padding:10px 11px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(0,0,0,.18);
      color:var(--muted);
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      font-size:12px;
      line-height:1.5;
    }
    .message.ok{color:var(--accent2);border-color:rgba(121,240,184,.28)}
    .message.bad{color:var(--bad);border-color:rgba(255,129,148,.30)}
    .account{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:0 14px 14px;
    }
    .accountCell{
      min-width:0;
      padding:9px 10px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:10px;
      background:rgba(0,0,0,.14);
    }
    .k{color:var(--muted);font-size:10px}
    .v{
      margin-top:3px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:12px;
      font-weight:900;
    }
    @media(max-width:760px){
      .screen{
        width:calc(100vw - 16px);
        min-height:auto;
        grid-template-columns:1fr;
        gap:12px;
        padding-top:max(10px,env(safe-area-inset-top));
      }
      .brand{
        padding:4px 4px 0;
        text-align:center;
      }
      .eyebrow{min-height:30px}
      .brand h1{
        margin-top:10px;
        font-size:29px;
        line-height:1.05;
      }
      .brand h1 br{display:none}
      .brand p{
        margin:9px auto 0;
        max-width:480px;
        font-size:12px;
        line-height:1.55;
      }
      .brandLinks{
        margin-top:10px;
        justify-content:center;
      }
      .brandLinks a{
        min-height:38px;
        flex:1 1 140px;
        max-width:220px;
      }
      .panel{
        border-radius:14px;
        max-width:520px;
        margin:0 auto;
      }
      .panelHead{padding:12px 13px}
      .panelTitle{font-size:16px}
      .tabs{padding:10px 12px 3px}
      form{padding:3px 12px 12px}
      .account{padding:0 12px 12px}
    }
    @media(max-width:380px){
      .idRow{grid-template-columns:1fr}
      .miniBtn{height:42px}
      .subActions{grid-template-columns:1fr}
      #btnBack{grid-column:auto}
      .account{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="brand" aria-label="0BATo">
      <div class="eyebrow">0BATo PLAYER GATE</div>
      <h1>ログイン / 新規登録</h1>
      <p>
        プレイヤーIDとPINを登録すると、デッキ保存などのクラウド機能を利用できます。
        ゲストのまま遊ぶこともできますが、クラウドへのデッキ保存はできません。
      </p>
      <div class="brandLinks">
        <a href="./deck.html">デッキ作成へ戻る</a>
        <a href="./index.html">ホームへ</a>
      </div>
    </section>

    <section class="panel" aria-label="ログインフォーム">
      <div class="panelHead">
        <div class="panelTitle">アカウント</div>
        <div id="authState" class="status">接続確認中</div>
      </div>

      <div class="tabs" role="tablist" aria-label="ログイン種別">
        <button id="tabLogin" class="tab" type="button" role="tab" aria-selected="true">ログイン</button>
        <button id="tabRegister" class="tab" type="button" role="tab" aria-selected="false">新規登録</button>
      </div>

      <form id="loginForm">
        <label for="name">プレイヤーID</label>
        <div class="idRow">
          <input id="name" maxlength="16" autocomplete="username" placeholder="例: obato_217" />
          <button id="btnSuggest" class="miniBtn" type="button">候補</button>
        </div>
        <div class="hint">英数字と _ の3〜16文字。ログインでは未登録IDを自動作成しません。</div>

        <label for="pin">PIN</label>
        <input id="pin" maxlength="8" inputmode="numeric" autocomplete="current-password" pattern="[0-9]*" placeholder="4〜8桁" />
        <div class="hint">この端末の匿名UIDにプレイヤープロフィールを紐づけます。</div>

        <button id="btnSubmit" class="primary" type="submit">ログインする</button>

        <div class="subActions">
          <button id="btnUseSaved" class="linkBtn" type="button">保存済みIDを入力</button>
          <a class="deckTextLink" href="./deck.html">デッキへ</a>
          <button id="btnBack" class="linkBtn" type="button">元の画面へ戻る</button>
        </div>

        <div id="msg" class="message">ログイン、または新規登録を選んでください。</div>
      </form>

      <div class="account">
        <div class="accountCell">
          <div class="k">保存済みID</div>
          <div id="savedName" class="v">なし</div>
        </div>
        <div class="accountCell">
          <div class="k">UID</div>
          <div id="uidView" class="v">未接続</div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./login.js?v=20261007_mobile2"></script>
</body>
</html>
